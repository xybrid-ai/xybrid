[package]
name = "integration-tests"
version.workspace = true
edition.workspace = true
publish = false

[features]
default = []

# Candle (pure-Rust ML) backend — gates tests/whisper_candle_integration.rs.
# Off by default because it pulls candle-core/nn/transformers into the build;
# CI turns it on in the Test Candle workflow.
candle = ["xybrid-core/candle"]

# whisper.cpp ASR backend — gates tests/whispercpp_integration.rs. The real
# multilingual model is downloaded only by the dedicated model-test workflow.
asr-whispercpp = ["xybrid-core/asr-whispercpp"]

# Local LLM inference
llm-mistral = ["xybrid-core/llm-mistral"]              # mistral.rs (CPU)
llm-mistral-metal = ["xybrid-core/llm-mistral-metal"]  # mistral.rs + Metal (macOS)
llm-mistral-cuda = ["xybrid-core/llm-mistral-cuda"]    # mistral.rs + CUDA (NVIDIA)
llm-llamacpp = ["xybrid-core/llm-llamacpp"]            # llama.cpp (links native backend)

[dependencies]
xybrid-core = { path = "../crates/xybrid-core" }
tokio = { version = "1.0", features = ["full"] }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
log = "0.4"
env_logger = "0.10"
dirs = "6.0"

[dev-dependencies]
# tests/system_validation.rs drives the public SDK end to end. It lives here
# rather than in xybrid-core because core must not depend on the sdk (see the
# note in crates/xybrid-core/Cargo.toml); this crate sits above both, so the
# dependency direction stays one-way.
xybrid-sdk = { path = "../crates/xybrid-sdk" }
tempfile = "3.8"
filetime = "0.2"
