[workspace]
resolver = "2"
members = [
    "crates/xybrid",
    "crates/xybrid-core",
    "crates/xybrid-sdk",
    "crates/xybrid-ffi-facade",
    "crates/xybrid-bolt",
    "crates/xybrid-cli",
    "crates/llama-cpp-sys",
    "crates/whisper-cpp-sys",
    "crates/xybrid-llama",
    "crates/xybrid-whisper",
    "bindings/flutter/rust",
    "macros",
    "xtask",
    "integration-tests",
]

[workspace.package]
version = "0.5.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/xybrid-ai/xybrid"
homepage = "https://github.com/xybrid-ai/xybrid"
documentation = "https://docs.rs/xybrid-core"

[workspace.dependencies]
# Internal crates
xybrid-core = { path = "crates/xybrid-core" }
xybrid-cli = { path = "crates/xybrid-cli" }
xybrid-sdk = { path = "crates/xybrid-sdk" }
xybrid-macros = { path = "macros" }

# Common dependencies
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
anyhow = "1.0"
thiserror = "1.0"
tokio = { version = "1.0", features = ["rt", "rt-multi-thread", "sync"] }

# Optimize external dependencies even in dev builds. Workspace crates keep
# opt-level 0 (fast incremental compiles); candle/ort/tokenizers get real
# codegen. Without this, a `flutter run` debug build ships unoptimized
# inference kernels — measured on a Pixel 8: one 5 s Whisper-tiny window took
# minutes in debug versus ~3.5 s in release. Cost is a slower first cold
# build; dependency artifacts are cached after that. `debug = false` because
# optimized dependency artifacts with full debuginfo are enormous (a single
# Android cargokit build exceeded 45 GB); workspace crates keep their
# debuginfo, dependencies keep their names in backtraces via symbols only.
[profile.dev.package."*"]
opt-level = 3
debug = false
