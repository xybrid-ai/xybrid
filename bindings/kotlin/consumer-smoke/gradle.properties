org.gradle.jvmargs=-Xmx2g
android.useAndroidX=true

# Maven Central answers bursts of CI traffic with 429 Too Many Requests
# (2026-11-21 and 11-23: consumer-smoke's classpath and the Kotlin publish
# validation's com.vanniktech.maven.publish plugin failed to resolve). Gradle
# retries a 429, but by default makes 3 attempts in all, backing off 1 s then
# 2 s. Five attempts from 2 s wait up to 30 s. Gradle never disables a
# repository on a 429, so that wait is paid per module and per repository: a
# throttle that outlasts it fails the build several times more slowly than
# before. These are Gradle-internal names, as read by the Gradle 8.5 wrapper
# (bindings/kotlin/gradle/wrapper); recheck them on a wrapper bump.
systemProp.org.gradle.internal.repository.max.tentatives=5
systemProp.org.gradle.internal.repository.initial.backoff=2000
