// The Android half of react-native-xybrid: a TurboModule (XybridModule.kt)
// over the Kotlin SDK. The SDK — Kotlin classes plus libxybrid_bolt.so and the
// ONNX Runtime — comes from the `ai.xybrid:xybrid-kotlin` AAR on Maven
// Central, so nothing native is built or staged here.

buildscript {
  ext.xybridExt = { name, fallback ->
    rootProject.ext.has(name) ? rootProject.ext.get(name) : fallback
  }
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
    // The host app's versions win when it already has these on its classpath.
    classpath "com.android.tools.build:gradle:8.7.3"
    classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:${xybridExt('kotlinVersion', '2.0.21')}"
  }
}

apply plugin: "com.android.library"
apply plugin: "kotlin-android"
// Runs Codegen for this library's spec (`codegenConfig` in package.json):
// generates the `NativeXybridSpec` base class XybridModule extends, and the
// `react_codegen_RNXybridSpec` JNI target autolinking wires into the app.
// The host app's settings.gradle makes the plugin available.
apply plugin: "com.facebook.react"

android {
  namespace "ai.xybrid.reactnative"
  compileSdkVersion xybridExt("compileSdkVersion", 35)

  defaultConfig {
    minSdkVersion xybridExt("minSdkVersion", 24)
    targetSdkVersion xybridExt("targetSdkVersion", 35)
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  kotlinOptions {
    jvmTarget = "17"
  }
}

repositories {
  google()
  mavenCentral()
}

dependencies {
  // Versioned by the host app's React Native Gradle plugin.
  implementation "com.facebook.react:react-android"
  implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.7.3"

  // The Kotlin SDK. Kept in lockstep with the workspace version by
  // tools/scripts/version-sync.sh (`just bump-version`).
  implementation "ai.xybrid:xybrid-kotlin:0.9.0"
}
