// React Native autolinking discovers this module via package.json.
// Mirrors the layout of community modules (e.g. react-native-mmkv): the
// module is consumable directly from a yarn install + gradle sync, without
// publishing to Maven Central first.
//
// Native artifacts (libxybrid_uniffi.so, ORT libs) and the UniFFI-generated
// Kotlin source land under android/libs/ and android/src/main/java/ai/xybrid/
// respectively, copied in by `cargo xtask build-react-native`. This is
// gitignored — the npm `prepare` script (or CI) is responsible for staging
// them before publish.

buildscript {
  ext.safeExtGet = { prop, fallback ->
    rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
  }
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
    classpath("com.android.tools.build:gradle:8.1.1")
    classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.22")
  }
}

apply plugin: "com.android.library"
apply plugin: "kotlin-android"

def isNewArchitectureEnabled() {
  return rootProject.hasProperty("newArchEnabled") &&
         rootProject.getProperty("newArchEnabled") == "true"
}

android {
  namespace "ai.xybrid.reactnative"
  compileSdkVersion safeExtGet("compileSdkVersion", 34)

  defaultConfig {
    minSdkVersion safeExtGet("minSdkVersion", 24)
    targetSdkVersion safeExtGet("targetSdkVersion", 34)

    // ABIs match what `cargo xtask build-android` produces.
    ndk {
      abiFilters "armeabi-v7a", "arm64-v8a", "x86_64"
    }
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  kotlinOptions {
    jvmTarget = "17"
  }

  sourceSets {
    main {
      // Pre-built .so files staged by xtask. We ship them inside the npm
      // package so consumers don't need a Rust toolchain.
      jniLibs.srcDirs("libs")
    }
  }

  buildFeatures {
    buildConfig true
  }
}

repositories {
  mavenCentral()
  google()
}

dependencies {
  // RN core. We pin a tested floor (matches the RN_VERSION the example app
  // bootstraps against) but leave the `+` so a host app on a later minor
  // wins. Without the floor, gradle can resolve to an ancient version that
  // predates the codegen surface we depend on. Bump in lockstep with the
  // example's RN_VERSION when upgrading.
  implementation "com.facebook.react:react-native:0.76.0+"

  implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.7.3"

  // JNA is what UniFFI's Kotlin bindings call into. The xybrid-kotlin
  // module pulls the same dep — keep versions aligned.
  implementation "net.java.dev.jna:jna:5.13.0@aar"
}
