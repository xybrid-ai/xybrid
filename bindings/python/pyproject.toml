[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xybrid"
version = "0.5.0"
description = "Python SDK for local-first xybrid inference"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Xybrid" }]
dependencies = []

[project.urls]
Homepage = "https://github.com/xybrid-ai/xybrid"
Documentation = "https://docs.xybrid.dev"

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["."]
include = ["xybrid*"]

[tool.setuptools.package-data]
xybrid = ["py.typed"]
# The generated package ships its type stubs plus the two binaries
# build-python-bolt.sh stages: the CPython bridge and the cdylib it dlopens.
# `_native.c` is build input, not a runtime artifact, so it stays out.
"xybrid._bolt" = ["py.typed", "*.pyi", "*.dylib", "*.so", "*.dll", "*.pyd"]
