# Purpose: On a v* tag, build the Unity native libraries for every platform and upload the bundles to the release.
name: "Release: Unity bundles"

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

permissions: read-all

jobs:
  #
  # Version check - verify all package versions match the git tag
  #
  check-version:
    name: Verify Version
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Check versions match git tag
        run: |
          ./tools/scripts/version-sync.sh --check
          TAG_VERSION=${GITHUB_REF#refs/tags/v}
          UNITY_VERSION=$(python3 -c "import json; print(json.load(open('bindings/unity/package.json'))['version'])")
          echo "Git tag version: $TAG_VERSION"
          echo "Unity package:   $UNITY_VERSION"
          if [ "$UNITY_VERSION" != "$TAG_VERSION" ]; then
            echo ""
            echo "ERROR: Version mismatch! Tag is v$TAG_VERSION but Unity package.json has $UNITY_VERSION"
            echo "Run 'just bump-version $TAG_VERSION' and commit before tagging."
            exit 1
          fi
          echo "Unity version matches v$TAG_VERSION"

  #
  # macOS native library builds (arm64 + x86_64)
  #
  build-unity-macos:
    name: Build macOS Libraries
    needs: [check-version]
    if: always() && (needs.check-version.result == 'success' || needs.check-version.result == 'skipped')
    runs-on: macos-14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          submodules: true

      # Unity's macOS native is built by Bazel — the same
      # //crates/xybrid-bolt:xybrid_bolt_cdylib target every other binding uses —
      # on this macos-14 runner because --config=macos-metal compiles the
      # llama.cpp Metal shaders locally (no Mac RBE; same as build-apple.yml).
      # bazelisk ships on macos runners and honors .bazelversion; local_tools
      # (rules_foreign_cc) needs cmake + pkg-config.
      - name: Install Bazel build tools
        run: |
          which cmake >/dev/null || brew install cmake
          which pkg-config >/dev/null || brew install pkg-config

      # Serve hermetic-llvm's pinned macOS SDK from cache: Apple's URL 403s
      # permanently and its only mirror throttles Actions runners. Analyzed on
      # every target platform, not just Apple ones — see the action.
      - name: Cache the pinned macOS SDK
        uses: ./.github/actions/bazel-repo-cache
        with:
          macos-sdk-mirror: ${{ vars.MACOS_SDK_MIRROR }}

      # Note: arm64 only. ORT has no x86_64-apple-darwin prebuilt; Intel Macs run
      # arm64 via Rosetta 2.
      # `-c opt` is required: --config=macos-metal sets the platform + Metal but
      # NOT compilation_mode (unlike the android configs), so without it Bazel
      # defaults to fastbuild — a non-optimized native. Matches the release
      # profile the replaced `build-ffi --release` shipped.
      - name: Build xybrid-bolt native (Bazel, Metal ON, opt)
        run: bazelisk build --config=macos-metal -c opt //crates/xybrid-bolt:xybrid_bolt_cdylib

      # Stage the Bazel output into the Unity plugins tree (copy + generate the
      # per-platform .meta) — the same staging build-ffi --deploy-unity did, just
      # fed from Bazel instead of cargo. Must match the build's `-c opt` so cquery
      # resolves the same (opt) output path.
      - name: Stage into Unity plugins
        run: |
          LIB=$(tools/scripts/bazel-output.sh //crates/xybrid-bolt:xybrid_bolt_cdylib --config=macos-metal -c opt)
          echo "Bazel output: $LIB"
          python3 tools/scripts/stage_unity_native.py \
            --lib "$LIB" \
            --target aarch64-apple-darwin

      - name: Strip debug symbols (macOS)
        run: strip -x bindings/unity/Runtime/Plugins/macOS/libxybrid_bolt.dylib

      - name: Verify deployed libraries
        run: |
          echo "macOS plugin directory:"
          ls -la bindings/unity/Runtime/Plugins/macOS/ || echo "WARNING: macOS plugin directory not found"
          echo ""
          echo "Checking architecture:"
          file bindings/unity/Runtime/Plugins/macOS/*.dylib || true

      - name: Upload macOS plugins
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unity-plugins-macos
          path: bindings/unity/Runtime/Plugins/macOS/
          if-no-files-found: error

  #
  # Windows native library build (x86_64)
  #
  build-unity-windows:
    name: Build Unity native (Windows)
    needs: [check-version]
    if: always() && (needs.check-version.result == 'success' || needs.check-version.result == 'skipped')
    # No Windows runner: the DLL is cross-compiled MSVC-ABI on Linux RBE
    # workers by //bazel/toolchains/windows_msvc, the same toolchain the
    # shipped Flutter windows native uses. Mirrors build-unity-linux below.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          submodules: true

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true

      - name: Configure BuildBuddy remote config
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: tools/scripts/write-buildbuddy-rc.sh remote

      # Serve hermetic-llvm's pinned macOS SDK from cache: Apple's URL 403s
      # permanently and its only mirror throttles Actions runners. Analyzed on
      # every target platform, not just Apple ones — see the action.
      - name: Cache the pinned macOS SDK
        uses: ./.github/actions/bazel-repo-cache
        with:
          macos-sdk-mirror: ${{ vars.MACOS_SDK_MIRROR }}

      - name: Build + stage Windows native (Bazel)
        run: |
          set -euo pipefail
          remote_args=()
          [[ -n "${REMOTE:-}" ]] && remote_args+=("$REMOTE")
          bazelisk build "${remote_args[@]}" --config=windows-msvc -c opt \
            //crates/xybrid-bolt:xybrid_bolt_cdylib
          LIB=$(tools/scripts/bazel-output.sh --ext dll //crates/xybrid-bolt:xybrid_bolt_cdylib \
            "${remote_args[@]}" --config=windows-msvc -c opt)
          echo "Bazel output: $LIB"
          python3 tools/scripts/stage_unity_native.py --lib "$LIB" --target x86_64-pc-windows-msvc

      - name: Stage ONNX Runtime (Windows)
        run: python3 tools/scripts/stage_unity_desktop_ort.py windows bindings/unity/Runtime/Plugins/Windows

      # No strip step: lld-link puts no debug data in the image (verified — the
      # DLL has no debug sections, only a reference to a .pdb we never ship),
      # unlike the cargo/MSVC build this replaces.
      - name: Verify deployed libraries
        run: |
          set -euo pipefail
          echo "Windows plugin directory:"
          PLUGINS=bindings/unity/Runtime/Plugins/Windows
          ls -la "$PLUGINS"
          test -f "$PLUGINS/xybrid_bolt.dll"
          test -f "$PLUGINS/onnxruntime.dll"
          test -f "$PLUGINS/onnxruntime.dll.meta"
          # The linux job ctypes-loads its ORT here; a Windows DLL cannot be
          # loaded on this host, so check the format instead. The bolt DLL is
          # load-tested for real by bazel-windows-msvc-smoke in bazel.yml.
          file "$PLUGINS/onnxruntime.dll" | grep -q 'PE32+.*x86-64' || { echo "ORT is not a PE32+ x86-64 DLL"; exit 1; }
          file "$PLUGINS/xybrid_bolt.dll" | grep -q 'PE32+.*x86-64' || { echo "bolt is not a PE32+ x86-64 DLL"; exit 1; }
          # Unity reaches the native purely through P/Invoke, so the export
          # table IS the contract — assert every EntryPoint the C# declares.
          python3 -m pip install --quiet --user pefile
          python3 tools/scripts/audit_windows_dll.py --dll "$PLUGINS/xybrid_bolt.dll" \
            --require-import vcruntime140.dll \
            --require-import msvcp140.dll \
            --require-exports-from-csharp bindings/unity/Runtime/Bolt/XybridBolt.cs
          echo "Windows Unity native: OK"

      - name: Upload Windows plugins
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unity-plugins-windows
          path: bindings/unity/Runtime/Plugins/Windows/
          if-no-files-found: error

  build-unity-linux:
    name: Build Linux Libraries
    needs: [check-version]
    if: always() && (needs.check-version.result == 'success' || needs.check-version.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          submodules: true

      # Bazel builds the Linux bolt cdylib — a host build on the ubuntu runner,
      # RBE cache-fed. ORT ships dynamically on Linux, so the following
      # stage_unity_desktop_ort.py step still bundles libonnxruntime.so beside it.
      # Bazel doesn't strip desktop libs, so the strip step below is kept.
      - name: Configure BuildBuddy remote config
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: tools/scripts/write-buildbuddy-rc.sh remote

      # Serve hermetic-llvm's pinned macOS SDK from cache: Apple's URL 403s
      # permanently and its only mirror throttles Actions runners. Analyzed on
      # every target platform, not just Apple ones — see the action.
      - name: Cache the pinned macOS SDK
        uses: ./.github/actions/bazel-repo-cache
        with:
          macos-sdk-mirror: ${{ vars.MACOS_SDK_MIRROR }}

      - name: Build + stage Linux native (Bazel)
        run: |
          set -euo pipefail
          remote_args=()
          [[ -n "${REMOTE:-}" ]] && remote_args+=("$REMOTE")
          bazelisk build "${remote_args[@]}" -c opt //crates/xybrid-bolt:xybrid_bolt_cdylib
          LIB=$(tools/scripts/bazel-output.sh //crates/xybrid-bolt:xybrid_bolt_cdylib "${remote_args[@]}" -c opt)
          echo "Bazel output: $LIB"
          python3 tools/scripts/stage_unity_native.py --lib "$LIB" --target x86_64-unknown-linux-gnu

      - name: Stage ONNX Runtime (Linux)
        run: >-
          python3 tools/scripts/stage_unity_desktop_ort.py linux
          bindings/unity/Runtime/Plugins/Linux

      - name: Strip debug symbols (Linux)
        run: strip --strip-unneeded bindings/unity/Runtime/Plugins/Linux/libxybrid_bolt.so

      - name: Verify deployed libraries
        run: |
          echo "Linux plugin directory:"
          PLUGINS=bindings/unity/Runtime/Plugins/Linux
          ls -la "$PLUGINS"
          test -f "$PLUGINS/libxybrid_bolt.so"
          test -f "$PLUGINS/libonnxruntime.so"
          test -f "$PLUGINS/libonnxruntime.so.meta"
          python3 -c "import ctypes; ctypes.CDLL('$PLUGINS/libonnxruntime.so')"
          echo "Linux ORT runtime loads successfully."

      - name: Upload Linux plugins
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unity-plugins-linux
          path: bindings/unity/Runtime/Plugins/Linux/
          if-no-files-found: error

  #
  # Android native library builds (arm64-v8a, armeabi-v7a, x86_64)
  #
  build-unity-android:
    name: Build Android Libraries
    needs: [check-version]
    if: always() && (needs.check-version.result == 'success' || needs.check-version.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          submodules: true

      # Android's bolt .so is built by Bazel from
      # //crates/xybrid-bolt:xybrid_bolt_cdylib, one build per ABI. On Android
      # that cdylib ships only here: the Kotlin AAR links the bolt staticlib into
      # its own JNI library. The Bazel link already strips, 16 KB-aligns, and
      # links libc++ statically (see cc_runtime_linkage and the android
      # rustc_flags in crates/xybrid-bolt/BUILD.bazel), so there's no cargo-ndk
      # or strip step here. Android builds remotely only (Linux RBE); creds come
      # from a gitignored try-import written from the BuildBuddy secret.
      - name: Configure BuildBuddy remote config
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: tools/scripts/write-buildbuddy-rc.sh remote

      # Serve hermetic-llvm's pinned macOS SDK from cache: Apple's URL 403s
      # permanently and its only mirror throttles Actions runners. Analyzed on
      # every target platform, not just Apple ones — see the action.
      - name: Cache the pinned macOS SDK
        uses: ./.github/actions/bazel-repo-cache
        with:
          macos-sdk-mirror: ${{ vars.MACOS_SDK_MIRROR }}

      # stage_unity_native.py copies each ABI's .so into
      # Runtime/Plugins/Android/<abi>/ and bundles the vendored ORT beside it
      # where vendor/ort-android has that ABI. No libc++_shared.so: Unity's
      # GameActivity packages its own, and Gradle rejects a second copy.
      - name: Build + stage Android natives (Bazel, per ABI)
        run: |
          set -euo pipefail
          remote_args=()
          if [[ -n "${REMOTE:-}" ]]; then
            remote_args+=("$REMOTE")
          fi
          for spec in \
            "aarch64-linux-android:android-arm64" \
            "armv7-linux-androideabi:android-armv7" \
            "x86_64-linux-android:android-x86_64"; do
            triple="${spec%%:*}"; cfg="${spec##*:}"
            echo "=== $triple ($cfg) ==="
            bazelisk build "${remote_args[@]}" --config="$cfg" //crates/xybrid-bolt:xybrid_bolt_cdylib
            LIB=$(tools/scripts/bazel-output.sh //crates/xybrid-bolt:xybrid_bolt_cdylib "${remote_args[@]}" --config="$cfg")
            echo "Bazel output: $LIB"
            python3 tools/scripts/stage_unity_native.py \
              --lib "$LIB" \
              --target "$triple"
          done

      # A Unity player may or may not package its own libc++_shared.so, so each
      # ABI must stand alone: no libc++_shared.so shipped or NEEDed, no C++
      # runtime imported or exported, the right ELF machine per ABI directory,
      # and 16 KB LOAD alignment. The runner's GNU readelf reads every ELF
      # architecture (see the script for the full rule set).
      - name: Verify deployed libraries
        run: |
          set -euo pipefail
          ls -laR bindings/unity/Runtime/Plugins/Android/
          readelf --version | head -1
          python3 tools/scripts/verify_unity_android_natives.py --require-abis \
            bindings/unity/Runtime/Plugins/Android

      - name: Upload Android plugins
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unity-plugins-android
          path: bindings/unity/Runtime/Plugins/Android/
          if-no-files-found: error

      # Stage everything the dlopen-gate job needs (x86_64 — the ABI the CI
      # emulator runs), so the gate job is a cheap emulator-only step with no
      # toolchain. Only libonnxruntime.so ships beside the bolt .so, so only it
      # is staged. The probe is a few lines of C and the strip mirrors AGP's, so
      # the runner image's preinstalled NDK serves; the shipped .so is built by
      # Bazel with its own pinned NDK (XYBRID_NDK_URL in .bazelrc).
      - name: Stage dlopen-gate artifacts (x86_64)
        run: |
          set -euo pipefail
          # The image's default NDK (r27, like the Bazel build and Unity 6's).
          NDK="${ANDROID_NDK_HOME:-${ANDROID_NDK_LATEST_HOME:-}}"
          [ -d "$NDK" ] || { echo "No preinstalled Android NDK on the runner"; exit 1; }
          grep Pkg.Revision "$NDK/source.properties"
          NDKBIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          SRC="bindings/unity/Runtime/Plugins/Android/x86_64"
          mkdir -p dlopen-gate
          cp "$SRC/libxybrid_bolt.so" "$SRC/libonnxruntime.so" dlopen-gate/
          # AGP-style strip, as the Unity player's Gradle build applies to
          # packaged native libs. The .so must still dlopen after it.
          cp "$SRC/libxybrid_bolt.so" dlopen-gate/libxybrid_bolt.stripped.so
          "$NDKBIN/llvm-strip" --strip-all dlopen-gate/libxybrid_bolt.stripped.so
          # Probe executable for the emulator's x86_64 ABI.
          "$NDKBIN/x86_64-linux-android24-clang" \
            tools/scripts/android-dlopen-probe.c -o dlopen-gate/android-dlopen-probe
          ls -la dlopen-gate

      # Not unity-plugins-*: package-unity downloads that pattern into the SDK.
      - name: Upload dlopen-gate artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unity-android-dlopen-gate
          path: dlopen-gate/
          if-no-files-found: error

  #
  # Android load test: dlopen the shipped x86_64 native on an emulator
  #
  # The verifier above reads the ELF; only the device loader proves the .so
  # loads. The gate dlopens it with RTLD_NOW, as built and after an AGP-style
  # strip, with only libonnxruntime.so beside it, so a C++ runtime import the
  # static link left behind fails here instead of in a Unity player whose
  # libc++_shared.so (if any) Xybrid doesn't control. x86_64 is the ABI a
  # GitHub KVM runner can emulate; the verifier covers the other ABIs.
  unity-android-dlopen-gate:
    name: Android dlopen gate (x86_64 emulator)
    needs: [build-unity-android]
    # build-unity-android runs via always() when check-version is skipped
    # (workflow_dispatch); without always() here that skip would carry over.
    if: always() && needs.build-unity-android.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      # KVM is required for a usable (hardware-accelerated) x86_64 emulator on
      # the Linux runner; without it boot times out.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Download dlopen-gate artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unity-android-dlopen-gate
          path: dlopen-gate

      # sdkmanager and the emulator tooling run on this JDK, as in the
      # build-android.yml gate, rather than whatever the image defaults to.
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v4
        with:
          distribution: temurin
          java-version: '17'

      # `android-emulator-runner` installs the "latest emulator" with a single,
      # un-retried `sdkmanager --install emulator` call. That download
      # intermittently lands corrupt on the runner and fails the whole job with
      # "Error on ZipFile unknown archive" — an infra hiccup, not a regression
      # in the .so this gate checks. Pre-install it here with retries (wiping
      # any partial download between attempts so a wedged cache can't be reused)
      # so a bad fetch can't sink the run; the action's own install then sees
      # the package already current and no-ops.
      - name: Pre-install Android Emulator (retry corrupt downloads)
        run: |
          set -u
          sdk="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          # `sdkmanager` isn't on PATH in a plain run step (the emulator-runner
          # action wires it up itself), so resolve it under the SDK root.
          sdkmanager="$(command -v sdkmanager || true)"
          if [ -z "$sdkmanager" ]; then
            sdkmanager="$(ls "$sdk"/cmdline-tools/latest/bin/sdkmanager \
              "$sdk"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1 || true)"
          fi
          if [ -z "$sdkmanager" ]; then
            echo "::error::sdkmanager not found under $sdk"; exit 1
          fi
          echo "using sdkmanager: $sdkmanager"
          for i in $(seq 1 3); do
            if yes | "$sdkmanager" --install emulator --channel=0; then
              echo "emulator installed (attempt $i)"
              exit 0
            fi
            echo "::warning::emulator install attempt $i failed; clearing partial download and retrying"
            rm -rf "$sdk/emulator" "$sdk/.temp" "$sdk/.downloadIntermediates" || true
            sleep 10
          done
          echo "::error::emulator install failed after 3 attempts"
          exit 1

      # api-level 35 = Android 15 bionic, which is strict enough to reject the
      # DT_GNU_HASH corruption the stripped variant guards against.
      # GATE_SIBLINGS: the Unity package ships no libc++_shared.so, so none is
      # pushed beside the .so.
      - name: dlopen the Unity native (as built + stripped)
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: |
            GATE_SIBLINGS="libonnxruntime.so" bash tools/scripts/android-dlopen-gate.sh dlopen-gate

  #
  # iOS native library build (arm64 static)
  #
  build-unity-ios:
    name: Build iOS Libraries
    needs: [check-version]
    if: always() && (needs.check-version.result == 'success' || needs.check-version.result == 'skipped')
    runs-on: macos-14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          submodules: true

      # iOS bolt STATICLIB (.a) is built by Bazel on this macos-14 runner —
      # --config=ios is Mac-local (iphoneos SDK + llama.cpp Metal shaders; no Mac
      # RBE), the SAME //crates/xybrid-bolt:xybrid_bolt_staticlib the Apple
      # xcframework already ships. ORT links statically (vendored), so no separate
      # ORT bundle. bazelisk ships on macos runners; local_tools (rules_foreign_cc)
      # needs cmake + pkg-config.
      - name: Install Bazel build tools
        run: |
          which cmake >/dev/null || brew install cmake
          which pkg-config >/dev/null || brew install pkg-config

      - name: Verify ORT iOS library
        run: |
          if [ ! -f "vendor/ort-ios/onnxruntime.xcframework/ios-arm64/libonnxruntime.a" ]; then
            echo "ERROR: ORT iOS library not found at vendor/ort-ios/onnxruntime.xcframework/ios-arm64/libonnxruntime.a"
            echo "Ensure the ort-ios submodule is checked out correctly."
            exit 1
          fi
          echo "ORT iOS library found."

      # Serve hermetic-llvm's pinned macOS SDK from cache: Apple's URL 403s
      # permanently and its only mirror throttles Actions runners. Analyzed on
      # every target platform, not just Apple ones — see the action.
      - name: Cache the pinned macOS SDK
        uses: ./.github/actions/bazel-repo-cache
        with:
          macos-sdk-mirror: ${{ vars.MACOS_SDK_MIRROR }}

      # --config=ios already sets compilation_mode=opt (unlike macos-metal), so
      # no explicit -c opt here.
      - name: Build iOS bolt staticlib (Bazel)
        run: bazelisk build --config=ios //crates/xybrid-bolt:xybrid_bolt_staticlib

      - name: Stage into Unity plugins
        run: |
          LIB=$(tools/scripts/bazel-output.sh //crates/xybrid-bolt:xybrid_bolt_staticlib --config=ios)
          echo "Bazel output: $LIB"
          python3 tools/scripts/stage_unity_native.py --lib "$LIB" --target aarch64-apple-ios

      - name: Strip debug symbols (iOS)
        run: strip -S bindings/unity/Runtime/Plugins/iOS/libxybrid_bolt.a

      - name: Verify deployed libraries
        run: |
          echo "iOS plugin directory:"
          ls -la bindings/unity/Runtime/Plugins/iOS/ || echo "WARNING: iOS plugin directory not found"
          echo ""
          echo "Checking file type:"
          file bindings/unity/Runtime/Plugins/iOS/*.a || true

      - name: Upload iOS plugins
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unity-plugins-ios
          path: bindings/unity/Runtime/Plugins/iOS/
          if-no-files-found: error

  #
  # Package all platform plugins into a single Unity SDK archive
  #
  package-unity:
    name: Package Unity SDK
    permissions:
      contents: write   # gh release upload of the packaged SDK tarball
    needs: [build-unity-macos, build-unity-windows, build-unity-linux, build-unity-ios, build-unity-android, unity-android-dlopen-gate]
    if: always() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Download all Unity plugin artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: unity-plugins-*
          path: downloaded-plugins

      - name: Assemble plugins into Unity package
        run: |
          # Create the target plugin directory
          mkdir -p bindings/unity/Runtime/Plugins

          # Map lowercase artifact names to Unity-standard capitalized directory names
          declare -A PLATFORM_MAP=(
            [macos]="macOS"
            [windows]="Windows"
            [linux]="Linux"
            [android]="Android"
            [ios]="iOS"
          )

          # Move each platform's plugins into the correct directory
          for platform_dir in downloaded-plugins/unity-plugins-*/; do
            ARTIFACT_NAME=$(basename "$platform_dir" | sed 's/unity-plugins-//')
            PLATFORM="${PLATFORM_MAP[$ARTIFACT_NAME]:-$ARTIFACT_NAME}"
            echo "Assembling $ARTIFACT_NAME → $PLATFORM..."
            mkdir -p "bindings/unity/Runtime/Plugins/$PLATFORM"
            cp -r "$platform_dir"/* "bindings/unity/Runtime/Plugins/$PLATFORM/"
          done

          echo ""
          echo "Final plugin directory structure:"
          find bindings/unity/Runtime/Plugins -type f | sort

      - name: Verify desktop runtime dependencies
        run: |
          set -euo pipefail
          PLUGINS=bindings/unity/Runtime/Plugins
          for path in \
            Windows/xybrid_bolt.dll \
            Windows/onnxruntime.dll \
            Windows/onnxruntime.dll.meta \
            Linux/libxybrid_bolt.so \
            Linux/libonnxruntime.so \
            Linux/libonnxruntime.so.meta; do
            test -f "$PLUGINS/$path" || { echo "Missing Unity runtime: $path"; exit 1; }
          done
          echo "Unity desktop bundles contain xybrid_bolt + ONNX Runtime."

      - name: Extract version
        id: version
        run: |
          VERSION=$(python3 -c "import json; print(json.load(open('bindings/unity/package.json'))['version'])")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Unity SDK version: $VERSION"

      # Per-platform native bundles consumed by the Unity editor
      # NativeLibraryResolver (bindings/unity/Editor/NativeLibraryResolver.cs).
      # This is the shell twin of `cargo xtask package-unity-natives` — kept in
      # shell so this bare runner needn't compile xtask (→ xybrid-core → ORT).
      # The manifest shape MUST match the resolver's `NativePlatform` model and
      # the xtask `UnityNativePlatform` struct; keep all three in sync.
      - name: Package Unity native resolver bundles
        run: |
          set -euo pipefail
          VERSION=${{ steps.version.outputs.version }}
          PLUGINS=bindings/unity/Runtime/Plugins
          mkdir -p dist
          # platform-key:PluginDir:primary-lib-relative-path ("" = any-ABI Android)
          MAPPINGS=(
            "macos:macOS:libxybrid_bolt.dylib"
            "windows:Windows:xybrid_bolt.dll"
            "linux:Linux:libxybrid_bolt.so"
            "ios:iOS:libxybrid_bolt.a"
            "android:Android:"
          )
          ENTRIES=()
          for m in "${MAPPINGS[@]}"; do
            KEY="${m%%:*}"; REST="${m#*:}"; DIR="${REST%%:*}"; LIB="${REST#*:}"
            SRC="$PLUGINS/$DIR"
            if [ "$KEY" = "android" ]; then
              PRESENT=false
              for abi in arm64-v8a armeabi-v7a x86_64; do
                [ -f "$SRC/$abi/libxybrid_bolt.so" ] && PRESENT=true
              done
            else
              PRESENT=false; [ -f "$SRC/$LIB" ] && PRESENT=true
            fi
            if [ "$PRESENT" != true ]; then
              echo "skip $KEY — no native at $SRC"; continue
            fi
            ASSET="xybrid-unity-native-${KEY}-v${VERSION}.zip"
            # zip root mirrors Runtime/Plugins/: <Dir>/... plus the folder .meta,
            # so the resolver extracts it verbatim into Assets/Xybrid/Plugins/.
            ZIP_ARGS=("$DIR")
            [ -f "$PLUGINS/$DIR.meta" ] && ZIP_ARGS+=("$DIR.meta")
            ( cd "$PLUGINS" && zip -r -q "$GITHUB_WORKSPACE/dist/$ASSET" "${ZIP_ARGS[@]}" )
            SHA=$(shasum -a 256 "dist/$ASSET" | awk '{print $1}')
            SIZE=$(wc -c < "dist/$ASSET" | tr -d ' ')
            echo "  ✓ $ASSET ($SIZE bytes)"
            ENTRIES+=("$KEY|$ASSET|$SHA|$SIZE")
          done
          if [ ${#ENTRIES[@]} -eq 0 ]; then
            echo "No Unity native platforms present to package"; exit 1
          fi
          MANIFEST="dist/xybrid-unity-natives-v${VERSION}.manifest.json"
          VERSION="$VERSION" python3 - "$MANIFEST" "${ENTRIES[@]}" <<'PY'
          import json, os, sys
          out, entries = sys.argv[1], sys.argv[2:]
          plats = []
          for e in entries:
              k, asset, sha, size = e.split("|")
              plats.append({"platform": k, "asset": asset, "sha256": sha, "size": int(size)})
          json.dump({"version": os.environ["VERSION"], "platforms": plats},
                    open(out, "w"), indent=2)
          PY
          echo "Wrote $MANIFEST (${#ENTRIES[@]} platform(s))"

      - name: Upload native resolver bundles to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION=${{ steps.version.outputs.version }}
          for i in $(seq 1 20); do
            if gh release view "v${VERSION}" > /dev/null 2>&1; then
              gh release upload "v${VERSION}" \
                dist/xybrid-unity-native-*.zip \
                "dist/xybrid-unity-natives-v${VERSION}.manifest.json" --clobber
              echo "Uploaded Unity native bundles + manifest to v${VERSION}."
              exit 0
            fi
            echo "Waiting for release v${VERSION}... (attempt $i/20)"
            sleep 30
          done
          echo "::warning::Release v${VERSION} not found within 10 min — native bundles are CI artifacts only."

      - name: Upload native bundles as CI artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unity-native-bundles
          path: dist/xybrid-unity-native*
          if-no-files-found: error
