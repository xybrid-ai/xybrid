name: Test Candle

# Candle is the pure-Rust ML framework gated behind a feature flag in
# xybrid-core. macOS is the only place its Metal backend can run, so this
# workflow lives outside ci.yml and is scoped to paths that can actually
# affect Candle compilation or runtime behavior.

on:
  push:
    branches: [master]
    paths:
      - 'crates/xybrid-core/src/runtime_adapter/candle/**'
      - 'crates/xybrid-core/src/audio/**'
      - 'crates/xybrid-core/Cargo.toml'
      - 'integration-tests/**'
      - 'Cargo.lock'
      - '.github/workflows/test-candle.yml'
  pull_request:
    branches: [master]
    paths:
      - 'crates/xybrid-core/src/runtime_adapter/candle/**'
      - 'crates/xybrid-core/src/audio/**'
      - 'crates/xybrid-core/Cargo.toml'
      - 'integration-tests/**'
      - 'Cargo.lock'
      - '.github/workflows/test-candle.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: read-all

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test-candle:
    name: Test Candle
    runs-on: macos-14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: candle
      - name: Test Candle (xybrid-core only)
        run: cargo test -p xybrid-core --features "ort-download,candle" --lib --tests

  # Real Whisper weights, real audio. The mel-windowing and per-request
  # language/task defects this guards against are both invisible without them,
  # so the job downloads whisper-tiny and sets XYBRID_REQUIRE_MODELS — with
  # that variable set, `fixtures::model_for_test` panics instead of skipping,
  # which is what keeps a silently failed download from leaving the suite green.
  test-candle-integration:
    name: Test Candle (integration, real model)
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: candle-integration

      # The registry bundle is a zstd tarball and download.sh parses the
      # resolve response with jq, so both have to exist before it runs. Present
      # on the image today; installed only if that changes.
      - name: Ensure download tooling (jq, zstd)
        run: |
          for tool in jq zstd; do
            command -v "$tool" >/dev/null || brew install "$tool"
          done

      # ~150 MB of weights, keyed on the manifest entry that decides which
      # bundle download.sh resolves. `download.sh --check` treats a model as
      # present when the directory holds model_metadata.json, which is exactly
      # what this restores.
      - name: Cache whisper-tiny
        id: cache-whisper-tiny
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: integration-tests/fixtures/models/whisper-tiny
          key: whisper-tiny-${{ runner.os }}-${{ hashFiles('integration-tests/fixtures/models/models.json') }}

      - name: Download whisper-tiny
        if: steps.cache-whisper-tiny.outputs.cache-hit != 'true'
        run: ./integration-tests/download.sh whisper-tiny

      # Scoped to this one test binary on purpose: the crate's other E2E files
      # gate on models this job does not download (wav2vec2, kokoro, the GGUF
      # LLMs), and XYBRID_REQUIRE_MODELS would turn each of their skips into a
      # failure.
      - name: Test Whisper end to end
        env:
          XYBRID_REQUIRE_MODELS: 1
        run: |
          cargo test -p integration-tests --features candle \
            --test whisper_candle_integration -- --nocapture
