# Purpose: The pull-request pipeline: repository checks, Rust format, lint, tests and feature matrix, binding drift, API contract, observability, Python and Web SDKs, and the backend lanes. Gates merges.
name: "CI: Workspace"

# The one workflow that validates pull requests (with bazel.yml). New coverage
# extends it: .github/workflows/README.md, "Adding CI".
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  # A manual run executes every job; `lanes` narrows the lanes, except on
  # master, where ci_gate.py ignores it and runs every lane.
  workflow_dispatch:
    inputs:
      lanes:
        description: Lanes to run, comma-separated (candle, llamacpp, policy_routing, whispercpp). Empty runs every lane.
        type: string
        required: false
        default: ''

# A pull request or manual run cancels its superseded run. A master push never
# does (its group is its commit): each push selects lanes from its own diff, so
# a later push would not run the earlier one's lanes again, and only master
# runs save the shared caches.
concurrency:
  group: ci-${{ github.event_name == 'push' && github.sha || github.event_name == 'workflow_dispatch' && format('dispatch-{0}', github.ref) || github.ref }}
  cancel-in-progress: true

permissions: read-all

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  tooling-changes:
    name: Detect CI-relevant changes
    runs-on: ubuntu-latest
    # One output per tools/scripts/ci_gate.py flag (PATH_FILTERS, LANE_PATHS).
    outputs:
      full_ci: ${{ steps.filter.outputs.full_ci }}
      ort_staging: ${{ steps.filter.outputs.ort_staging }}
      unity_bolt: ${{ steps.filter.outputs.unity_bolt }}
      python_sdk: ${{ steps.filter.outputs.python_sdk }}
      kotlin_jni: ${{ steps.filter.outputs.kotlin_jni }}
      apple_bolt: ${{ steps.filter.outputs.apple_bolt }}
      candle: ${{ steps.filter.outputs.candle }}
      whispercpp: ${{ steps.filter.outputs.whispercpp }}
      policy_routing: ${{ steps.filter.outputs.policy_routing }}
      llamacpp: ${{ steps.filter.outputs.llamacpp }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Check changed paths
        id: filter
        # pipefail: a ci_gate.py error must fail the step, not vanish into tee.
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
          LANES: ${{ inputs.lanes }}
          REF: ${{ github.ref }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            python3 tools/scripts/ci_gate.py dispatch "$LANES" --ref "$REF" | tee -a "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$EVENT_NAME" = "pull_request" ]; then
            gh api --paginate --slurp \
              "repos/$REPOSITORY/pulls/$PR_NUMBER/files" > "$RUNNER_TEMP/ci-files.json"
          else
            gh api "repos/$REPOSITORY/compare/$BEFORE_SHA...$CURRENT_SHA" > "$RUNNER_TEMP/ci-files.json"
          fi
          python3 tools/scripts/ci_gate.py changes "$EVENT_NAME" "$RUNNER_TEMP/ci-files.json" \
            | tee -a "$GITHUB_OUTPUT"

  kotlin-jni-drift:
    name: Kotlin and JNI generation drift
    needs: tooling-changes
    if: needs.tooling-changes.outputs.kotlin_jni == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: ./.github/actions/setup-rust
      - uses: ./.github/actions/install-boltffi
      - name: Compare committed Kotlin and JNI with fresh generation
        run: python3 tools/scripts/gen_kotlin_bolt.py --check

  # The committed Swift bindings and the C header the xcframework ships are
  # generator output, like Kotlin/Python/Unity — but until now they had no
  # drift gate, so a regeneration could silently disagree with the crate.
  # Generation is host-agnostic (boltffi + a cargo metadata build), so this
  # runs on Linux; the Swift *compile* stays on macOS in build-apple.yml.
  apple-bolt-drift:
    name: Swift and C header generation drift
    needs: tooling-changes
    if: needs.tooling-changes.outputs.apple_bolt == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: ./.github/actions/setup-rust
      - uses: ./.github/actions/install-boltffi
      - name: Compare committed Swift and C header with fresh generation
        run: bindings/apple/scripts/gen-bolt-bindings.sh --check

  # The committed Unity C# (bindings/unity/Runtime/Bolt) is generator output
  # like Kotlin/Swift/Python, but only its compile was gated: a bolt export or
  # doc-comment change could ship without regenerating it. Generation is
  # host-agnostic (boltffi + a cargo metadata build), so this runs on Linux;
  # the netstandard2.1 compile stays in unity-bolt-compile.
  unity-bolt-drift:
    name: Unity C# generation drift
    needs: tooling-changes
    if: needs.tooling-changes.outputs.unity_bolt == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: ./.github/actions/setup-rust
      - uses: ./.github/actions/install-boltffi
      - name: Compare committed Unity C# with fresh generation
        run: python3 tools/scripts/gen_unity_bolt_csharp.py --check

  # Stage the pinned ONNX Runtime the Unity desktop plugin ships and load it,
  # on the two hosts it ships for. The tooling unit tests run in repo-checks.
  tooling-tests:
    name: Tooling tests (${{ matrix.platform }})
    needs: tooling-changes
    if: needs.tooling-changes.outputs.ort_staging == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            python: python3
            runtime: libonnxruntime.so
          - os: windows-latest
            platform: windows
            python: python
            runtime: onnxruntime.dll
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Stage and load the real ONNX Runtime
        run: |
          ${{ matrix.python }} tools/scripts/stage_unity_desktop_ort.py ${{ matrix.platform }} "${{ runner.temp }}/unity-ort"
          ${{ matrix.python }} -c "import ctypes, sys; ctypes.CDLL(sys.argv[1])" "${{ runner.temp }}/unity-ort/${{ matrix.runtime }}"

  # Compile the committed BoltFFI C# bindings against Unity's frozen scripting
  # profile (netstandard2.1 + C# 9). Catches a boltffi output change or a missed
  # down-level in gen_unity_bolt_csharp.py at PR time instead of in the Editor.
  unity-bolt-compile:
    name: Compile Unity bolt bindings (netstandard2.1)
    needs: tooling-changes
    if: needs.tooling-changes.outputs.unity_bolt == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Compile bindings and check desktop native imports
        # ubuntu-latest ships SDK 8+ for the reflection check. Every build also
        # compiles netstandard2.1 with C# 9 to match Unity's scripting profile.
        run: |
          dotnet --version
          dotnet build tools/unity-bolt-compile-check/UnityBoltCompileCheck.csproj -c Release
          dotnet run --project tools/unity-bolt-compile-check/UnityBoltCompileCheck.csproj -c Release -f net8.0 --no-build -- xybrid_bolt
      - name: Check iOS player native imports
        run: |
          dotnet build tools/unity-bolt-compile-check/UnityBoltCompileCheck.csproj -c IOSPlayer -p:DefineConstants=UNITY_IOS
          dotnet run --project tools/unity-bolt-compile-check/UnityBoltCompileCheck.csproj -c IOSPlayer -f net8.0 --no-build -- __Internal
      - name: Check Unity Editor native imports with iOS selected
        run: |
          dotnet build tools/unity-bolt-compile-check/UnityBoltCompileCheck.csproj -c IOSEditor -p:DefineConstants=UNITY_IOS%3BUNITY_EDITOR
          dotnet run --project tools/unity-bolt-compile-check/UnityBoltCompileCheck.csproj -c IOSEditor -f net8.0 --no-build -- xybrid_bolt

  # The Python SDK is the one binding CI cannot test from the committed tree
  # alone: boltffi's Python target compiles a CPython bridge per interpreter,
  # and the cdylib that bridge dlopens needs boltffi's relink — a plain cargo
  # build omits the generated `boltffi_release_class_*` shims, so importing the
  # package fails on an unresolved symbol. This job installs the pinned CLI,
  # proves the committed bindings still match the crate, then builds and tests.
  python-sdk:
    name: Python SDK (ubuntu-latest)
    needs: tooling-changes
    if: needs.tooling-changes.outputs.python_sdk == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: ./.github/actions/setup-rust
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          # Floor of the SDK: boltffi's generated package needs >= 3.10.
          python-version: '3.12'
      - uses: ./.github/actions/install-boltffi
      - name: Check the committed bindings match the crate
        run: python3 tools/scripts/gen_python_bolt.py --check
      - name: Build and stage the native artifacts
        run: ./tools/scripts/build-python-bolt.sh
      - name: Install and test
        run: |
          python -m pip install -e './bindings/python[dev]'
          # The suite skips itself when the native bridge is unimportable, so
          # prove it loads first — otherwise a staging break reports green
          # having run nothing.
          python -c "import xybrid; print('xybrid', xybrid.version())"
          python -m pytest bindings/python/tests -q

  fmt:
    name: Format
    needs: tooling-changes
    if: needs.tooling-changes.outputs.full_ci == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: ./.github/actions/setup-rust
        with:
          components: rustfmt
          cache: 'false'
      - run: cargo fmt --all --check

  # Checks that take seconds and need no toolchain, on every change, docs-only
  # included: docs carry the install pins version-sync.sh keeps current, the
  # agent skills are Markdown, and a new workflow must not slip past the index
  # rules behind a path gate. A new check of this kind is a test under
  # tools/scripts/tests/, which this job discovers.
  repo-checks:
    name: Repo checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Workflow index and rules
        run: python3 tools/scripts/gen_workflow_index.py --check
      # Each check reports even when an earlier one failed.
      - name: Version sync
        if: ${{ !cancelled() }}
        run: bash tools/scripts/version-sync.sh --check
      # Includes test_install_pins.py, test_agent_skills.py and test_clean.py.
      - name: Tooling tests
        if: ${{ !cancelled() }}
        run: python3 -m unittest discover -s tools/scripts/tests -p 'test_*.py'

  clippy:
    name: Clippy
    needs: tooling-changes
    if: needs.tooling-changes.outputs.full_ci == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: ./.github/actions/setup-rust
        with:
          components: clippy
      - run: cargo clippy --workspace --all-targets -- -D warnings

  # Feature combination checks - ensure platform builds don't break
  check-no-default-features:
    needs: tooling-changes
    if: needs.tooling-changes.outputs.full_ci == 'true'
    name: check (no-default-features, ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: ubuntu-latest-no-default
      - name: Check without default features
        run: cargo check -p xybrid-core --no-default-features

  check-platform-macos:
    needs: tooling-changes
    if: needs.tooling-changes.outputs.full_ci == 'true'
    name: check (platform-macos, macos-latest)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: true
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: macos-platform-no-bin
          cache-bin: 'false'
      - name: Check platform-macos
        run: cargo check -p xybrid-sdk --features platform-macos
      - name: Test native Core ML bundle ownership
        run: cargo test -p xybrid-core --features coreml,ort-download --lib runtime_adapter::coreml::native::tests
      - name: Test native Core ML fixture
        run: cargo test -p integration-tests --features coreml --test coreml_native

  check-platform-desktop:
    needs: tooling-changes
    if: needs.tooling-changes.outputs.full_ci == 'true'
    name: check (platform-desktop, ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: true
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: ubuntu-platform-desktop
      - name: Check platform-desktop
        run: cargo check -p xybrid-sdk --features platform-desktop

  check-vision-platforms:
    needs: tooling-changes
    if: needs.tooling-changes.outputs.full_ci == 'true'
    name: check vision (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
            features: platform-desktop,llm-llamacpp-vision
            cache-key: linux-vision-platform
          - name: macos
            os: macos-latest
            features: platform-macos,llm-llamacpp-vision
            cache-key: macos-vision-platform
          - name: windows
            os: windows-latest
            features: platform-desktop,llm-llamacpp-vision
            cache-key: windows-vision-platform
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: true
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: ${{ matrix.cache-key }}
      - name: Check vision build without model artifacts
        run: cargo check -p xybrid-sdk --features ${{ matrix.features }}

  # Linux only. Windows cannot build ggml's `vulkan-shaders-gen` under cargo's
  # OUT_DIR: the nested CMake ExternalProject blows past MAX_PATH and MSBuild's
  # FileTracker fails (FTK1011). See the comment in llama-cpp-sys/build.rs.
  check-llamacpp-vulkan:
    needs: tooling-changes
    if: needs.tooling-changes.outputs.full_ci == 'true'
    name: check llama.cpp Vulkan (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    # 7-11 min warm. Without a bound, a stalled step holds the runner for
    # GitHub's 6 h default.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
            cache-key: linux-llamacpp-vulkan
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: true
      - uses: ./.github/actions/setup-vulkan-sdk
        timeout-minutes: 15
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: ${{ matrix.cache-key }}
      - name: Check llama.cpp Vulkan build
        env:
          XYBRID_LLAMA_CPP_VULKAN: "1"
        run: cargo check -p xybrid-sdk --features platform-desktop

  clippy-llm:
    needs: tooling-changes
    if: needs.tooling-changes.outputs.full_ci == 'true'
    name: clippy (llm-llamacpp, ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: true
      - uses: ./.github/actions/setup-rust
        with:
          components: clippy
          cache-key: ubuntu-clippy-llm
      # `--all-targets` is what compiles the examples. Without it the
      # llm-llamacpp examples (the tool-calling reference loops) are checked by
      # nobody: the plain `clippy` job passes --all-targets but not the feature,
      # so cargo skips them on `required-features`, and this job had the feature
      # but not the flag. That gap is how examples rot into a "fix examples that
      # do not compile" PR. Clippy stops at .rmeta, so there is no link step and
      # none of the disk pressure that made the test job skip examples.
      - name: Clippy with llm-llamacpp
        run: cargo clippy -p xybrid-core --features "ort-download,llm-llamacpp" --all-targets -- -D warnings

  test-llm:
    needs: tooling-changes
    if: needs.tooling-changes.outputs.full_ci == 'true'
    name: test (llm-llamacpp, ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: true
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: ubuntu-test-llm
      - name: Test with llm-llamacpp
        run: cargo test -p xybrid-core --features "ort-download,llm-llamacpp" --lib

  # Linux-only on push/PR. macOS + Windows validation runs in release-prep.yml
  # at release time, and check-platform-macos / build-apple.yml cover
  # Apple-specific compilation when bindings/apple changes.
  test:
    needs: tooling-changes
    if: needs.tooling-changes.outputs.full_ci == 'true'
    name: Test (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      # The full --workspace debug build compiles llama.cpp from source (hundreds
      # of model .cpp objects) on top of ort-download's ONNX Runtime and every
      # crate's test binaries, which exhausts the ~14 GB free on ubuntu-latest
      # (the libllama.a link fails with "No space left on device"). Reclaim space
      # from preinstalled toolchains this build never touches.
      - name: Free disk space
        uses: ./.github/actions/free-disk-space
        with:
          remove-android: 'true'

      - uses: ./.github/actions/setup-rust
        with:
          cache-key: ubuntu-latest-ort-download

      # Skip examples — they statically link llama.cpp + ort and exhaust
      # runner disk during link. `clippy --all-targets` already verifies
      # examples compile (it stops at .rmeta, so no link step) — but compiling
      # is all it does: an example's `#[cfg(test)]` module never runs here.
      # Examples that carry unit tests are opted in one at a time below.
      # `--doc` can't be combined with other target flags, so it runs separately.
      - name: Run tests (lib, bins, integration)
        run: cargo test --workspace --features ort-download --lib --bins --tests

      # `sentence_ranker` unit-tests its cosine-similarity and ranking helpers.
      # Selecting the single example keeps the no-examples policy above intact:
      # it needs no llm-llamacpp, and ort is load-dynamic on Linux, so the link
      # step is one small binary — not every example against llama.cpp. Add
      # another `--example <name>` here when an example gains tests that run
      # without llm-llamacpp; examples that need it belong in test-llm.
      - name: Run tests (examples with unit tests)
        run: cargo test -p xybrid-core --features ort-download --example sentence_ranker

      - name: Run doc tests
        run: cargo test --workspace --features ort-download --doc

      # The optional `huggingface` feature isn't covered by ort-download
      # above; run its unit tests (shared HF cache reuse) explicitly.
      - name: Run tests (huggingface cache integration)
        run: cargo test -p xybrid-sdk --features huggingface --lib

  # ---------------------------------------------------------------------------
  # Backend lanes. Each runs when one of its paths in ci_gate.py's LANE_PATHS
  # changes (any edit to this file, .github/actions/ or ci_gate.py runs them
  # all), with real weights fetched by .github/actions/fetch-model. They are in
  # ci_gate.ADVISORY_JOBS, so CI Success does not wait for them yet.
  # tools/scripts/llamacpp_update.py waits on three of these job names before
  # it cuts a llama.cpp release: never rename them.
  # ---------------------------------------------------------------------------

  # Candle is the pure-Rust ML framework behind xybrid-core's `candle` feature,
  # and macOS is the only place its Metal backend can run. The second half runs
  # real Whisper weights on real audio: the mel-windowing and per-request
  # language/task defects it guards against are invisible without them.
  test-candle:
    name: Test Candle
    needs: tooling-changes
    if: needs.tooling-changes.outputs.candle == 'true'
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - id: rust
        uses: ./.github/actions/setup-rust
        with:
          cache-key: candle
          per-image: 'true'
      - name: Test Candle (xybrid-core only)
        run: cargo test -p xybrid-core --features "ort-download,candle" --lib --tests
      # The real-model half was a job of its own: it still runs when the unit
      # tests fail.
      - id: model
        if: ${{ !cancelled() }}
        uses: ./.github/actions/fetch-model
        with:
          model: whisper-tiny
      # Scoped to this one test binary on purpose: the crate's other E2E files
      # gate on models this job does not download (wav2vec2, kokoro, the GGUF
      # LLMs), and XYBRID_REQUIRE_MODELS would turn each of their skips into a
      # failure. With it set, `fixtures::model_for_test` panics instead of
      # skipping, so a silently failed download cannot leave the suite green.
      - name: Test Whisper end to end
        if: ${{ !cancelled() && steps.rust.outcome == 'success' && steps.model.outcome == 'success' }}
        env:
          XYBRID_REQUIRE_MODELS: 1
        run: |
          cargo test -p integration-tests --features candle \
            --test whisper_candle_integration -- --nocapture

  # Real multilingual weights exercise behavior that compile-only lanes cannot:
  # translation, per-request language selection, long-window handling, and the
  # suppression of bracketed non-speech tokens in user-facing transcripts.
  test-whispercpp-integration:
    name: Test whisper.cpp (integration, real model)
    needs: tooling-changes
    if: needs.tooling-changes.outputs.whispercpp == 'true'
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: whispercpp-integration
          per-image: 'true'
      # The checksum pins the exact multilingual Q5_1 weights whose quality
      # thresholds this suite calibrates.
      - uses: ./.github/actions/fetch-model
        with:
          model: whisper-tiny-ggml
          sha256: 818710568da3ca15689e31a743197b520007872ff9576237bda97bd1b469c3d7
          file: ggml-tiny-q5_1.bin
      - name: Test Whisper end to end
        env:
          XYBRID_REQUIRE_MODELS: 1
        run: |
          cargo test -p integration-tests --features asr-whispercpp \
            --test whispercpp_integration -- --nocapture

  # Drives the real `xybrid` binary through a policy-routed hybrid stage: the
  # local leg is a real GGUF model (FunctionGemma 270M), the cloud leg is a
  # local fake DeepSeek endpoint. Compile-only lanes cannot prove that a policy
  # actually keeps a prompt on the device or actually sends it to the provider
  # with the right model, credential and options; this one does.
  test-policy-routing:
    name: Test policy routing (real local model, fake DeepSeek)
    needs: tooling-changes
    if: needs.tooling-changes.outputs.policy_routing == 'true'
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: true
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: policy-routing-integration
          per-image: 'true'
      # The checksum pins the exact Q8_0 weights the test is calibrated
      # against (integration-tests/fixtures/models/models.json).
      - uses: ./.github/actions/fetch-model
        with:
          model: functiongemma-270m-it
          sha256: 83940d4dd9676710856f43523bed096164a595a96f6b34771610a03937de5270
          file: functiongemma-270m-it-q8_0.gguf

      - name: CLI routing helpers (unit)
        run: cargo test -p xybrid-cli --bin xybrid commands::run

      - name: Policy routing end to end
        env:
          XYBRID_REQUIRE_MODELS: 1
        run: |
          # Enumerate and assert the required tests: printing `--list` alone
          # would still pass if every test were compiled out (cargo test exits
          # 0 on an empty set).
          LIST="$(cargo test -p xybrid-cli --features llm-llamacpp --test policy_routing_cli_test -- --list)"
          printf '%s\n' "$LIST"
          for test in \
            local_only_policy_runs_the_gguf_model \
            prefer_cloud_policy_calls_the_fake_deepseek_endpoint \
            dry_run_loads_policy_without_inference \
            cold_cache_hybrid_downloads_extracts_and_then_runs_offline; do
            printf '%s\n' "$LIST" | grep -qE "^${test}: test$" \
              || { echo "missing required test: ${test}" >&2; exit 1; }
          done
          cargo test -p xybrid-cli --features llm-llamacpp --test policy_routing_cli_test -- --nocapture

      - name: SDK streaming fast path (real GGUF fixture)
        env:
          XYBRID_REQUIRE_MODELS: 1
        run: |
          LIST="$(cargo test -p xybrid-sdk --features llm-llamacpp --test streaming_fast_path -- --list)"
          printf '%s\n' "$LIST"
          for test in \
            yaml_max_tokens_caps_streaming_generation \
            envelope_metadata_overrides_yaml_in_streaming \
            invalid_yaml_option_fails_before_any_token; do
            printf '%s\n' "$LIST" | grep -qE "^${test}: test$" \
              || { echo "missing required test: ${test}" >&2; exit 1; }
          done
          cargo test -p xybrid-sdk --features llm-llamacpp --test streaming_fast_path -- --nocapture

  # Checks the llama.cpp pins and generated bindings, then runs real text and
  # vision models on a source build (no prebuilt natives).
  llamacpp-validate:
    name: llama.cpp stable validation
    needs: tooling-changes
    if: needs.tooling-changes.outputs.llamacpp == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      XYBRID_NATIVES_FORCE_SOURCE: 1
      XYBRID_REQUIRE_MODELS: 1
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: true
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: llamacpp-stable-validation

      - name: Validate pin consistency and generated bindings
        run: |
          python3 tools/scripts/llamacpp_update.py check-pin
          python3 tools/scripts/llamacpp_update.py bindings --check

      # Downloaded on every run, as before: caching both models would take
      # several hundred MB of the repository's 10 GB.
      - uses: ./.github/actions/fetch-model
        with:
          model: functiongemma-270m-it
          sha256: 83940d4dd9676710856f43523bed096164a595a96f6b34771610a03937de5270
          file: functiongemma-270m-it-q8_0.gguf
          cache: 'false'
      - uses: ./.github/actions/fetch-model
        with:
          model: lfm2-vl-450m
          cache: 'false'

      - name: Require the vision model files before running tests
        run: |
          test -s integration-tests/fixtures/models/lfm2-vl-450m/LFM2-VL-450M-Q4_0.gguf
          test -s integration-tests/fixtures/models/lfm2-vl-450m/mmproj-LFM2-VL-450M-Q8_0.gguf

      - name: Test constrained text generation
        run: |
          LIST="$(cargo test -p integration-tests --features llm-llamacpp --test llamacpp_release -- --list)"
          printf '%s\n' "$LIST" | grep -qx 'text_generation_obeys_grammar: test'
          cargo test -p integration-tests --features llm-llamacpp --test llamacpp_release -- --nocapture

      - name: Test streamed text across token boundaries
        run: |
          LIST="$(cargo test -p xybrid-core --features llm-llamacpp,ort-download --test llamacpp_stream_text -- --list)"
          printf '%s\n' "$LIST" | grep -qx 'characters_split_into_byte_tokens_survive_on_functiongemma: test'
          printf '%s\n' "$LIST" | grep -qx 'text_ahead_of_a_stop_inside_a_token_is_streamed: test'
          # The FunctionGemma tests only: this job does not download
          # qwen3-0.6b, and XYBRID_REQUIRE_MODELS fails a missing model.
          cargo test -p xybrid-core --features llm-llamacpp,ort-download --test llamacpp_stream_text -- --nocapture functiongemma text_ahead_of_a_stop

      - name: Test real vision inference
        run: |
          LIST="$(cargo test -p xybrid-core --features llm-llamacpp-vision,ort-download --test vlm_lfm2_smoke -- --list)"
          printf '%s\n' "$LIST" | grep -qx 'lfm2_vl_runtime_caption_smoke_when_fixture_is_downloaded: test'
          cargo test -p xybrid-core --features llm-llamacpp-vision,ort-download --test vlm_lfm2_smoke -- --nocapture

  # (Retired) The cargo linux-CLI build lived here. The required Bazel check
  # ("Bazel graph + RBE targets", bazel.yml) now builds + smokes the linux CLI
  # on every Bazel-relevant PR, so this cargo build was redundant.

  # API contract validation (soft warning — does not block CI)
  api-contract:
    needs: tooling-changes
    if: needs.tooling-changes.outputs.full_ci == 'true'
    name: API Contract Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
      - name: Check API contract
        run: ./tools/scripts/api-contract-check.sh --check

  observability:
    needs: tooling-changes
    if: needs.tooling-changes.outputs.full_ci == 'true'
    name: Observability contract (Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: observability-contract
      - name: Test Rust instrumentation, transport and shared contract fixtures
        run: cargo test --locked -p xybrid-observability --features test-util
      - name: Check instrumentation without the optional exporter
        run: cargo check --locked -p xybrid-observability --no-default-features
      # `cargo test` builds no bench; this also compiles them with test-util.
      - name: Compile the overhead and memory benchmarks
        run: cargo check --locked -p xybrid-observability --benches --features test-util
      # The SDK lib test that steps the wall clock under a stream needs the
      # observability test clocks, which only xybrid-sdk's `test-util` enables.
      # No other lane builds the SDK with it, and Bazel builds
      # xybrid-observability without `test-util`.
      - name: Test SDK chunk timing across a wall-clock step
        run: cargo test --locked -p xybrid-sdk --features test-util --lib observability::tests::a_delivered_chunk_is_timed_on_the_operation_clock_across_a_wall_clock_step
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.9
      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.2.2 --activate
      - name: Install observability dependencies
        working-directory: bindings/observability-js
        run: pnpm install --frozen-lockfile
      - name: Check JS instrumentation and shared contract fixtures
        working-directory: bindings/observability-js
        run: |
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm pack:release
      - name: Check packed consumers against aligned OpenTelemetry 3.0 and 3.1 families
        working-directory: bindings/observability-js
        run: pnpm test:families

  web:
    needs: tooling-changes
    if: needs.tooling-changes.outputs.full_ci == 'true'
    name: Web SDK (Rust/WASM)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: true

      - name: Use Bazelisk
        uses: bazel-contrib/setup-bazel@4fd964a13a440a8aeb0be47350db2fc640f19ca8 # 0.15.0
        with:
          bazelisk-cache: true

      - name: Cache pinned Bazel downloads
        uses: ./.github/actions/bazel-repo-cache
        with:
          macos-sdk-mirror: ${{ vars.MACOS_SDK_MIRROR }}

      - name: Cache browser runtime build outputs
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .context/bazel-disk-cache
          key: web-wasm-${{ runner.os }}-${{ hashFiles('.bazelversion', 'MODULE.bazel', 'emsdk.patch', 'rules_rust.patch', 'BUILD.bazel', 'bindings/web/runtime/**', 'crates/xybrid-llama/**', 'crates/llama-cpp-sys/**') }}
          restore-keys: web-wasm-${{ runner.os }}-

      - name: Bound the browser build cache
        run: echo 'build --experimental_disk_cache_gc_max_size=536870912' >> .context/local.bazelrc

      - name: Use Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '22'

      - name: Use Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.9

      - name: Enable Corepack
        run: corepack enable

      - name: Activate pnpm
        run: corepack prepare pnpm@11.2.2 --activate

      - name: Install Web SDK dependencies
        working-directory: bindings/web
        run: pnpm install --frozen-lockfile

      - name: Lint Web SDK
        working-directory: bindings/web
        run: pnpm lint

      - name: Typecheck Web SDK
        working-directory: bindings/web
        run: pnpm typecheck

      - name: Test Web SDK
        working-directory: bindings/web
        run: pnpm test

      - name: Test package verification from a clean checkout
        working-directory: bindings/web
        run: pnpm test:release

      - name: Build Web SDK with CPU and WebGPU Rust runtimes
        id: web-build
        working-directory: bindings/web
        run: pnpm build

      - name: Pack and verify the Web SDK as an isolated npm consumer
        working-directory: bindings/web
        run: pnpm pack:release

      # The demo and browser suite use the same 92 MB GGUF. Preparation and
      # the SDK verify size/SHA-256; runtime assets are rebuilt from source.
      - name: Cache Web example model assets
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: bindings/web/example/public/model.gguf
          key: web-gguf-${{ hashFiles('bindings/web/example/model.ts') }}

      - name: Build Web example
        working-directory: bindings/web
        env:
          XYBRID_WEB_PACKAGE: test-results/npm/package
        run: pnpm build:example

      - name: Install Chromium
        working-directory: bindings/web
        run: pnpm exec playwright install --with-deps chromium

      - name: Test packaged Rust/WASM SDK in Chromium
        working-directory: bindings/web
        env:
          XYBRID_WEB_REPORT: test-results/runtime-measurements.json
        run: pnpm test:browser

      - name: Record JavaScript and WASM build sizes
        if: ${{ !cancelled() && steps.web-build.outcome == 'success' }}
        working-directory: bindings/web
        run: pnpm size

      - name: Upload Web SDK and browser measurements
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: xybrid-web-wasm
          path: |
            bindings/web/dist/
            bindings/web/test-results/
          if-no-files-found: warn
          retention-days: 7

  # All checks passed
  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    # Inspect dependency results even when the tooling path gate skips its matrix.
    if: ${{ !cancelled() }}
    # Every ci.yml job except ci_gate.ADVISORY_JOBS, one per line so
    # concurrent edits merge; test_ci_gate.py keeps the two in step.
    needs:
      - tooling-changes
      - repo-checks
      - tooling-tests
      - unity-bolt-compile
      - unity-bolt-drift
      - python-sdk
      - kotlin-jni-drift
      - apple-bolt-drift
      - fmt
      - clippy
      - check-no-default-features
      - check-platform-macos
      - check-platform-desktop
      - check-vision-platforms
      - check-llamacpp-vulkan
      - clippy-llm
      - test-llm
      - test
      - api-contract
      - observability
      - web
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Verify required job results
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python3 tools/scripts/ci_gate.py check <<<"$NEEDS_JSON"
