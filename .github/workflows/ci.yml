name: CI

on:
  push:
    branches: [master]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
      - 'LICENSE'
  pull_request:
    branches: [master]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
      - 'LICENSE'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: read-all

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # stable
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # stable
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  # Feature combination checks - ensure platform builds don't break
  check-no-default-features:
    name: check (no-default-features, ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: ubuntu-latest-no-default
      - name: Check without default features
        run: cargo check -p xybrid-core --no-default-features

  check-platform-macos:
    name: check (platform-macos, macos-latest)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: macos-platform-no-bin
          cache-bin: false
      - name: Check platform-macos
        run: cargo check -p xybrid-sdk --features platform-macos

  check-platform-desktop:
    name: check (platform-desktop, ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: ubuntu-platform-desktop
      - name: Check platform-desktop
        run: cargo check -p xybrid-sdk --features platform-desktop

  check-vision-platforms:
    name: check vision (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
            features: platform-desktop,llm-llamacpp-vision
            cache-key: linux-vision-platform
          - name: macos
            os: macos-latest
            features: platform-macos,llm-llamacpp-vision
            cache-key: macos-vision-platform
          - name: windows
            os: windows-latest
            features: platform-desktop,llm-llamacpp-vision
            cache-key: windows-vision-platform
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: ${{ matrix.cache-key }}
      - name: Check vision build without model artifacts
        run: cargo check -p xybrid-sdk --features ${{ matrix.features }}

  check-mlx-non-linking:
    name: check (llm-mlx non-linking, ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: ubuntu-mlx-non-linking
      - name: Check core MLX non-linking tier
        run: cargo check -p xybrid-core --no-default-features --features llm-mlx
      - name: Check SDK MLX non-linking tier
        run: cargo check -p xybrid-sdk --no-default-features --features llm-mlx
      - name: Check CLI MLX non-linking tier
        run: cargo check -p xybrid-cli --no-default-features --features llm-mlx
      - name: Test MLX selector and non-linking routing
        run: cargo test -p xybrid-core --no-default-features --features llm-mlx runtime_adapter::selector --lib
      - name: Test MLX executor non-linking routing
        run: cargo test -p xybrid-core --no-default-features --features llm-mlx execution::executor::tests::test_executor_dispatches_mlx_embedding_before_generic_safetensors_runtime --lib
      - name: Test SDK MLX registry-format selection
        run: cargo test -p xybrid-sdk --no-default-features --features llm-mlx registry_format --lib
      - name: Test CLI MLX registry-format selection
        run: cargo test -p xybrid-cli --no-default-features --features llm-mlx --bin xybrid
      - name: Check MLX benchmark non-linking build
        run: cargo bench -p xybrid-core --no-default-features --features llm-mlx --bench llm_backend_compare --no-run
      - name: Check MLX embedding benchmark non-linking build
        run: cargo bench -p xybrid-core --no-default-features --features llm-mlx --bench mlx_embedding --no-run
      - name: Test MLX xcframework fetch script pin status
        run: bash tools/scripts/test-fetch-mlx-xcframework.sh
      - name: Test MLX xcframework slice build script
        run: bash tools/scripts/test-build-mlx-slice.sh
      - name: Test local MLX xcframework source-build script
        run: bash tools/scripts/test-build-local-mlx-xcframework.sh
      - name: Test staged MLX fixture checks
        run: bash tools/scripts/test-integration-download-staged.sh
      - name: Test MLX benchmark wrapper host gates
        run: bash tools/scripts/test-bench-scripts.sh

  check-mlx-runtime-macos:
    name: check (llm-mlx-runtime, macos-14)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # stable
        with:
          toolchain: stable
          targets: aarch64-apple-ios
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: macos-mlx-runtime
      - name: Check iOS core MLX non-linking target
        run: |
          CARGO_TARGET_DIR="${RUNNER_TEMP}/xybrid-ios-mlx-non-linking-target" \
            cargo build -p xybrid-core --target aarch64-apple-ios --no-default-features --features llm-mlx
      - name: Check iOS MLX runtime gate
        run: bash tools/scripts/test-ios-mlx-runtime-gate.sh
      - name: Clean iOS MLX build artifacts
        run: rm -rf "${RUNNER_TEMP}/xybrid-ios-mlx-non-linking-target"
      - name: Check MLX xcframework pin status
        id: mlx_pin
        run: ./tools/scripts/fetch-mlx-xcframework.sh --check-published
      - name: Install MLX source-build tools
        if: steps.mlx_pin.outputs.published != 'true'
        run: |
          if ! command -v ninja >/dev/null 2>&1; then
            brew install ninja
          fi
          ninja --version
      - name: Build local macOS MLX xcframework from pins
        if: steps.mlx_pin.outputs.published != 'true'
        run: |
          set -euo pipefail
          echo "::notice::MLX xcframework download pin is unavailable; building a local macOS slice from pinned upstream SHAs for runtime CI."
          echo "release=${{ steps.mlx_pin.outputs.release }}"
          echo "sha256=${{ steps.mlx_pin.outputs.sha256 }}"
          ./tools/scripts/build-local-mlx-xcframework.sh
      - name: Fetch MLX xcframework
        if: steps.mlx_pin.outputs.published == 'true'
        run: ./tools/scripts/fetch-mlx-xcframework.sh
      - name: Check mlx-c-sys bindings
        run: cargo check -p mlx-c-sys --features bindings
      - name: Test mlx-c-sys bindings
        run: cargo test -p mlx-c-sys --features bindings
      - name: Check xybrid-mlx bindings
        run: cargo check -p xybrid-mlx --features bindings
      - name: Test xybrid-mlx bindings
        run: cargo test -p xybrid-mlx --features bindings
      - name: Clippy mlx-c-sys bindings
        run: cargo clippy -p mlx-c-sys --features bindings --all-targets -- -D warnings
      - name: Clippy xybrid-mlx bindings
        run: cargo clippy -p xybrid-mlx --features bindings --all-targets -- -D warnings
      - name: Check xybrid-core MLX runtime
        run: cargo check -p xybrid-core --no-default-features --features llm-mlx-runtime,llm-llamacpp
      - name: Test xybrid-core MLX runtime
        run: cargo test -p xybrid-core --no-default-features --features llm-mlx-runtime,llm-llamacpp --lib
      - name: Test MLX LLM runtime smoke
        run: cargo test -p xybrid-core --no-default-features --features llm-mlx-runtime,llm-llamacpp --test mlx_llm_chat
      - name: Test MLX embedding runtime smoke
        run: cargo test -p xybrid-core --no-default-features --features llm-mlx-runtime,llm-llamacpp --test mlx_embedding
      - name: Check xybrid-sdk MLX runtime
        run: cargo check -p xybrid-sdk --no-default-features --features llm-mlx-runtime,llm-llamacpp
      - name: Test xybrid-sdk MLX runtime
        run: cargo test -p xybrid-sdk --no-default-features --features llm-mlx-runtime,llm-llamacpp --lib
      - name: Check xybrid-cli MLX runtime
        run: cargo check -p xybrid-cli --no-default-features --features llm-mlx-runtime,llm-llamacpp
      - name: Test xybrid-cli MLX runtime
        run: cargo test -p xybrid-cli --no-default-features --features llm-mlx-runtime,llm-llamacpp --bin xybrid
      - name: Check MLX vs llama.cpp benchmark
        run: cargo bench -p xybrid-core --no-default-features --features llm-mlx-runtime,llm-llamacpp --bench llm_backend_compare --no-run
      - name: Check MLX embedding benchmark
        run: cargo bench -p xybrid-core --no-default-features --features llm-mlx-runtime,llm-llamacpp --bench mlx_embedding --no-run

  clippy-llm:
    name: clippy (llm-llamacpp, ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # stable
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: ubuntu-clippy-llm
      - name: Clippy with llm-llamacpp
        run: cargo clippy -p xybrid-core --features "ort-download,llm-llamacpp" -- -D warnings

  test-llm:
    name: test (llm-llamacpp, ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: ubuntu-test-llm
      - name: Test with llm-llamacpp
        run: cargo test -p xybrid-core --features "ort-download,llm-llamacpp" --lib

  # Linux-only on push/PR. macOS + Windows validation runs in release.yml at
  # release time, and check-platform-macos / build-apple.yml cover Apple-specific
  # compilation when bindings/apple changes.
  test:
    name: Test (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      # The full --workspace debug build compiles llama.cpp from source (hundreds
      # of model .cpp objects) on top of ort-download's ONNX Runtime and every
      # crate's test binaries, which exhausts the ~14 GB free on ubuntu-latest
      # (the libllama.a link fails with "No space left on device"). Reclaim space
      # from preinstalled toolchains this build never touches.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          df -h /

      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: ubuntu-latest-ort-download

      # Skip examples — they statically link llama.cpp + ort and exhaust
      # runner disk during link. `clippy --all-targets` already verifies
      # examples compile (it stops at .rmeta, so no link step).
      # `--doc` can't be combined with other target flags, so it runs separately.
      - name: Run tests (lib, bins, integration)
        run: cargo test --workspace --features ort-download --lib --bins --tests

      - name: Run doc tests
        run: cargo test --workspace --features ort-download --doc

  # (Retired) The cargo linux-CLI build lived here. The required Bazel check
  # ("Bazel graph + RBE targets", bazel.yml) now builds + smokes the linux CLI
  # on every Bazel-relevant PR, so this cargo build was redundant.

  # API contract validation (soft warning — does not block CI)
  api-contract:
    name: API Contract Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
      - name: Check API contract
        run: ./tools/scripts/api-contract-check.sh --check

  web:
    name: Web SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Use Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '22'

      - name: Use Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.9

      - name: Enable Corepack
        run: corepack enable

      - name: Activate pnpm
        run: corepack prepare pnpm@11.2.2 --activate

      - name: Install Web SDK dependencies
        working-directory: bindings/web
        run: pnpm install --frozen-lockfile

      - name: Lint Web SDK
        working-directory: bindings/web
        run: pnpm lint

      - name: Typecheck Web SDK
        working-directory: bindings/web
        run: pnpm typecheck

      - name: Test Web SDK
        working-directory: bindings/web
        run: pnpm test

      - name: Build Web SDK
        working-directory: bindings/web
        run: pnpm build

      - name: Build Web example
        working-directory: bindings/web
        run: pnpm build:example

      - name: Install Chromium
        working-directory: bindings/web
        run: pnpm exec playwright install --with-deps chromium

      - name: Test Web SDK in Chromium
        working-directory: bindings/web
        run: pnpm test:browser

  # All checks passed
  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs: [fmt, clippy, check-no-default-features, check-platform-macos, check-platform-desktop, check-vision-platforms, check-mlx-non-linking, check-mlx-runtime-macos, clippy-llm, test-llm, test, api-contract, web]
    steps:
      - run: echo "All CI checks passed!"
