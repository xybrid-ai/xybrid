name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: read-all

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  tooling-changes:
    name: Detect CI-relevant changes
    runs-on: ubuntu-latest
    outputs:
      full_ci: ${{ steps.filter.outputs.full_ci }}
      relevant: ${{ steps.filter.outputs.relevant }}
      unity_bolt: ${{ steps.filter.outputs.unity_bolt }}
      python_sdk: ${{ steps.filter.outputs.python_sdk }}
      kotlin_jni: ${{ steps.filter.outputs.kotlin_jni }}
      apple_bolt: ${{ steps.filter.outputs.apple_bolt }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Check changed paths
        id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            gh api --paginate --slurp \
              "repos/$REPOSITORY/pulls/$PR_NUMBER/files" > "$RUNNER_TEMP/ci-files.json"
          else
            gh api "repos/$REPOSITORY/compare/$BEFORE_SHA...$CURRENT_SHA" > "$RUNNER_TEMP/ci-files.json"
          fi
          python3 tools/scripts/ci_gate.py changes "$EVENT_NAME" "$RUNNER_TEMP/ci-files.json" \
            | tee -a "$GITHUB_OUTPUT"

  kotlin-jni-drift:
    name: Kotlin and JNI generation drift
    needs: tooling-changes
    if: needs.tooling-changes.outputs.kotlin_jni == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Install the pinned boltffi CLI
        run: cargo install boltffi_cli --version 0.30.1 --locked
      - name: Compare committed Kotlin and JNI with fresh generation
        run: python3 tools/scripts/gen_kotlin_bolt.py --check

  # The committed Swift bindings and the C header the xcframework ships are
  # generator output, like Kotlin/Python/Unity — but until now they had no
  # drift gate, so a regeneration could silently disagree with the crate.
  # Generation is host-agnostic (boltffi + a cargo metadata build), so this
  # runs on Linux; the Swift *compile* stays on macOS in build-apple.yml.
  apple-bolt-drift:
    name: Swift and C header generation drift
    needs: tooling-changes
    if: needs.tooling-changes.outputs.apple_bolt == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Install the pinned boltffi CLI
        run: cargo install boltffi_cli --version 0.30.1 --locked
      - name: Compare committed Swift and C header with fresh generation
        run: bindings/apple/scripts/gen-bolt-bindings.sh --check

  tooling-tests:
    name: Tooling tests (${{ matrix.platform }})
    needs: tooling-changes
    if: needs.tooling-changes.outputs.relevant == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            python: python3
            runtime: libonnxruntime.so
          - os: windows-latest
            platform: windows
            python: python
            runtime: onnxruntime.dll
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Test native staging tools
        if: matrix.platform == 'linux'
        run: python3 -m unittest discover -s tools/scripts/tests -p 'test_*.py'
      - name: Stage and load the real ONNX Runtime
        run: |
          ${{ matrix.python }} tools/scripts/stage_unity_desktop_ort.py ${{ matrix.platform }} "${{ runner.temp }}/unity-ort"
          ${{ matrix.python }} -c "import ctypes, sys; ctypes.CDLL(sys.argv[1])" "${{ runner.temp }}/unity-ort/${{ matrix.runtime }}"

  # Compile the committed BoltFFI C# bindings against Unity's frozen scripting
  # profile (netstandard2.1 + C# 9). Catches a boltffi output change or a missed
  # down-level in gen_unity_bolt_csharp.py at PR time instead of in the Editor.
  unity-bolt-compile:
    name: Compile Unity bolt bindings (netstandard2.1)
    needs: tooling-changes
    if: needs.tooling-changes.outputs.unity_bolt == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Compile against Unity's C# 9 / netstandard2.1 profile
        # ubuntu-latest ships the .NET SDK preinstalled; netstandard2.1 builds
        # with any 6+ SDK. The csproj pins LangVersion 9 to match Unity.
        run: |
          dotnet --version
          dotnet build tools/unity-bolt-compile-check/UnityBoltCompileCheck.csproj -c Release

  # The Python SDK is the one binding CI cannot test from the committed tree
  # alone: boltffi's Python target compiles a CPython bridge per interpreter,
  # and the cdylib that bridge dlopens needs boltffi's relink — a plain cargo
  # build omits the generated `boltffi_release_class_*` shims, so importing the
  # package fails on an unresolved symbol. This job installs the pinned CLI,
  # proves the committed bindings still match the crate, then builds and tests.
  python-sdk:
    name: Python SDK (ubuntu-latest)
    needs: tooling-changes
    if: needs.tooling-changes.outputs.python_sdk == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          # Floor of the SDK: boltffi's generated package needs >= 3.10.
          python-version: '3.12'
      - name: Install the pinned boltffi CLI
        run: cargo install boltffi_cli --version 0.30.1 --locked
      - name: Check the committed bindings match the crate
        run: python3 tools/scripts/gen_python_bolt.py --check
      - name: Build and stage the native artifacts
        run: ./tools/scripts/build-python-bolt.sh
      - name: Install and test
        run: |
          python -m pip install -e './bindings/python[dev]'
          # The suite skips itself when the native bridge is unimportable, so
          # prove it loads first — otherwise a staging break reports green
          # having run nothing.
          python -c "import xybrid; print('xybrid', xybrid.version())"
          python -m pytest bindings/python/tests -q

  fmt:
    name: Format
    needs: tooling-changes
    if: needs.tooling-changes.outputs.full_ci == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # stable
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: Clippy
    needs: tooling-changes
    if: needs.tooling-changes.outputs.full_ci == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # stable
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  # Feature combination checks - ensure platform builds don't break
  check-no-default-features:
    needs: tooling-changes
    if: needs.tooling-changes.outputs.full_ci == 'true'
    name: check (no-default-features, ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: ubuntu-latest-no-default
      - name: Check without default features
        run: cargo check -p xybrid-core --no-default-features

  check-platform-macos:
    needs: tooling-changes
    if: needs.tooling-changes.outputs.full_ci == 'true'
    name: check (platform-macos, macos-latest)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: macos-platform-no-bin
          cache-bin: false
      - name: Check platform-macos
        run: cargo check -p xybrid-sdk --features platform-macos
      - name: Test native Core ML bundle ownership
        run: cargo test -p xybrid-core --features coreml,ort-download --lib runtime_adapter::coreml::native::tests
      - name: Test native Core ML fixture
        run: cargo test -p integration-tests --features coreml --test coreml_native

  check-platform-desktop:
    needs: tooling-changes
    if: needs.tooling-changes.outputs.full_ci == 'true'
    name: check (platform-desktop, ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: ubuntu-platform-desktop
      - name: Check platform-desktop
        run: cargo check -p xybrid-sdk --features platform-desktop

  check-vision-platforms:
    needs: tooling-changes
    if: needs.tooling-changes.outputs.full_ci == 'true'
    name: check vision (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
            features: platform-desktop,llm-llamacpp-vision
            cache-key: linux-vision-platform
          - name: macos
            os: macos-latest
            features: platform-macos,llm-llamacpp-vision
            cache-key: macos-vision-platform
          - name: windows
            os: windows-latest
            features: platform-desktop,llm-llamacpp-vision
            cache-key: windows-vision-platform
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: ${{ matrix.cache-key }}
      - name: Check vision build without model artifacts
        run: cargo check -p xybrid-sdk --features ${{ matrix.features }}

  # Linux only. Windows cannot build ggml's `vulkan-shaders-gen` under cargo's
  # OUT_DIR: the nested CMake ExternalProject blows past MAX_PATH and MSBuild's
  # FileTracker fails (FTK1011). See the comment in llama-cpp-sys/build.rs.
  check-llamacpp-vulkan:
    needs: tooling-changes
    if: needs.tooling-changes.outputs.full_ci == 'true'
    name: check llama.cpp Vulkan (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    # 7-11 min warm. Without a bound, a stalled step holds the runner for
    # GitHub's 6 h default.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
            cache-key: linux-llamacpp-vulkan
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # stable
        with:
          toolchain: stable
      - uses: ./.github/actions/setup-vulkan-sdk
        timeout-minutes: 15
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: ${{ matrix.cache-key }}
      - name: Check llama.cpp Vulkan build
        env:
          XYBRID_LLAMA_CPP_VULKAN: "1"
        run: cargo check -p xybrid-sdk --features platform-desktop

  clippy-llm:
    needs: tooling-changes
    if: needs.tooling-changes.outputs.full_ci == 'true'
    name: clippy (llm-llamacpp, ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # stable
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: ubuntu-clippy-llm
      # `--all-targets` is what compiles the examples. Without it the
      # llm-llamacpp examples (the tool-calling reference loops) are checked by
      # nobody: the plain `clippy` job passes --all-targets but not the feature,
      # so cargo skips them on `required-features`, and this job had the feature
      # but not the flag. That gap is how examples rot into a "fix examples that
      # do not compile" PR. Clippy stops at .rmeta, so there is no link step and
      # none of the disk pressure that made the test job skip examples.
      - name: Clippy with llm-llamacpp
        run: cargo clippy -p xybrid-core --features "ort-download,llm-llamacpp" --all-targets -- -D warnings

  test-llm:
    needs: tooling-changes
    if: needs.tooling-changes.outputs.full_ci == 'true'
    name: test (llm-llamacpp, ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: ubuntu-test-llm
      - name: Test with llm-llamacpp
        run: cargo test -p xybrid-core --features "ort-download,llm-llamacpp" --lib

  # Linux-only on push/PR. macOS + Windows validation runs in release-prep.yml
  # at release time, and check-platform-macos / build-apple.yml cover
  # Apple-specific compilation when bindings/apple changes.
  test:
    needs: tooling-changes
    if: needs.tooling-changes.outputs.full_ci == 'true'
    name: Test (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      # The full --workspace debug build compiles llama.cpp from source (hundreds
      # of model .cpp objects) on top of ort-download's ONNX Runtime and every
      # crate's test binaries, which exhausts the ~14 GB free on ubuntu-latest
      # (the libllama.a link fails with "No space left on device"). Reclaim space
      # from preinstalled toolchains this build never touches.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          df -h /

      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: ubuntu-latest-ort-download

      # Skip examples — they statically link llama.cpp + ort and exhaust
      # runner disk during link. `clippy --all-targets` already verifies
      # examples compile (it stops at .rmeta, so no link step) — but compiling
      # is all it does: an example's `#[cfg(test)]` module never runs here.
      # Examples that carry unit tests are opted in one at a time below.
      # `--doc` can't be combined with other target flags, so it runs separately.
      - name: Run tests (lib, bins, integration)
        run: cargo test --workspace --features ort-download --lib --bins --tests

      # `sentence_ranker` unit-tests its cosine-similarity and ranking helpers.
      # Selecting the single example keeps the no-examples policy above intact:
      # it needs no llm-llamacpp, and ort is load-dynamic on Linux, so the link
      # step is one small binary — not every example against llama.cpp. Add
      # another `--example <name>` here when an example gains tests that run
      # without llm-llamacpp; examples that need it belong in test-llm.
      - name: Run tests (examples with unit tests)
        run: cargo test -p xybrid-core --features ort-download --example sentence_ranker

      - name: Run doc tests
        run: cargo test --workspace --features ort-download --doc

      # The optional `huggingface` feature isn't covered by ort-download
      # above; run its unit tests (shared HF cache reuse) explicitly.
      - name: Run tests (huggingface cache integration)
        run: cargo test -p xybrid-sdk --features huggingface --lib

  # (Retired) The cargo linux-CLI build lived here. The required Bazel check
  # ("Bazel graph + RBE targets", bazel.yml) now builds + smokes the linux CLI
  # on every Bazel-relevant PR, so this cargo build was redundant.

  # API contract validation (soft warning — does not block CI)
  api-contract:
    needs: tooling-changes
    if: needs.tooling-changes.outputs.full_ci == 'true'
    name: API Contract Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
      - name: Check API contract
        run: ./tools/scripts/api-contract-check.sh --check

  web:
    needs: tooling-changes
    if: needs.tooling-changes.outputs.full_ci == 'true'
    name: Web SDK (Rust/WASM)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: true

      - name: Use Bazelisk
        uses: bazel-contrib/setup-bazel@4fd964a13a440a8aeb0be47350db2fc640f19ca8 # 0.15.0
        with:
          bazelisk-cache: true

      - name: Cache pinned Bazel downloads
        uses: ./.github/actions/bazel-repo-cache
        with:
          macos-sdk-mirror: ${{ vars.MACOS_SDK_MIRROR }}

      - name: Cache browser runtime build outputs
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .context/bazel-disk-cache
          key: web-wasm-${{ runner.os }}-${{ hashFiles('.bazelversion', 'MODULE.bazel', 'emsdk.patch', 'rules_rs.patch', 'BUILD.bazel', 'bindings/web/runtime/**', 'crates/xybrid-llama/**', 'crates/llama-cpp-sys/**') }}
          restore-keys: web-wasm-${{ runner.os }}-

      - name: Bound the browser build cache
        run: echo 'build --experimental_disk_cache_gc_max_size=536870912' >> .context/local.bazelrc

      - name: Use Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '22'

      - name: Use Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.9

      - name: Enable Corepack
        run: corepack enable

      - name: Activate pnpm
        run: corepack prepare pnpm@11.2.2 --activate

      - name: Install Web SDK dependencies
        working-directory: bindings/web
        run: pnpm install --frozen-lockfile

      - name: Lint Web SDK
        working-directory: bindings/web
        run: pnpm lint

      - name: Typecheck Web SDK
        working-directory: bindings/web
        run: pnpm typecheck

      - name: Test Web SDK
        working-directory: bindings/web
        run: pnpm test

      - name: Build Web SDK with CPU and WebGPU Rust runtimes
        id: web-build
        working-directory: bindings/web
        run: pnpm build

      - name: Pack and verify the Web SDK as an isolated npm consumer
        working-directory: bindings/web
        run: pnpm pack:release

      # The demo and browser suite use the same 92 MB GGUF. Preparation and
      # the SDK verify size/SHA-256; runtime assets are rebuilt from source.
      - name: Cache Web example model assets
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: bindings/web/example/public/model.gguf
          key: web-gguf-${{ hashFiles('bindings/web/example/model.ts') }}

      - name: Build Web example
        working-directory: bindings/web
        env:
          XYBRID_WEB_PACKAGE: test-results/npm/package
        run: pnpm build:example

      - name: Install Chromium
        working-directory: bindings/web
        run: pnpm exec playwright install --with-deps chromium

      - name: Test packaged Rust/WASM SDK in Chromium
        working-directory: bindings/web
        env:
          XYBRID_WEB_REPORT: test-results/runtime-measurements.json
        run: pnpm test:browser

      - name: Record JavaScript and WASM build sizes
        if: ${{ !cancelled() && steps.web-build.outcome == 'success' }}
        working-directory: bindings/web
        run: pnpm size

      - name: Upload Web SDK and browser measurements
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: xybrid-web-wasm
          path: |
            bindings/web/dist/
            bindings/web/test-results/
          if-no-files-found: warn
          retention-days: 7

  # All checks passed
  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    # Inspect dependency results even when the tooling path gate skips its matrix.
    if: ${{ !cancelled() }}
    needs: [tooling-changes, tooling-tests, unity-bolt-compile, python-sdk, kotlin-jni-drift, apple-bolt-drift, fmt, clippy, check-no-default-features, check-platform-macos, check-platform-desktop, check-vision-platforms, check-llamacpp-vulkan, clippy-llm, test-llm, test, api-contract, web]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Verify required job results
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python3 tools/scripts/ci_gate.py check <<<"$NEEDS_JSON"
