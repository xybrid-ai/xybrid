name: CI

on:
  push:
    branches: [master]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
      - 'LICENSE'
  pull_request:
    branches: [master]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
      - 'LICENSE'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: read-all

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # stable
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # stable
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  # Feature combination checks - ensure platform builds don't break
  check-no-default-features:
    name: check (no-default-features, ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: ubuntu-latest-no-default
      - name: Check without default features
        run: cargo check -p xybrid-core --no-default-features

  check-platform-macos:
    name: check (platform-macos, macos-latest)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: macos-platform-no-bin
          cache-bin: false
      - name: Check platform-macos
        run: cargo check -p xybrid-sdk --features platform-macos

  check-platform-desktop:
    name: check (platform-desktop, ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: ubuntu-platform-desktop
      - name: Check platform-desktop
        run: cargo check -p xybrid-sdk --features platform-desktop

  # Skeleton-tier verification (Phase 4 of the `llamacpp-crate-split` epic).
  # Confirms that `llm-llamacpp` without `-runtime` compiles on a runner
  # without cmake, without the llama.cpp submodule, without a C++ toolchain.
  # Brief §4.6 pass criterion: completes in < 30 s.
  #
  # NOTE on scope: this job is intentionally **package-scoped to xybrid-core**.
  # `cargo check --workspace --features xybrid-core/llm-llamacpp` would
  # cascade through `bindings/flutter/rust`'s target-specific deps (which
  # unconditionally activate `xybrid-sdk/platform-*` on each host) and pull
  # in the runtime tier on macOS/Linux Flutter cross-builds. The brief gate
  # is about whether `llm-llamacpp` itself is a true skeleton feature on
  # the layer that owns it — `xybrid-core`. Adding a per-runtime workspace
  # skeleton gate would require restructuring Flutter's target deps and is
  # out of scope for this refactor.
  check-llamacpp-skeleton:
    name: check (llm-llamacpp skeleton, ubuntu-latest, no toolchain)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        # No `submodules: true` — the skeleton tier must compile without
        # the llama.cpp source.
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: ubuntu-check-llamacpp-skeleton
      - name: Check xybrid-core --features llm-llamacpp (skeleton) — must not invoke cmake
        run: |
          set -euo pipefail
          START=$(date +%s)
          # 2>&1 capture lets us assert build-script output absence below.
          OUT=$(cargo check -p xybrid-core --features llm-llamacpp --no-default-features 2>&1)
          END=$(date +%s)
          ELAPSED=$((END - START))
          echo "$OUT"
          echo "Skeleton-tier check elapsed: ${ELAPSED}s (target < 30s)"
          # Negative assertion: the build script must NOT have run cmake or
          # cloned llama.cpp. If either warning string appears, the skeleton
          # gate is broken — fail loudly.
          if echo "$OUT" | grep -qE "llama\\.cpp build:|llama\\.cpp ready at|cloning https://github\\.com/ggml-org/llama\\.cpp"; then
            echo "::error::llama-cpp-sys build script ran during skeleton-tier check — skeleton invariant broken"
            exit 1
          fi
          if [ "$ELAPSED" -gt 30 ]; then
            echo "::warning::Skeleton-tier build exceeded 30s budget (${ELAPSED}s)"
          fi
      - name: Skeleton-tier integration test (BackendNotLinked surfaces)
        run: cargo test -p xybrid-core --features llm-llamacpp --no-default-features --test skeleton_tier_backend_not_linked

  clippy-llm:
    name: clippy (llm-llamacpp-runtime, ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # stable
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: ubuntu-clippy-llm
      - name: Clippy with llm-llamacpp-runtime
        run: cargo clippy -p xybrid-core --features "ort-download,llm-llamacpp-runtime" -- -D warnings

  test-llm:
    name: test (llm-llamacpp-runtime, ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: ubuntu-test-llm
      - name: Test with llm-llamacpp-runtime
        run: cargo test -p xybrid-core --features "ort-download,llm-llamacpp-runtime" --lib

  # Linux-only on push/PR. macOS + Windows validation runs in release.yml at
  # release time, and check-platform-macos / build-apple.yml cover Apple-specific
  # compilation when bindings/apple changes.
  test:
    name: Test (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: ubuntu-latest-ort-download

      # Skip examples — they statically link llama.cpp + ort and exhaust
      # runner disk during link. `clippy --all-targets` already verifies
      # examples compile (it stops at .rmeta, so no link step).
      # `--doc` can't be combined with other target flags, so it runs separately.
      - name: Run tests (lib, bins, integration)
        run: cargo test --workspace --features ort-download --lib --bins --tests

      - name: Run doc tests
        run: cargo test --workspace --features ort-download --doc

  # Linux-only on push/PR. Per-platform CLI builds run in release.yml.
  build-cli:
    name: Build CLI (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: true

      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # stable
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-gnu

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: ubuntu-latest-cli

      - name: Build CLI
        run: cargo build --release -p xybrid-cli --target x86_64-unknown-linux-gnu --features platform-desktop

  # API contract validation (soft warning — does not block CI)
  api-contract:
    name: API Contract Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
      - name: Check API contract
        run: ./tools/scripts/api-contract-check.sh --check

  # All checks passed
  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs: [fmt, clippy, check-no-default-features, check-platform-macos, check-platform-desktop, clippy-llm, test-llm, test, build-cli, api-contract]
    steps:
      - run: echo "All CI checks passed!"
