name: CI

on:
  push:
    branches: [master]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
      - 'LICENSE'
  pull_request:
    branches: [master]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
      - 'LICENSE'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: read-all

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  tooling-changes:
    name: Detect tooling-relevant changes
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
      unity_bolt: ${{ steps.filter.outputs.unity_bolt }}
      python_sdk: ${{ steps.filter.outputs.python_sdk }}
    steps:
      - name: Check changed paths
        id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            FILES=$(gh api --paginate \
              "repos/$REPOSITORY/pulls/$PR_NUMBER/files" \
              --jq '.[].filename')
          else
            FILES=$(gh api \
              "repos/$REPOSITORY/compare/$BEFORE_SHA...$CURRENT_SHA" \
              --jq '.files[].filename')
          fi
          if printf '%s\n' "$FILES" | grep -qE '^(tools/scripts/|\.github/workflows/ci\.yml$)'; then
            RELEVANT=true
          else
            RELEVANT=false
          fi
          echo "relevant=$RELEVANT" >> "$GITHUB_OUTPUT"
          echo "Tooling-relevant changes: $RELEVANT"
          if printf '%s\n' "$FILES" | grep -qE '^(bindings/unity/Runtime/Bolt/|bindings/unity/Runtime/BoltSupplement/|tools/unity-bolt-compile-check/|tools/scripts/gen_unity_bolt_csharp\.py$|crates/xybrid-bolt/boltffi\.toml$|\.github/workflows/ci\.yml$)'; then
            UNITY_BOLT=true
          else
            UNITY_BOLT=false
          fi
          echo "unity_bolt=$UNITY_BOLT" >> "$GITHUB_OUTPUT"
          echo "Unity bolt binding changes: $UNITY_BOLT"
          if printf '%s\n' "$FILES" | grep -qE '^(bindings/python/|tools/scripts/gen_python_bolt\.py$|tools/scripts/build-python-bolt\.sh$|crates/xybrid-bolt/|\.github/workflows/ci\.yml$)'; then
            PYTHON_SDK=true
          else
            PYTHON_SDK=false
          fi
          echo "python_sdk=$PYTHON_SDK" >> "$GITHUB_OUTPUT"
          echo "Python SDK changes: $PYTHON_SDK"

  tooling-tests:
    name: Tooling tests (${{ matrix.platform }})
    needs: tooling-changes
    if: needs.tooling-changes.outputs.relevant == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            python: python3
            runtime: libonnxruntime.so
          - os: windows-latest
            platform: windows
            python: python
            runtime: onnxruntime.dll
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Test native staging tools
        if: matrix.platform == 'linux'
        run: python3 -m unittest discover -s tools/scripts/tests -p 'test_*.py'
      - name: Stage and load the real ONNX Runtime
        run: |
          ${{ matrix.python }} tools/scripts/stage_unity_desktop_ort.py ${{ matrix.platform }} "${{ runner.temp }}/unity-ort"
          ${{ matrix.python }} -c "import ctypes, sys; ctypes.CDLL(sys.argv[1])" "${{ runner.temp }}/unity-ort/${{ matrix.runtime }}"

  # Compile the committed BoltFFI C# bindings against Unity's frozen scripting
  # profile (netstandard2.1 + C# 9). Catches a boltffi output change or a missed
  # down-level in gen_unity_bolt_csharp.py at PR time instead of in the Editor.
  unity-bolt-compile:
    name: Compile Unity bolt bindings (netstandard2.1)
    needs: tooling-changes
    if: needs.tooling-changes.outputs.unity_bolt == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Compile against Unity's C# 9 / netstandard2.1 profile
        # ubuntu-latest ships the .NET SDK preinstalled; netstandard2.1 builds
        # with any 6+ SDK. The csproj pins LangVersion 9 to match Unity.
        run: |
          dotnet --version
          dotnet build tools/unity-bolt-compile-check/UnityBoltCompileCheck.csproj -c Release

  # The Python SDK is the one binding CI cannot test from the committed tree
  # alone: boltffi's Python target compiles a CPython bridge per interpreter,
  # and the cdylib that bridge dlopens needs boltffi's relink — a plain cargo
  # build omits the generated `boltffi_release_class_*` shims, so importing the
  # package fails on an unresolved symbol. This job installs the pinned CLI,
  # proves the committed bindings still match the crate, then builds and tests.
  python-sdk:
    name: Python SDK (ubuntu-latest)
    needs: tooling-changes
    if: needs.tooling-changes.outputs.python_sdk == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          # Floor of the SDK: boltffi's generated package needs >= 3.10.
          python-version: '3.12'
      - name: Install the pinned boltffi CLI
        run: cargo install boltffi_cli --version 0.29.3 --locked
      - name: Check the committed bindings match the crate
        run: python3 tools/scripts/gen_python_bolt.py --check
      - name: Build and stage the native artifacts
        run: ./tools/scripts/build-python-bolt.sh
      - name: Install and test
        run: |
          python -m pip install -e './bindings/python[dev]'
          # The suite skips itself when the native bridge is unimportable, so
          # prove it loads first — otherwise a staging break reports green
          # having run nothing.
          python -c "import xybrid; print('xybrid', xybrid.version())"
          python -m pytest bindings/python/tests -q

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # stable
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # stable
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  # Feature combination checks - ensure platform builds don't break
  check-no-default-features:
    name: check (no-default-features, ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: ubuntu-latest-no-default
      - name: Check without default features
        run: cargo check -p xybrid-core --no-default-features

  check-platform-macos:
    name: check (platform-macos, macos-latest)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: macos-platform-no-bin
          cache-bin: false
      - name: Check platform-macos
        run: cargo check -p xybrid-sdk --features platform-macos

  check-platform-desktop:
    name: check (platform-desktop, ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: ubuntu-platform-desktop
      - name: Check platform-desktop
        run: cargo check -p xybrid-sdk --features platform-desktop

  check-vision-platforms:
    name: check vision (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
            features: platform-desktop,llm-llamacpp-vision
            cache-key: linux-vision-platform
          - name: macos
            os: macos-latest
            features: platform-macos,llm-llamacpp-vision
            cache-key: macos-vision-platform
          - name: windows
            os: windows-latest
            features: platform-desktop,llm-llamacpp-vision
            cache-key: windows-vision-platform
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: ${{ matrix.cache-key }}
      - name: Check vision build without model artifacts
        run: cargo check -p xybrid-sdk --features ${{ matrix.features }}

  # Linux only. Windows cannot build ggml's `vulkan-shaders-gen` under cargo's
  # OUT_DIR: the nested CMake ExternalProject blows past MAX_PATH and MSBuild's
  # FileTracker fails (FTK1011). See the comment in llama-cpp-sys/build.rs.
  check-llamacpp-vulkan:
    name: check llama.cpp Vulkan (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
            cache-key: linux-llamacpp-vulkan
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # stable
        with:
          toolchain: stable
      - uses: ./.github/actions/setup-vulkan-sdk
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: ${{ matrix.cache-key }}
      - name: Check llama.cpp Vulkan build
        env:
          XYBRID_LLAMA_CPP_VULKAN: "1"
        run: cargo check -p xybrid-sdk --features platform-desktop

  check-mlx-non-linking:
    name: check (llm-mlx non-linking, ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: ubuntu-mlx-non-linking
      - name: Check core MLX non-linking tier
        run: cargo check -p xybrid-core --no-default-features --features llm-mlx
      - name: Check SDK MLX non-linking tier
        run: cargo check -p xybrid-sdk --no-default-features --features llm-mlx
      - name: Check CLI MLX non-linking tier
        run: cargo check -p xybrid-cli --no-default-features --features llm-mlx
      - name: Test MLX selector and non-linking routing
        run: cargo test -p xybrid-core --no-default-features --features llm-mlx runtime_adapter::selector --lib
      - name: Test MLX executor non-linking routing
        run: cargo test -p xybrid-core --no-default-features --features llm-mlx execution::executor::tests::test_executor_dispatches_mlx_embedding_before_generic_safetensors_runtime --lib
      - name: Test SDK MLX registry-format selection
        run: cargo test -p xybrid-sdk --no-default-features --features llm-mlx registry_format --lib
      - name: Test CLI MLX registry-format selection
        run: cargo test -p xybrid-cli --no-default-features --features llm-mlx --bin xybrid
      - name: Check MLX benchmark non-linking build
        run: cargo bench -p xybrid-core --no-default-features --features llm-mlx --bench llm_backend_compare --no-run
      - name: Check MLX embedding benchmark non-linking build
        run: cargo bench -p xybrid-core --no-default-features --features llm-mlx --bench mlx_embedding --no-run
      - name: Test MLX xcframework fetch script pin status
        run: bash tools/scripts/test-fetch-mlx-xcframework.sh
      - name: Test MLX xcframework slice build script
        run: bash tools/scripts/test-build-mlx-slice.sh
      - name: Test local MLX xcframework source-build script
        run: bash tools/scripts/test-build-local-mlx-xcframework.sh
      - name: Test staged MLX fixture checks
        run: bash tools/scripts/test-integration-download-staged.sh
      - name: Test MLX benchmark wrapper host gates
        run: bash tools/scripts/test-bench-scripts.sh

  check-mlx-runtime-macos:
    name: check (llm-mlx-runtime, macos-14)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # stable
        with:
          toolchain: stable
          targets: aarch64-apple-ios
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: macos-mlx-runtime
      - name: Check iOS core MLX non-linking target
        run: |
          CARGO_TARGET_DIR="${RUNNER_TEMP}/xybrid-ios-mlx-non-linking-target" \
            cargo build -p xybrid-core --target aarch64-apple-ios --no-default-features --features llm-mlx
      - name: Check iOS MLX runtime gate
        run: bash tools/scripts/test-ios-mlx-runtime-gate.sh
      - name: Clean iOS MLX build artifacts
        run: rm -rf "${RUNNER_TEMP}/xybrid-ios-mlx-non-linking-target"
      - name: Check MLX xcframework pin status
        id: mlx_pin
        run: ./tools/scripts/fetch-mlx-xcframework.sh --check-published
      - name: Install MLX source-build tools
        if: steps.mlx_pin.outputs.published != 'true'
        run: |
          if ! command -v ninja >/dev/null 2>&1; then
            brew install ninja
          fi
          ninja --version
      - name: Build local macOS MLX xcframework from pins
        if: steps.mlx_pin.outputs.published != 'true'
        run: |
          set -euo pipefail
          echo "::notice::MLX xcframework download pin is unavailable; building a local macOS slice from pinned upstream SHAs for runtime CI."
          echo "release=${{ steps.mlx_pin.outputs.release }}"
          echo "sha256=${{ steps.mlx_pin.outputs.sha256 }}"
          ./tools/scripts/build-local-mlx-xcframework.sh
      - name: Fetch MLX xcframework
        if: steps.mlx_pin.outputs.published == 'true'
        run: ./tools/scripts/fetch-mlx-xcframework.sh
      - name: Check mlx-c-sys bindings
        run: cargo check -p mlx-c-sys --features bindings
      - name: Test mlx-c-sys bindings
        run: cargo test -p mlx-c-sys --features bindings
      - name: Check xybrid-mlx bindings
        run: cargo check -p xybrid-mlx --features bindings
      - name: Test xybrid-mlx bindings
        run: cargo test -p xybrid-mlx --features bindings
      - name: Clippy mlx-c-sys bindings
        run: cargo clippy -p mlx-c-sys --features bindings --all-targets -- -D warnings
      - name: Clippy xybrid-mlx bindings
        run: cargo clippy -p xybrid-mlx --features bindings --all-targets -- -D warnings
      - name: Check xybrid-core MLX runtime
        run: cargo check -p xybrid-core --no-default-features --features llm-mlx-runtime,llm-llamacpp
      - name: Test xybrid-core MLX runtime
        run: cargo test -p xybrid-core --no-default-features --features llm-mlx-runtime,llm-llamacpp --lib
      - name: Test MLX LLM runtime smoke
        run: cargo test -p xybrid-core --no-default-features --features llm-mlx-runtime,llm-llamacpp --test mlx_llm_chat
      - name: Test MLX embedding runtime smoke
        run: cargo test -p xybrid-core --no-default-features --features llm-mlx-runtime,llm-llamacpp --test mlx_embedding
      - name: Check xybrid-sdk MLX runtime
        run: cargo check -p xybrid-sdk --no-default-features --features llm-mlx-runtime,llm-llamacpp
      - name: Test xybrid-sdk MLX runtime
        run: cargo test -p xybrid-sdk --no-default-features --features llm-mlx-runtime,llm-llamacpp --lib
      - name: Check xybrid-cli MLX runtime
        run: cargo check -p xybrid-cli --no-default-features --features llm-mlx-runtime,llm-llamacpp
      - name: Test xybrid-cli MLX runtime
        run: cargo test -p xybrid-cli --no-default-features --features llm-mlx-runtime,llm-llamacpp --bin xybrid
      - name: Check MLX vs llama.cpp benchmark
        run: cargo bench -p xybrid-core --no-default-features --features llm-mlx-runtime,llm-llamacpp --bench llm_backend_compare --no-run
      - name: Check MLX embedding benchmark
        run: cargo bench -p xybrid-core --no-default-features --features llm-mlx-runtime,llm-llamacpp --bench mlx_embedding --no-run

  clippy-llm:
    name: clippy (llm-llamacpp, ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # stable
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: ubuntu-clippy-llm
      - name: Clippy with llm-llamacpp
        run: cargo clippy -p xybrid-core --features "ort-download,llm-llamacpp" -- -D warnings

  test-llm:
    name: test (llm-llamacpp, ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: ubuntu-test-llm
      - name: Test with llm-llamacpp
        run: cargo test -p xybrid-core --features "ort-download,llm-llamacpp" --lib

  # Linux-only on push/PR. macOS + Windows validation runs in release-prep.yml
  # at release time, and check-platform-macos / build-apple.yml cover
  # Apple-specific compilation when bindings/apple changes.
  test:
    name: Test (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      # The full --workspace debug build compiles llama.cpp from source (hundreds
      # of model .cpp objects) on top of ort-download's ONNX Runtime and every
      # crate's test binaries, which exhausts the ~14 GB free on ubuntu-latest
      # (the libllama.a link fails with "No space left on device"). Reclaim space
      # from preinstalled toolchains this build never touches.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          df -h /

      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: ubuntu-latest-ort-download

      # Skip examples — they statically link llama.cpp + ort and exhaust
      # runner disk during link. `clippy --all-targets` already verifies
      # examples compile (it stops at .rmeta, so no link step).
      # `--doc` can't be combined with other target flags, so it runs separately.
      - name: Run tests (lib, bins, integration)
        run: cargo test --workspace --features ort-download --lib --bins --tests

      - name: Run doc tests
        run: cargo test --workspace --features ort-download --doc

  # (Retired) The cargo linux-CLI build lived here. The required Bazel check
  # ("Bazel graph + RBE targets", bazel.yml) now builds + smokes the linux CLI
  # on every Bazel-relevant PR, so this cargo build was redundant.

  # API contract validation (soft warning — does not block CI)
  api-contract:
    name: API Contract Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
      - name: Check API contract
        run: ./tools/scripts/api-contract-check.sh --check

  web:
    name: Web SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Use Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '22'

      - name: Use Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.9

      - name: Enable Corepack
        run: corepack enable

      - name: Activate pnpm
        run: corepack prepare pnpm@11.2.2 --activate

      - name: Install Web SDK dependencies
        working-directory: bindings/web
        run: pnpm install --frozen-lockfile

      - name: Lint Web SDK
        working-directory: bindings/web
        run: pnpm lint

      - name: Typecheck Web SDK
        working-directory: bindings/web
        run: pnpm typecheck

      - name: Test Web SDK
        working-directory: bindings/web
        run: pnpm test

      - name: Build Web SDK
        working-directory: bindings/web
        run: pnpm build

      # The example pulls a 136 MB LiteRT-LM model from a shared HuggingFace
      # mirror that rate-limits CI egress by IP. Both assets are pinned by
      # checksum in prepare-assets.ts, which re-downloads whatever fails to
      # verify — so keying the cache on that file makes a restore safe and a
      # pin change self-invalidating.
      - name: Cache Web example model assets
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            bindings/web/example/public/model.tflite
            bindings/web/example/public/llm/SmolLM2_135M_Instruct.litertlm
          key: web-example-assets-${{ hashFiles('bindings/web/example/scripts/prepare-assets.ts') }}

      - name: Build Web example
        working-directory: bindings/web
        run: pnpm build:example

      - name: Install Chromium
        working-directory: bindings/web
        run: pnpm exec playwright install --with-deps chromium

      - name: Test Web SDK in Chromium
        working-directory: bindings/web
        run: pnpm test:browser

  # All checks passed
  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    # Inspect dependency results even when the tooling path gate skips its matrix.
    if: ${{ !cancelled() }}
    needs: [tooling-changes, tooling-tests, unity-bolt-compile, python-sdk, fmt, clippy, check-no-default-features, check-platform-macos, check-platform-desktop, check-vision-platforms, check-llamacpp-vulkan, check-mlx-non-linking, check-mlx-runtime-macos, clippy-llm, test-llm, test, api-contract, web]
    steps:
      - name: Verify required job results
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          jq --exit-status '
            . as $needs
            |
            to_entries
            | all(
                .value.result == "success"
                or (
                  .key == "tooling-tests"
                  and .value.result == "skipped"
                  and $needs["tooling-changes"].outputs.relevant == "false"
                )
                or (
                  .key == "unity-bolt-compile"
                  and .value.result == "skipped"
                  and $needs["tooling-changes"].outputs.unity_bolt == "false"
                )
                or (
                  .key == "python-sdk"
                  and .value.result == "skipped"
                  and $needs["tooling-changes"].outputs.python_sdk == "false"
                )
              )
          ' <<<"$NEEDS_JSON"
