# Bazel — REQUIRED-READY. Runs on every PR to master so it can be marked a
# required status check in branch protection (the "make Bazel the build of
# record" toggle — that switch is a repo setting, not this file).
#
# To avoid blocking unrelated PRs, the cheap `changes` job decides whether the
# PR touches any Bazel input; if not, the heavy `bazel` job is skipped, and a
# skipped required check counts as passing.
#
# Fork-safe: PRs from forks have no secrets, so the RBE steps skip and only the
# analyze phase runs (no remote, no network beyond repo fetches).
name: Bazel

on:
  # No path filter here (unlike push): a required check must report on EVERY PR
  # or GitHub blocks the merge waiting for a status that never comes. The
  # `changes` job is the path filter instead.
  pull_request:
    branches: [master]
  # Path-filtered: a master merge touching any Bazel input re-warms the shared
  # cache so the next PR starts warm.
  push:
    branches: [master]
    paths:
      - "MODULE.bazel"
      - ".bazelrc"
      - ".bazelversion"
      - ".bazelignore"
      - "BUILD.bazel"
      - "**/BUILD.bazel"
      # Starlark that BUILD files load — toolchain logic lives here, and
      # `**/BUILD.bazel` alone would let a .bzl-only change slip through.
      - "**/*.bzl"
      - "bazel/**"
      - "tools/scripts/**"
      - "rules_android_ndk.patch"
      - "rules_foreign_cc.patch"
      - "rules_rs.patch"
      - "rules_rust.patch"
      - "hermetic_llvm.patch"
      - "crates/**"
      - "bindings/kotlin/**"
      - "macros/**"
      - "vendor/llama-cpp"
      - "vendor/ort-macos/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "tools/unity-runtime-smoke/**"
      - ".github/workflows/bazel.yml"
      # Markdown inside any path above cannot change a Bazel build.
      - "!**.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bazel-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Cheap path gate (no checkout — just the PR's file list). Lets the heavy
  # `bazel` job be a required check without blocking PRs that only touch
  # unrelated files (docs, other workflows, ...).
  changes:
    name: Detect Bazel-relevant changes
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - name: Check changed paths
        id: filter
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # push / dispatch already path-filter at the trigger → always relevant.
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Drop docs before matching: the patterns below are directory
          # prefixes (`crates/`, `bindings/kotlin/`, ...), so a README inside
          # one of them would otherwise trigger the full RBE matrix.
          FILES=$(gh api --paginate \
            "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" \
            --jq '.[].filename' | grep -vE '\.mdx?$' || true)
          if printf '%s\n' "$FILES" | grep -qE '^(MODULE\.bazel|\.bazelrc|\.bazelversion|\.bazelignore|BUILD\.bazel|.*/BUILD\.bazel|.*\.bzl|bazel/|tools/scripts/|rules_android_ndk\.patch|rules_foreign_cc\.patch|rules_rs\.patch|rules_rust\.patch|hermetic_llvm\.patch|crates/|bindings/kotlin/|macros/|vendor/llama-cpp|vendor/ort-macos/|Cargo\.toml|Cargo\.lock|tools/unity-runtime-smoke/|\.github/workflows/bazel\.yml)'; then
            REL=true
          else
            REL=false
          fi
          echo "relevant=$REL" >> "$GITHUB_OUTPUT"
          echo "Bazel-relevant PR: $REL"

  bazel:
    name: Bazel graph + RBE targets
    # Skipped (→ passing) on PRs that touch no Bazel input; runs otherwise.
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
    # Downstream jobs can't read secrets in a job-level `if`; export the
    # fork-safety signal (RBE available or not) as a job output instead.
    outputs:
      rbe: ${{ steps.rbe-check.outputs.rbe }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: true

      - name: Check RBE availability
        id: rbe-check
        run: echo "rbe=${{ env.BUILDBUDDY_API_KEY != '' }}" >> "$GITHUB_OUTPUT"

      # Repo fetches (LLVM prebuilt, rustc, NDK symlink tree) + downloaded
      # toplevel outputs need headroom; reclaim toolchains this job never
      # touches (keep /usr/local/lib/android — the SDK/NDK setup uses it).
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          df -h /

      # No NDK install: the android_ndk repo rule downloads a pinned Linux NDK
      # r27 as a normal Bazel repository input (rules_android_ndk.patch +
      # XYBRID_NDK_URL/SHA256 in the committed .bazelrc).

      # Yes, on a Linux lane: @macos_sdk is analyzed regardless of target
      # platform, and its Apple URL 403s permanently now — see the action.
      - name: Cache the pinned macOS SDK
        uses: ./.github/actions/bazel-repo-cache
        with:
          macos-sdk-mirror: ${{ vars.MACOS_SDK_MIRROR }}

      # .bazelrc try-imports this gitignored file; in CI it's materialized from
      # the secret. Absent secret (forks) → no :remote config → RBE steps skip.
      - name: Configure BuildBuddy remote config
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: tools/scripts/write-buildbuddy-rc.sh

      # Structural gate (always, fork-safe): every BUILD file in the workspace
      # must configure. Same target set Gate 5 proved (13 targets analyze-clean).
      - name: Analyze workspace (no build)
        run: |
          bazelisk build --nobuild \
            //crates/... //bindings/... //macros/... //xtask/... //integration-tests/... //:llama

      # The RBE-proven hermetic linux chain (PR #326 gates 3B/4), plus the
      # whisper.cpp chain that sits on the same ggml. //:whisper is a plain
      # cc_library depending on //:llama, so building both here is what proves
      # the single-ggml invariant holds in the Bazel graph — not just in cargo,
      # where the build script has to hand-order the link flags.
      - name: Build llama + whisper chains on RBE (linux, hermetic)
        if: env.BUILDBUDDY_API_KEY != ''
        run: |
          bazelisk build --config=remote \
            //:llama \
            //crates/llama-cpp-sys:llama_cpp_sys \
            //crates/xybrid-llama:xybrid_llama \
            //:whisper \
            //crates/whisper-cpp-sys:xybrid_whisper_sys \
            //crates/xybrid-whisper:xybrid_whisper

      # Exactly one ggml must reach the link. A future whisper.cpp bump that
      # stops compiling against llama's pinned ggml would otherwise be fixed by
      # someone reaching for whisper's bundled copy, silently shipping two
      # tensor runtimes in one binary. This asserts the graph shape instead of
      # trusting the convention.
      # cquery, NOT query: the unconfigured `query` loads every arm of every
      # select in the transitive closure, which drags in hermetic-llvm's
      # per-arch kernel-headers repos and fails to resolve one of them. cquery
      # evaluates the resolved configuration only, which is also the graph we
      # actually care about asserting on.
      - name: Assert whisper links llama's ggml, not a second copy
        if: env.BUILDBUDDY_API_KEY != ''
        run: |
          deps=$(bazelisk cquery --config=remote 'deps(//:whisper)' --output=label)
          # //:llama on every hermetic lane; //:llama_metal on --//:metal=true.
          if ! grep -qE '^//:llama(_metal)? ' <<<"$deps"; then
            echo "FATAL: //:whisper depends on neither //:llama nor //:llama_metal," >&2
            echo "       so it is not building on the ggml the rest of the binary" >&2
            echo "       already links." >&2
            exit 1
          fi
          if grep -q 'vendor/whisper-cpp/ggml' <<<"$deps"; then
            echo "FATAL: //:whisper pulled in whisper.cpp's bundled ggml." >&2
            echo "       Two ggml copies in one binary is the failure mode the" >&2
            echo "       whole design exists to prevent." >&2
            exit 1
          fi

      # Tests under Bazel. Bazel BUILDS every shipped artifact; these targets are
      # what stop it from shipping unverified. Runs on this ubuntu runner
      # (host == linux == the RBE executor platform), which is what lets the test
      # binaries execute remotely at all — a darwin-target build of the same
      # targets fails with Exit 126 on a Linux worker.
      #
      # The inline `#[cfg(test)] mod tests` of each crate, plus the `tests/`
      # integration binaries (one target per file, since each is its own binary).
      #
      # Every tests/ binary in the workspace is now covered. The two exceptions
      # are both cargo-gated the same way in cargo itself:
      #  - xybrid-sdk's cloud_fallback_e2e (required-features = ["dev-tools"])
      #    needs `test-util` propagated sdk -> core, and Bazel has no cross-crate
      #    feature propagation.
      #  - integration-tests' local_llm is gated on llm-mistral, a backend
      #    xybrid-core's Bazel target does not build at all.
      #
      # Adding a target is not enough on its own: a file wrapped in
      # `#![cfg(feature = ...)]` compiles to an EMPTY binary that still reports
      # success, so each target's `--list` count is checked against cargo's.
      - name: Run Rust tests on RBE
        if: env.BUILDBUDDY_API_KEY != ''
        run: |
          bazelisk test --config=remote -c opt --test_output=errors \
            //crates/xybrid-cli:all \
            //crates/xybrid-core:all \
            //crates/xybrid-ffi-facade:xybrid-ffi-facade_test \
            //crates/xybrid-llama:all \
            //crates/xybrid-sdk:all \
            //crates/xybrid-whisper:all \
            //integration-tests:all \
            //xtask:xtask_test

      # Desktop lanes on RBE: linux CLI (native) + the macOS-CPU cross
      # (hermetic clang + @macos_sdk + vendored ort; Metal/Swift stay Mac-bound
      # and are NOT built here) + the full windows-gnu CLI (the .exe chapter —
      # llama + the raw-dylib Rust crates via the dlltool toolchain fix + the
      # final MinGW link). Keeps the shared cache warm so a future Mac lane
      # PULLS the shared graph instead of recompiling it — the cache-fed-Mac
      # model.
      - name: Build desktop lanes on RBE (linux CLI, macOS-CPU cross, windows CLI)
        if: env.BUILDBUDDY_API_KEY != ''
        run: |
          bazelisk build --config=remote -c opt \
            //crates/xybrid-cli:xybrid \
            //bindings/flutter/rust:xybrid_flutter_ffi_cdylib
          bazelisk build --config=remote --config=macos \
            //crates/xybrid-cli:xybrid \
            //crates/xybrid-bolt:xybrid_bolt_staticlib
          bazelisk build --config=remote --config=windows -c opt \
            //crates/xybrid-cli:xybrid \
            //crates/xybrid-bolt:xybrid_bolt_cdylib

      # Linux-CLI smoke + parity gate (Flip 1): this is the SHIPPED artifact
      # since the release-prep build-cli-linux cutover — run it, verify the
      # desktop feature set (vision/mtmd + huggingface; parity with cargo's
      # platform-desktop), and hold the hermetic glibc floor (2.28 — the old
      # cargo/ubuntu-24.04 build required 2.39 and couldn't run on 22.04).
      # NOTE: resolve the binary via cquery, NOT the bazel-bin symlink — the
      # symlink tracks the LAST invocation above (windows), whose output is a
      # different platform's binary ("Exec format error").
      - name: Smoke the linux CLI (run + features + glibc floor)
        if: env.BUILDBUDDY_API_KEY != ''
        run: |
          BIN=$(tools/scripts/bazel-output.sh //crates/xybrid-cli:xybrid --config=remote -c opt)
          echo "resolved linux CLI: $BIN"
          file "$BIN"
          "$BIN" --help >/dev/null
          test "$(nm "$BIN" | grep -c ' mtmd_')" -gt 0 || { echo "MISSING vision (mtmd) symbols"; exit 1; }
          strings "$BIN" | grep -q 'huggingface\.co' || { echo "MISSING huggingface support"; exit 1; }
          MAX_GLIBC=$(strings "$BIN" | grep -oE 'GLIBC_[0-9]+\.[0-9]+' | sort -Vu | tail -1)
          echo "glibc floor: $MAX_GLIBC"
          [ "$(printf '%s\n' "$MAX_GLIBC" GLIBC_2.31 | sort -V | tail -1)" = "GLIBC_2.31" ] || { echo "glibc floor regressed above 2.31: $MAX_GLIBC"; exit 1; }
          echo "linux CLI smoke: OK ✅"

      # Windows .exe payload gate (static half): verify the artifact is a real
      # PE32+ x86-64 binary carrying the desktop feature set, then hand it to
      # the windows-latest job below for the run-it half (this linux runner
      # can't execute a PE). cquery, not bazel-bin: the symlink tracks the
      # LAST invocation above.
      - name: Verify + stage the windows CLI (.exe)
        if: env.BUILDBUDDY_API_KEY != ''
        run: |
          EXE=$(tools/scripts/bazel-output.sh //crates/xybrid-cli:xybrid --config=remote --config=windows -c opt)
          echo "resolved windows CLI: $EXE"
          file "$EXE"
          file "$EXE" | grep -q 'PE32+.*x86-64' || { echo "NOT a PE32+ x86-64 binary"; exit 1; }
          grep -aq 'mtmd_' "$EXE" || { echo "MISSING vision (mtmd) markers"; exit 1; }
          grep -aq 'huggingface\.co' "$EXE" || { echo "MISSING huggingface support"; exit 1; }
          mkdir -p /tmp/win-exe && cp "$EXE" /tmp/win-exe/xybrid.exe
          echo "windows CLI payload: OK ✅"

      - name: Upload windows CLI artifact
        if: env.BUILDBUDDY_API_KEY != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bazel-xybrid-windows-exe
          path: /tmp/win-exe/xybrid.exe
          retention-days: 7

      # Windows bolt cdylib (Unity native) — NON-SHIPPING proof lane. Unity still
      # ships the cargo/MSVC DLL; this validates the windows-gnu Bazel DLL end to
      # end before any flip. Byte-inspect + audit here (PE shape, and the import
      # table must be Windows-system-only — the static libc++/unwind trio means
      # no MinGW/MSVC runtime carriers leak out); the run-it half loads it on
      # windows-latest below (bazel-windows-bolt-smoke).
      - name: Verify + audit + stage the windows bolt DLL
        if: env.BUILDBUDDY_API_KEY != ''
        run: |
          DLL=$(tools/scripts/bazel-output.sh //crates/xybrid-bolt:xybrid_bolt_cdylib --config=remote --config=windows -c opt)
          echo "resolved windows bolt DLL: $DLL"
          file "$DLL"
          file "$DLL" | grep -q 'PE32+.*x86-64' || { echo "NOT a PE32+ x86-64 DLL"; exit 1; }
          python3 -m pip install --quiet --user pefile
          # Two namespaces here, and boltffi 0.29 only renamed one of them:
          # crate exports gained a `boltffi_function_<crate>_` prefix, while the
          # Bolt runtime ABI (free_buf, last_error_message) kept its flat names.
          python3 tools/scripts/audit_windows_dll.py --dll "$DLL" \
            --require-export boltffi_function_xybrid_bolt_version \
            --require-export boltffi_function_xybrid_bolt_configure_runtime \
            --require-export boltffi_free_buf \
            --require-export boltffi_last_error_message \
            --require-exports-from-csharp bindings/unity/Runtime/Bolt/XybridBolt.cs
          mkdir -p /tmp/win-bolt && cp "$DLL" /tmp/win-bolt/xybrid_bolt.dll
          echo "windows bolt DLL payload + audit: OK ✅"

      - name: Upload windows bolt DLL artifact
        if: env.BUILDBUDDY_API_KEY != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bazel-xybrid-bolt-windows-dll
          path: /tmp/win-bolt/xybrid_bolt.dll
          retention-days: 7

      # The RBE-proven Android row (PR #326 gates 6-10): NDK cross-compile +
      # one-link .so + complete AAR. ABI fan-out (arm64-v8a / armeabi-v7a /
      # x86_64) happens via transitions inside the graph — one invocation,
      # shipping mode (-c opt + link-time strip).
      - name: Build Android AAR on RBE
        if: env.BUILDBUDDY_API_KEY != ''
        run: |
          bazelisk build --config=remote -c opt \
            //bindings/kotlin:xybrid_kotlin_aar

      # The Flutter android cdylibs are release-critical since the precompile
      # flip (release-prep precompile-flutter-linux ships them) — keep them a
      # standing gate. Cheap: the Rust graph is cache-shared with the AAR
      # build above; only the flutter crate + link are new per ABI.
      - name: Build Flutter android cdylibs on RBE (3 ABIs)
        if: env.BUILDBUDDY_API_KEY != ''
        run: |
          bazelisk build --config=remote --config=android-arm64 \
            //bindings/flutter/rust:xybrid_flutter_ffi_cdylib
          bazelisk build --config=remote --config=android-armv7 \
            //bindings/flutter/rust:xybrid_flutter_ffi_cdylib
          bazelisk build --config=remote --config=android-x86_64 \
            //bindings/flutter/rust:xybrid_flutter_ffi_cdylib

      - name: Upload AAR artifact
        if: env.BUILDBUDDY_API_KEY != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bazel-xybrid-kotlin-aar
          path: bazel-bin/bindings/kotlin/xybrid-kotlin.aar
          retention-days: 7

      # Gradle-consumer smoke: a real AGP app consumes the Bazel AAR the way a
      # Maven consumer would — manifest parses, classes.jar dexes, and all three
      # ABIs' native libs land in the APK. Runner ships the Android SDK.
      - name: Set up JDK 17 (consumer smoke)
        if: env.BUILDBUDDY_API_KEY != ''
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Gradle-consumer smoke of the Bazel AAR
        if: env.BUILDBUDDY_API_KEY != ''
        run: |
          mkdir -p bindings/kotlin/consumer-smoke/app/libs
          cp bazel-bin/bindings/kotlin/xybrid-kotlin.aar bindings/kotlin/consumer-smoke/app/libs/
          bindings/kotlin/gradlew -p bindings/kotlin/consumer-smoke :app:assembleDebug --no-daemon

      - name: Verify APK payload (classes + 3-ABI jniLibs)
        if: env.BUILDBUDDY_API_KEY != ''
        run: |
          APK=bindings/kotlin/consumer-smoke/app/build/outputs/apk/debug/app-debug.apk
          unzip -l "$APK"
          for f in \
            lib/arm64-v8a/libxybrid-bolt.so lib/arm64-v8a/libc++_shared.so lib/arm64-v8a/libonnxruntime.so \
            lib/armeabi-v7a/libxybrid-bolt.so lib/armeabi-v7a/libc++_shared.so \
            lib/x86_64/libxybrid-bolt.so lib/x86_64/libc++_shared.so lib/x86_64/libonnxruntime.so \
            classes.dex; do
            unzip -l "$APK" | grep -q " $f\$" || { echo "MISSING: $f"; exit 1; }
          done
          echo "APK payload complete: 3-ABI jniLibs + classes.dex ✅"

  # The macOS Metal lane (Flip 2), on a real Mac. NOT on pull_request: macOS
  # minutes bill at 10x linux and PR-level coverage of the shared Rust graph
  # already comes from the desktop-lanes step above (the macOS-CPU cross
  # compiles the identical rlib set on linux workers). This job validates the
  # Mac-only remainder — the Metal llama compile + final link — on every
  # master merge and keeps its action cached for the release job.
  bazel-macos-metal:
    name: Bazel macOS Metal lane (mixed execution)
    if: github.event_name != 'pull_request'
    runs-on: macos-14
    timeout-minutes: 45
    env:
      BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: true

      - name: Ensure rfcc host tools
        run: |
          which cmake >/dev/null || brew install cmake
          which pkg-config >/dev/null || brew install pkg-config

      # Apple's pinned SDK URL 403s permanently now; this serves it from cache
      # instead — see the action.
      - name: Cache the pinned macOS SDK
        uses: ./.github/actions/bazel-repo-cache
        with:
          macos-sdk-mirror: ${{ vars.MACOS_SDK_MIRROR }}

      - name: Configure BuildBuddy remote config
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: tools/scripts/write-buildbuddy-rc.sh

      - name: Build Metal CLI (mixed execution)
        if: env.BUILDBUDDY_API_KEY != ''
        run: |
          bazelisk build --config=remote --config=macos-metal -c opt \
            //crates/xybrid-cli:xybrid \
            //bindings/flutter/rust:xybrid_flutter_ffi_staticlib

      # Release-critical since the Flutter precompile flip: release-prep's
      # precompile-flutter-darwin stages THREE Apple slices of this staticlib —
      # aarch64-apple-darwin (built above), aarch64-apple-ios and
      # aarch64-apple-ios-sim. Both ios configs are Mac-local, like the configs
      # themselves.
      #
      # The device slice used to be skipped here on the grounds that
      # build-apple.yml already covered it. It does not: that workflow builds
      # //bindings/apple:XybridFFI, which is the BOLT staticlib from a different
      # crate. Nothing was compiling //bindings/flutter/rust for iOS-device
      # until release time.
      - name: Build Flutter iOS staticlibs (device + simulator)
        if: env.BUILDBUDDY_API_KEY != ''
        run: |
          bazelisk build --config=ios \
            //bindings/flutter/rust:xybrid_flutter_ffi_staticlib
          bazelisk build --config=ios-sim \
            //bindings/flutter/rust:xybrid_flutter_ffi_staticlib

      - name: Smoke the Metal CLI (run + Metal + features)
        if: env.BUILDBUDDY_API_KEY != ''
        run: |
          BIN=$(tools/scripts/bazel-output.sh //crates/xybrid-cli:xybrid --config=remote --config=macos-metal -c opt)
          echo "resolved CLI: $BIN"
          file "$BIN"
          "$BIN" --help >/dev/null
          test "$(nm "$BIN" | grep -c '_ggml_metal')" -gt 0 || { echo "MISSING Metal symbols"; exit 1; }
          test "$(nm "$BIN" | grep -c '_mtmd_')" -gt 0 || { echo "MISSING vision symbols"; exit 1; }
          strings "$BIN" | grep -q 'huggingface\.co' || { echo "MISSING huggingface"; exit 1; }
          echo "Metal CLI smoke: OK"

  # The desktop-Linux GPU lane: the CLI with ggml's Vulkan backend linked in.
  #
  # #307 gave the CARGO build a Vulkan opt-in (XYBRID_LLAMA_CPP_VULKAN=1), but
  # the shipped Linux CLI comes from Bazel, which sets the cmake defines itself
  # and never reads that variable — so this job is what makes a distributed
  # binary able to use a GPU.
  #
  # Mixed execution, like bazel-macos-metal: the Rust graph compiles on RBE and
  # only //:llama_vulkan runs here, because ggml's Vulkan build needs glslc, the
  # Vulkan headers/loader and a host compiler on the machine running cmake, and
  # the RBE image is a bare ubuntu:22.04 that has none of them. Hence the SDK
  # install step below.
  #
  # Runs on PRs (unlike the metal/MSVC lanes): this lane is new, and llama.cpp
  # with GGML_VULKAN=ON is exactly the compile most likely to break on an
  # upstream bump. The build steps stay RBE-gated, so a fork PR — which has no
  # secret and would otherwise compile the entire graph on the runner — only
  # pays for the analysis phase.
  bazel-linux-vulkan:
    name: Bazel linux Vulkan lane
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: true

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          df -h /

      # glslc + libvulkan-dev, which is where //:llama_vulkan's pinned
      # Vulkan_LIBRARY / Vulkan_GLSLC_EXECUTABLE point. Shared with ci.yml's
      # cargo Vulkan job.
      - name: Setup Vulkan SDK
        uses: ./.github/actions/setup-vulkan-sdk

      # //:llama_vulkan reads the Vulkan headers from a fixed /opt path, which
      # this step points at whatever the runner actually has. Fixed, because a
      # cmake cache value has to be known at analysis time — the SDK's own
      # directory is version-stamped.
      #
      # Staged rather than used in place because cmake turns Vulkan_INCLUDE_DIR
      # into a `-I`, and a `-I` outranks the toolchain sysroot: handing it
      # /usr/include would shadow hermetic-llvm's libc headers with this
      # runner's glibc 2.39 ones while the link still uses glibc 2.28. A
      # directory holding only the Vulkan trees cannot do that.
      #
      # The loader is NOT staged — it comes from //bazel/vulkan:libvulkan.so,
      # built by our own toolchain (see bazel/vulkan/vulkan_stub.c).
      - name: Stage the Vulkan headers
        run: |
          sudo mkdir -p /opt/xybrid-vulkan-include
          # Prefer the LunarG SDK's tree: it is what the cargo Vulkan job
          # (ci.yml) builds against, so it is the proven header set.
          INC="${VULKAN_SDK:+$VULKAN_SDK/include}"
          if [ ! -d "${INC:-}" ]; then
            # No usable SDK: fall back to apt. libvulkan-dev does not depend on
            # spirv-headers, so ask for it explicitly.
            sudo apt-get install -y spirv-headers
            INC=/usr/include
          fi
          echo "headers: $INC"
          # vulkan/ is the obvious one; vk_video/ because vulkan_core.h includes
          # the video codec headers; spirv/ because ggml-vulkan.cpp includes
          # <spirv/unified1/spirv.hpp> for its cooperative-matrix paths.
          for tree in vulkan vk_video spirv; do
            test -d "$INC/$tree" || { echo "missing $INC/$tree"; exit 1; }
            sudo ln -sfn "$INC/$tree" "/opt/xybrid-vulkan-include/$tree"
          done
          ls -l /opt/xybrid-vulkan-include

      # One shared cache entry across every lane — see the action for why this
      # download in particular needs it.
      - name: Cache the pinned macOS SDK
        uses: ./.github/actions/bazel-repo-cache
        with:
          macos-sdk-mirror: ${{ vars.MACOS_SDK_MIRROR }}

      - name: Configure BuildBuddy remote config
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: tools/scripts/write-buildbuddy-rc.sh

      # Fork-safe structural gate: the flag, the config_settings and the
      # //:llama_vulkan selects have to resolve even with no secret present.
      - name: Analyze the Vulkan lane (no build)
        run: |
          bazelisk build --nobuild --config=linux-vulkan -c opt \
            //crates/xybrid-cli:xybrid //:llama_vulkan

      - name: Build the Vulkan CLI (mixed execution)
        if: env.BUILDBUDDY_API_KEY != ''
        run: |
          bazelisk build --config=remote --config=linux-vulkan -c opt \
            //crates/xybrid-cli:xybrid

      # What a green build does NOT prove: that Vulkan is actually USED. The
      # runner has a loader but no GPU, so llama.cpp falls back to CPU at
      # runtime. This asserts the parts that are checkable here — the backend
      # is compiled in, the loader is a real link dependency, and the feature
      # set still matches the CPU lane.
      - name: Smoke the Vulkan CLI (run + backend + loader + features)
        if: env.BUILDBUDDY_API_KEY != ''
        run: |
          BIN=$(tools/scripts/bazel-output.sh //crates/xybrid-cli:xybrid --config=remote --config=linux-vulkan -c opt)
          echo "resolved Vulkan CLI: $BIN"
          file "$BIN"
          "$BIN" --help >/dev/null
          test "$(nm "$BIN" | grep -c 'ggml_backend_vk')" -gt 0 || { echo "MISSING Vulkan backend symbols"; exit 1; }
          readelf -d "$BIN" | grep -q 'libvulkan\.so\.1' || { echo "NOT linked against the Vulkan loader"; exit 1; }
          test "$(nm "$BIN" | grep -c ' mtmd_')" -gt 0 || { echo "MISSING vision (mtmd) symbols"; exit 1; }
          strings "$BIN" | grep -q 'huggingface\.co' || { echo "MISSING huggingface support"; exit 1; }
          # Same floor the CPU lane holds. This is the guard on the Vulkan
          # include path: if ggml-vulkan's TUs ever pick up the runner's glibc
          # headers instead of the hermetic sysroot's, the floor jumps here.
          MAX_GLIBC=$(strings "$BIN" | grep -oE 'GLIBC_[0-9]+\.[0-9]+' | sort -Vu | tail -1)
          echo "glibc floor: $MAX_GLIBC"
          [ "$(printf '%s\n' "$MAX_GLIBC" GLIBC_2.31 | sort -V | tail -1)" = "GLIBC_2.31" ] || { echo "glibc floor regressed above 2.31: $MAX_GLIBC"; exit 1; }
          echo "Vulkan CLI smoke: OK ✅"

  # The windows-MSVC lane — NON-SHIPPING proof, like the windows-gnu bolt DLL
  # above. Everything compiles on Linux RBE workers; the runner only fetches
  # repositories and inspects outputs.
  #
  # Master-merge / dispatch only (same shape as bazel-macos-metal), because
  # @msvc_runtime + @windows_sdk are ~1.3 GB of Microsoft payload fetched
  # CLIENT-side, and this workflow keeps no repository cache. Putting that on
  # every Bazel-touching PR would cost more than the lane is worth until the
  # Flutter windows producer actually flips to it.
  bazel-windows-msvc:
    name: Bazel windows-MSVC lane (non-shipping)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
    # Every build step below is secret-gated, so without RBE this job succeeds
    # having produced nothing. Downstream jobs can't read secrets in a job-level
    # `if`, so publish the same fork-safety signal the `bazel` job does — else a
    # consumer sees a green producer and fails on the missing artifact.
    outputs:
      rbe: ${{ steps.rbe-check.outputs.rbe }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: true

      - name: Check RBE availability
        id: rbe-check
        run: echo "rbe=${{ env.BUILDBUDDY_API_KEY != '' }}" >> "$GITHUB_OUTPUT"

      # The Microsoft payload lands on top of the usual LLVM/rustc/NDK fetches,
      # so this job needs the headroom more than the others do.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          df -h /

      - name: Configure BuildBuddy remote config
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: tools/scripts/write-buildbuddy-rc.sh

      # Serve hermetic-llvm's pinned macOS SDK from cache: Apple's URL 403s
      # permanently and its only mirror throttles Actions runners. Analyzed on
      # every target platform, not just Apple ones — see the action.
      - name: Cache the pinned macOS SDK
        uses: ./.github/actions/bazel-repo-cache
        with:
          macos-sdk-mirror: ${{ vars.MACOS_SDK_MIRROR }}

      # The toolchain smokes come first and are cheap: they pull windows.h, the
      # MSVC STL and clang's builtin headers, so a sysroot or include-order
      # regression fails here rather than 20 minutes into llama.cpp.
      - name: Build the windows-MSVC toolchain smokes
        if: env.BUILDBUDDY_API_KEY != ''
        run: |
          bazelisk build --config=remote --config=windows-msvc \
            //bazel/windows_msvc_smoke:smoke_exe \
            //bazel/windows_msvc_smoke:smoke_dll

      - name: Build llama.cpp + the Flutter native for windows-MSVC
        if: env.BUILDBUDDY_API_KEY != ''
        run: |
          bazelisk build --config=remote --config=windows-msvc -c opt \
            //:llama \
            //bindings/flutter/rust:xybrid_flutter_ffi_cdylib

      # The gate that actually distinguishes this lane from windows-gnu: the DLL
      # must import the MSVC runtime (VCRUNTIME140/MSVCP140), and cargokit needs
      # a real MSVC import library beside it. A MinGW build satisfies neither.
      - name: Verify the MSVC ABI + import library
        if: env.BUILDBUDDY_API_KEY != ''
        run: |
          set -euo pipefail
          DLL=$(tools/scripts/bazel-output.sh --ext dll \
            //bindings/flutter/rust:xybrid_flutter_ffi_cdylib \
            --config=remote --config=windows-msvc -c opt)
          IMPLIB=$(tools/scripts/bazel-output.sh --ext dll.lib \
            //bindings/flutter/rust:xybrid_flutter_ffi_cdylib \
            --config=remote --config=windows-msvc -c opt)
          echo "resolved DLL: $DLL"
          echo "resolved import library: $IMPLIB"
          file "$DLL"
          file "$DLL" | grep -q 'PE32+.*x86-64' || { echo "NOT a PE32+ x86-64 DLL"; exit 1; }
          python3 -m pip install --quiet --user pefile
          python3 tools/scripts/audit_windows_dll.py --dll "$DLL" \
            --require-import vcruntime140.dll \
            --require-import msvcp140.dll
          python3 - "$DLL" "$IMPLIB" <<'PYEOF'
          import sys

          import pefile

          dll_path, implib_path = sys.argv[1], sys.argv[2]
          exports = len(pefile.PE(dll_path).DIRECTORY_ENTRY_EXPORT.symbols)

          blob = open(implib_path, "rb").read()
          if blob[:8] != b"!<arch>\n":
              raise SystemExit(f"{implib_path}: not a COFF archive")
          offset, short_imports = 8, 0
          while offset + 60 <= len(blob):
              size = int(blob[offset + 48:offset + 58].decode().strip())
              # 0x0000FFFF marks a short-import member: the MSVC-only encoding
              # that a MinGW `.dll.a` never contains.
              if blob[offset + 60:offset + 64] == b"\x00\x00\xff\xff":
                  short_imports += 1
              offset += 60 + size + (size & 1)

          print(f"exports: {exports}, short-import members: {short_imports}")
          if short_imports != exports:
              raise SystemExit("import library does not cover every export")
          PYEOF
          mkdir -p /tmp/win-msvc
          cp "$DLL" "$IMPLIB" /tmp/win-msvc/
          echo "windows-MSVC payload: OK"

      - name: Upload windows-MSVC Flutter native
        if: env.BUILDBUDDY_API_KEY != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bazel-xybrid-flutter-windows-msvc
          path: /tmp/win-msvc/
          retention-days: 7

  # The run-it half of the windows-MSVC gate. bazel-windows-msvc can build the
  # DLL and byte-inspect it, but a PE that inspects clean can still fail to load
  # — a missing Visual C++ redistributable or a bad import is only visible when
  # Windows actually resolves it. This is the first time anything built by the
  # MSVC toolchain runs on Windows; it compiles nothing (the build happened on
  # Linux workers) and costs a couple of windows-latest minutes per master merge.
  bazel-windows-msvc-smoke:
    name: Bazel windows-MSVC Flutter DLL smoke (loads it on Windows)
    needs: bazel-windows-msvc
    # Gate on the producer's RBE signal, not the event name: a push in a fork is
    # not a pull_request, so the event check alone let this run against a
    # producer that had skipped every build step, and the download failed with
    # "Artifact not found". Matches bazel-windows-smoke / bazel-windows-bolt-smoke.
    if: needs.bazel-windows-msvc.outputs.rbe == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: bazel-xybrid-flutter-windows-msvc
          path: native

      # LoadLibrary is the real test: it resolves the whole import table against
      # the machine, so a DLL that needs a runtime this box lacks fails here.
      # GetProcAddress then proves the export table is usable, which is what
      # Flutter reaches the library through.
      - name: Load the DLL and resolve an export
        shell: pwsh
        run: |
          $dll = (Resolve-Path native/xybrid_flutter_ffi.dll).Path
          Write-Host "loading $dll"

          Add-Type -Namespace Win -Name Native -MemberDefinition @'
          [System.Runtime.InteropServices.DllImport("kernel32", SetLastError = true)]
          public static extern System.IntPtr LoadLibrary(string path);
          [System.Runtime.InteropServices.DllImport("kernel32", SetLastError = true)]
          public static extern System.IntPtr GetProcAddress(System.IntPtr module, string name);
          '@

          $handle = [Win.Native]::LoadLibrary($dll)
          if ($handle -eq [System.IntPtr]::Zero) {
            $code = [System.Runtime.InteropServices.Marshal]::GetLastWin32Error()
            throw "LoadLibrary failed (Win32 error $code)"
          }
          Write-Host "loaded, handle $handle"

          # flutter_rust_bridge's Dart-API entry point: present in every frb
          # build and the first thing Dart calls, so its absence would break
          # the binding outright.
          foreach ($export in @('frb_init_frb_dart_api_dl', 'store_dart_post_cobject')) {
            $address = [Win.Native]::GetProcAddress($handle, $export)
            if ($address -eq [System.IntPtr]::Zero) {
              throw "GetProcAddress('$export') failed"
            }
            Write-Host "resolved $export at $address"
          }

          Write-Host "windows-MSVC Flutter DLL smoke: OK"

  # The run-it half of the windows .exe gate: the linux job can build and
  # byte-inspect the PE but not execute it — a real Windows runner downloads
  # the RBE-built artifact and runs it. This is the only Windows machine in
  # the whole lane, and it compiles nothing (the build happened on Linux
  # workers); a few windows-latest minutes per Bazel-touching PR.
  bazel-windows-smoke:
    name: Bazel windows .exe smoke (runs the RBE-built CLI)
    needs: bazel
    if: needs.bazel.outputs.rbe == 'true'
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: bazel-xybrid-windows-exe

      - name: Run the .exe + verify features
        shell: bash
        run: |
          ls -la xybrid.exe
          ./xybrid.exe --help
          ./xybrid.exe --version || true
          grep -aq 'mtmd_' xybrid.exe || { echo "MISSING vision (mtmd) markers"; exit 1; }
          grep -aq 'huggingface\.co' xybrid.exe || { echo "MISSING huggingface support"; exit 1; }
          echo "windows .exe smoke: OK"

  # Run-it half of the windows bolt-DLL proof (Unity native): a real Windows
  # runner downloads the RBE-built xybrid_bolt.dll, stages ORT beside it, and
  # runs a MANAGED C# smoke — loads the DLL under the CLR and P/Invokes a real
  # boltffi entry point (stronger than a bare ctypes load, and the runtime
  # validation the linux byte-inspection can't do). NON-SHIPPING: Unity keeps
  # shipping the cargo/MSVC DLL until this windows-gnu lane is trusted.
  bazel-windows-bolt-smoke:
    name: Bazel windows bolt DLL smoke (managed C# P/Invoke)
    needs: bazel
    if: needs.bazel.outputs.rbe == 'true'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: bazel-xybrid-bolt-windows-dll
          path: tools/windows-smoke

      - name: Build the managed smoke
        run: dotnet build tools/windows-smoke/xybrid-bolt-smoke.csproj -c Release

      - name: Stage natives beside the smoke exe (bolt DLL + ORT)
        shell: bash
        run: |
          set -euo pipefail
          OUT=tools/windows-smoke/bin/Release/net8.0
          cp tools/windows-smoke/xybrid_bolt.dll "$OUT/"
          python tools/scripts/stage_unity_desktop_ort.py windows "$OUT"
          ls -la "$OUT"

      - name: Run managed C# smoke (load DLL + boltffi P/Invoke)
        shell: bash
        run: ./tools/windows-smoke/bin/Release/net8.0/xybrid-bolt-smoke.exe

  # The Windows Unity 6.3 EditMode + IL2CPP player smoke runs as a ONE-TIME
  # MANUAL validation — NOT as a hosted-runner CI lane. Unity licensing on
  # ephemeral GitHub-hosted Windows runners is not viable: service accounts
  # cannot activate Editor licenses, and a locally-activated .ulf is
  # machine-bound ("Machine bindings don't match" on a fresh image). The
  # reusable smoke project under tools/unity-runtime-smoke/ is committed here
  # so it can be driven once on a Windows box that's already Unity-licensed;
  # the build-unity.yml cargo->Bazel flip is gated on that manual sign-off.
  # See tools/unity-runtime-smoke/README.md for the exact commands.
