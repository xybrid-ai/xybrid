# Validates every gradle-wrapper.jar in the repo against Gradle's published
# checksums, so a tampered wrapper can't slip in via the binary blobs we ship
# in the Android/Kotlin bindings and examples. Also satisfies the OpenSSF
# Scorecard Binary-Artifacts allowance for gradle-wrapper.jar files.
name: Gradle Wrapper Validation

on:
  push:
    branches: [master]
    paths:
      - '**/gradle/wrapper/gradle-wrapper.jar'
      - '**/gradle/wrapper/gradle-wrapper.properties'
      - '**/gradlew'
      - '**/gradlew.bat'
      - '**/*.gradle'
      - '**/*.gradle.kts'
      - '.github/workflows/gradle-wrapper-validation.yml'
  pull_request:
    branches: [master]
    paths:
      - '**/gradle/wrapper/gradle-wrapper.jar'
      - '**/gradle/wrapper/gradle-wrapper.properties'
      - '**/gradlew'
      - '**/gradlew.bat'
      - '**/*.gradle'
      - '**/*.gradle.kts'
      - '.github/workflows/gradle-wrapper-validation.yml'

permissions: read-all

jobs:
  validation:
    name: Validate Gradle wrapper
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
