name: Scorecard

on:
  schedule:
    # Weekly Monday 6:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch:

# Scorecard's publish_results restrictions: no top-level env or defaults,
# no workflow-level write permissions.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
          # The default GITHUB_TOKEN cannot read branch-protection settings, so
          # the Branch-Protection check errors out. Supply a PAT with
          # Administration:read (secret SCORECARD_TOKEN) to score it fully.
          # Falls back to the default token when the secret is absent, so this
          # is safe to land before the secret exists.
          repo_token: ${{ secrets.SCORECARD_TOKEN || github.token }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v3
        with:
          sarif_file: results.sarif
