# Purpose: Weekly OpenSSF Scorecard run; publishes results and uploads SARIF to code scanning.
name: "Security: OpenSSF Scorecard"

on:
  schedule:
    # Weekly Monday 6:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch:

# Scorecard's publish_results restrictions: no top-level env or defaults,
# no workflow-level write permissions.
concurrency:
  group: scorecard-${{ github.ref }}
  cancel-in-progress: true

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
          # The default GITHUB_TOKEN cannot read branch-protection settings, so
          # the Branch-Protection check errors out. Supply a PAT with
          # Administration:read (secret SCORECARD_TOKEN) to score it fully.
          # Falls back to the default token when the secret is absent, so this
          # is safe to land before the secret exists.
          repo_token: ${{ secrets.SCORECARD_TOKEN || github.token }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v3
        with:
          sarif_file: results.sarif
