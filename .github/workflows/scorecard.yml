name: Scorecard

on:
  schedule:
    # Weekly Monday 6:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch:

# Scorecard's publish_results restrictions: no top-level env or defaults,
# no workflow-level write permissions.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@4eaacf0543bb3f2c246792bd56e8cdeffafb205a # v2.4.3
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
          # The default GITHUB_TOKEN cannot read branch-protection settings, so
          # the Branch-Protection check errors out. Supply a PAT with
          # Administration:read (secret SCORECARD_TOKEN) to score it fully.
          # Falls back to the default token when the secret is absent, so this
          # is safe to land before the secret exists.
          repo_token: ${{ secrets.SCORECARD_TOKEN || github.token }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - uses: github/codeql-action/upload-sarif@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v3
        with:
          sarif_file: results.sarif
