# Unity Editor CI — the first job in this repo that runs a real Unity Editor.
#
# Everything else that touches the Unity SDK only compiles C#: ci.yml's
# `unity-bolt-compile` is a `dotnet build` against netstandard2.1. That is not
# enough — the `Unsafe.SizeOf<T>()` regression passed that gate and only failed
# inside an actual Editor, because Unity's compiler and `dotnet build` disagree
# about what is available.
#
# This job imports the package into Unity 6000.3.6f1 (the version
# tools/unity-runtime-smoke pins), compiles it with Unity's own compiler, and
# runs the package's EditMode tests against a Bazel-built Linux native. One of
# the four test files drives ~16 native call sites, so the .so is genuinely
# exercised rather than merely present. It then AOT-compiles the same package
# into a Linux IL2CPP player and runs the player headlessly against that native.
# Last, a second EditMode run executes the shared observability runtime scenario
# (tools/scripts/observability_capture/scenario.md) in the Editor against a local
# OTLP receiver and checks what the native exported.
#
# The Windows plugin loader remains outside hosted CI.
# Purpose: Run a real Unity Editor: EditMode tests against a Bazel-built native, an IL2CPP player smoke, then the observability runtime scenario.
name: "SDK: Unity Editor"

on:
  pull_request:
    branches: [master]
    paths:
      - "bindings/unity/**"
      - "crates/xybrid-bolt/**"
      - "crates/xybrid-ffi-facade/**"
      # The SDK and the observability crate it links: the observability
      # runtime scenario below exercises their export, content rules and
      # lifecycle through the C# API. xybrid-core is left to the Apple,
      # Android and Flutter lanes, which run the same scenario on its changes.
      - "crates/xybrid-sdk/**"
      - "crates/xybrid-observability/**"
      - "tools/unity-runtime-smoke/**"
      - "tools/scripts/stage_unity_native.py"
      - "tools/scripts/stage_unity_desktop_ort.py"
      - "tools/scripts/bazel-output.sh"
      - "tools/scripts/write-buildbuddy-rc.sh"
      - "tools/scripts/observability_capture/**"
      - ".github/workflows/unity-editor.yml"
      # Markdown inside any path above cannot affect this build.
      - "!**.md"
  push:
    branches: [master]
    paths:
      - "bindings/unity/**"
      - "crates/xybrid-bolt/**"
      - "crates/xybrid-ffi-facade/**"
      - "crates/xybrid-sdk/**"
      - "crates/xybrid-observability/**"
      - "tools/unity-runtime-smoke/**"
      - "tools/scripts/stage_unity_native.py"
      - "tools/scripts/stage_unity_desktop_ort.py"
      - "tools/scripts/bazel-output.sh"
      - "tools/scripts/write-buildbuddy-rc.sh"
      - "tools/scripts/observability_capture/**"
      - ".github/workflows/unity-editor.yml"
      # Markdown inside any path above cannot affect this build.
      - "!**.md"
  workflow_dispatch:

permissions:
  contents: read
  # game-ci/unity-test-runner publishes the result as a GitHub Check. Without
  # this the Checks API call fails with "Resource not accessible by integration".
  checks: write

concurrency:
  group: unity-editor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  editmode:
    name: Unity Editor (Linux, Mono + IL2CPP)
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: true

      # Every step below is secret-gated so fork PRs (which get none) skip
      # instead of failing. That leaves a trap: on a run that IS supposed to have
      # secrets, a missing one would skip the Unity step and the job would still
      # report success — a gate that looks healthy while testing nothing.
      #
      # So assert up front, and only for runs that should have secrets: same-repo
      # PRs, master pushes, and manual dispatches. Fork PRs fall through to the
      # skips by design.
      #
      # The `github.repository` test is what makes that true for pushes as well.
      # A contributor who syncs their fork's master triggers this workflow in
      # THEIR repo, where no secret exists — and a push is not a pull_request, so
      # the event test alone let the assertion fire and failed every fork's
      # Actions tab. Secrets are only ever expected in the canonical repo.
      - name: Require credentials (non-fork runs)
        if: >-
          github.repository == 'xybrid-ai/xybrid' &&
          (github.event_name != 'pull_request' ||
           github.event.pull_request.head.repo.full_name == github.repository)
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          missing=""
          [ -n "${BUILDBUDDY_API_KEY}" ] || missing="$missing BUILDBUDDY_API_KEY"
          [ -n "${UNITY_LICENSE}" ]      || missing="$missing UNITY_LICENSE"
          [ -n "${UNITY_EMAIL}" ]        || missing="$missing UNITY_EMAIL"
          [ -n "${UNITY_PASSWORD}" ]     || missing="$missing UNITY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "Missing required secret(s):$missing"
            echo "Without them the native build and/or the EditMode step would be"
            echo "skipped and this job would report success without running Unity."
            exit 1
          fi
          echo "All required secrets present."

      # The Unity Editor image is ~10 GB on top of the Bazel fetches, so reclaim
      # the toolchains this job never touches before pulling anything.
      #
      # /usr/local/lib/android is deliberately NOT removed, matching bazel.yml:
      # rules_android's android_sdk_repository rule reads it while FETCHING
      # repositories, so deleting it aborts analysis of any target — including
      # this one, which has nothing to do with Android:
      #   "No Android SDK apis found in the Android SDK at /usr/local/lib/android/sdk"
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          df -h /

      # Same gitignored-file pattern the Bazel workflow uses: the key never
      # lands in a committable file. Absent secret (forks) -> no :remote config.
      - name: Configure BuildBuddy remote config
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: tools/scripts/write-buildbuddy-rc.sh

      # Serve hermetic-llvm's pinned macOS SDK from cache: Apple's URL 403s
      # permanently and its only mirror throttles Actions runners. Analyzed on
      # every target platform, not just Apple ones — see the action.
      - name: Cache the pinned macOS SDK
        uses: ./.github/actions/bazel-repo-cache
        with:
          macos-sdk-mirror: ${{ vars.MACOS_SDK_MIRROR }}

      # The Linux bolt cdylib is not built anywhere else in CI — bazel.yml builds
      # the windows one for the Unity DLL proof, and the linux CLI, but never
      # this. Only the toplevel .so is downloaded (--remote_download_toplevel).
      - name: Build the Linux bolt native (Bazel/RBE)
        if: env.BUILDBUDDY_API_KEY != ''
        run: |
          bazelisk build --config=remote -c opt \
            //crates/xybrid-bolt:xybrid_bolt_cdylib

      - name: Stage the native + ONNX Runtime into the package
        if: env.BUILDBUDDY_API_KEY != ''
        run: |
          set -euo pipefail
          LIB=$(tools/scripts/bazel-output.sh //crates/xybrid-bolt:xybrid_bolt_cdylib \
            --config=remote -c opt)
          echo "bolt native: $LIB"
          python3 tools/scripts/stage_unity_native.py --lib "$LIB" \
            --target x86_64-unknown-linux-gnu
          # Linux links ORT dynamically, so libonnxruntime.so ships beside it.
          # output_dir is REQUIRED (build-unity.yml passes it on a folded second
          # line, which is easy to misread as a one-argument call).
          python3 tools/scripts/stage_unity_desktop_ort.py linux \
            bindings/unity/Runtime/Plugins/Linux
          # Pin the native version so the package's editor resolver treats the
          # staged library as current and does not fetch a release asset over it.
          VERSION=$(python3 -c "import json; print(json.load(open('bindings/unity/package.json'))['version'])")
          mkdir -p tools/unity-runtime-smoke/Assets/Xybrid/Plugins
          printf '%s\n' "$VERSION" \
            > tools/unity-runtime-smoke/Assets/Xybrid/Plugins/.xybrid-native-linux-version
          ls -la bindings/unity/Runtime/Plugins/Linux

      # Personal-license activation per GameCI v4: the .ulf is generated once by
      # Unity Hub and stored as UNITY_LICENSE, together with the account
      # email/password. Fork PRs carry no secrets, so this is skipped there
      # rather than failing.
      - name: Run EditMode tests
        if: env.UNITY_LICENSE != ''
        uses: game-ci/unity-test-runner@0ff419b913a3630032cbe0de48a0099b5a9f0ed9 # v4.3.1
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: tools/unity-runtime-smoke
          unityVersion: 6000.3.6f1
          testMode: EditMode
          artifactsPath: unity-editmode-results
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: Unity EditMode results

      - name: Build Linux IL2CPP smoke player
        if: env.UNITY_LICENSE != ''
        uses: game-ci/unity-builder@1d4ee0697f193f54668e98961d79907911f4b4f2 # v4.8.1
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: tools/unity-runtime-smoke
          unityVersion: 6000.3.6f1
          targetPlatform: StandaloneLinux64
          buildMethod: Builder.PerformBuild
          manualExit: true
          allowDirtyBuild: true

      - name: Run Linux IL2CPP smoke player
        if: env.UNITY_LICENSE != ''
        run: |
          set -euo pipefail
          PLAYER=tools/unity-runtime-smoke/Build/linux-il2cpp/XybridSmoke.x86_64
          LOG="$RUNNER_TEMP/linux-il2cpp-player.log"
          ls -l "$PLAYER"
          test -x "$PLAYER"
          command -v xvfb-run

          set +e
          timeout 120s xvfb-run --auto-servernum \
            --server-args="-screen 0 1024x768x24" \
            "$PLAYER" -batchmode -logFile "$LOG"
          PLAYER_STATUS=$?
          set -e

          cat "$LOG"
          if [ "$PLAYER_STATUS" -ne 0 ]; then
            echo "Linux IL2CPP smoke player exited with status $PLAYER_STATUS."
            exit "$PLAYER_STATUS"
          fi
          grep -Fq "[XybridSmoke] OK" "$LOG"

      # The shared observability runtime scenario
      # (tools/scripts/observability_capture/scenario.md), on the Editor's Mono
      # runtime against the native staged above.
      # bindings/unity/Tests/Editor/ObservabilityRuntimeScenarioTests.cs drives
      # the public C# API against capture_server.py and writes expectations.json;
      # check_capture.py then compares it with what the receiver recorded
      # (parent-in, reference-out, manual operations, content controls,
      # lifecycle).
      #
      # game-ci runs the Editor in a container that forwards only its own list
      # of environment variables and mounts only the workspace, as
      # /github/workspace. So the test takes its settings as Editor arguments,
      # writes under the workspace, and reaches the receiver on the runner
      # through the host network. Without those arguments the test is ignored,
      # as in the EditMode run above; the check step then fails on the missing
      # expectations.json, so a skipped scenario cannot pass.
      - name: Start the observability capture receiver
        id: capture
        if: env.UNITY_LICENSE != ''
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/unity-observability"
          rm -rf "$OUT"
          mkdir -p "$OUT"
          # Outlives this step; the check step stops it.
          nohup python3 tools/scripts/observability_capture/capture_server.py \
            --port 0 --out "$OUT/capture.jsonl" --ready-file "$OUT/ready.json" \
            < /dev/null > "$OUT/server.log" 2>&1 &
          echo "$!" > "$OUT/server.pid"
          for _ in $(seq 1 100); do
            [ -s "$OUT/ready.json" ] && break
            kill -0 "$(cat "$OUT/server.pid")" 2>/dev/null || break
            sleep 0.1
          done
          if [ ! -s "$OUT/ready.json" ]; then
            cat "$OUT/server.log"
            echo "::error::capture_server.py did not start."
            exit 1
          fi
          PORT=$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1]))["port"])' "$OUT/ready.json")
          echo "port=$PORT" >> "$GITHUB_OUTPUT"
          echo "OTLP receiver listening on port $PORT"

      # No githubToken: a failed test then fails this step through Unity's exit
      # code, without publishing a second check run.
      - name: Run the observability runtime scenario (EditMode)
        if: steps.capture.outcome == 'success'
        uses: game-ci/unity-test-runner@0ff419b913a3630032cbe0de48a0099b5a9f0ed9 # v4.3.1
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: tools/unity-runtime-smoke
          unityVersion: 6000.3.6f1
          testMode: EditMode
          artifactsPath: unity-observability-results
          useHostNetwork: true
          customParameters: >-
            -testCategory ObservabilityRuntimeScenario
            -xybridScenarioEndpoint http://127.0.0.1:${{ steps.capture.outputs.port }}
            -xybridScenarioExpectations /github/workspace/unity-observability/expectations.json
            -xybridScenarioWorkdir /github/workspace/unity-observability/work

      - name: Check the observability capture
        if: always() && steps.capture.outcome == 'success'
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/unity-observability"
          # SIGTERM: the receiver writes its last line and exits 0.
          PID=$(cat "$OUT/server.pid")
          kill -TERM "$PID" 2>/dev/null || true
          for _ in $(seq 1 100); do
            kill -0 "$PID" 2>/dev/null || break
            sleep 0.1
          done
          cat "$OUT/server.log"
          if [ ! -f "$OUT/expectations.json" ]; then
            echo "::error::The scenario wrote no expectations.json: the test was ignored (were the -xybridScenario* arguments passed?) or the Editor stopped before it. See unity-observability-results/editmode.log."
            exit 1
          fi
          python3 tools/scripts/observability_capture/check_capture.py \
            --capture "$OUT/capture.jsonl" \
            --expectations "$OUT/expectations.json" \
            --report "$OUT/report.json"

      - name: Upload test results
        if: always() && env.UNITY_LICENSE != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unity-editmode-results
          path: unity-editmode-results
          if-no-files-found: warn
          retention-days: 7

      - name: Upload IL2CPP smoke log
        if: always() && env.UNITY_LICENSE != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unity-linux-il2cpp-smoke-log
          path: ${{ runner.temp }}/linux-il2cpp-player.log
          if-no-files-found: warn
          retention-days: 7

      - name: Upload observability scenario evidence
        if: always() && steps.capture.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unity-observability-scenario
          path: |
            unity-observability
            unity-observability-results
          if-no-files-found: warn
          retention-days: 7
