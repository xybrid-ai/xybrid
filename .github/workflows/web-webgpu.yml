# Purpose: Manual: build the Web SDK and run WebGPU generation in Chromium on a self-hosted GPU runner.
name: "SDK: WebGPU inference (manual)"

# Explicit dispatch only: requires a runner labelled webgpu with a real GPU
# and a browser adapter exposing shader-f16. Hosted CI still compiles this
# backend and checks its Rust exports without needing a GPU.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-webgpu-${{ github.ref }}
  cancel-in-progress: true

jobs:
  inference:
    name: Rust/WebGPU generation
    runs-on: [self-hosted, linux, x64, webgpu]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          submodules: true
      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-cache: true
      - uses: ./.github/actions/bazel-repo-cache
        with:
          macos-sdk-mirror: ${{ vars.MACOS_SDK_MIRROR }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.9
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.2.2 --activate
      - name: Install dependencies
        working-directory: bindings/web
        run: pnpm install --frozen-lockfile
      - name: Build CPU and WebGPU package
        working-directory: bindings/web
        run: pnpm build
      - name: Build production browser example
        working-directory: bindings/web
        run: pnpm build:example
      - name: Install Chromium
        working-directory: bindings/web
        run: pnpm exec playwright install --with-deps chromium
      - name: Generate on WebGPU
        working-directory: bindings/web
        env:
          XYBRID_WEB_WEBGPU: '1'
        run: pnpm test:browser --grep 'WebGPU generates'
      - name: Upload browser results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: xybrid-webgpu-inference
          path: bindings/web/test-results/
          if-no-files-found: warn
