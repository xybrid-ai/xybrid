name: WebGPU browser inference

# Explicit dispatch only: requires a runner labelled webgpu with a real GPU
# and a browser adapter exposing shader-f16. Hosted CI still compiles this
# backend and checks its Rust exports without needing a GPU.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-webgpu-${{ github.ref }}
  cancel-in-progress: true

jobs:
  inference:
    name: Rust/WebGPU generation
    runs-on: [self-hosted, linux, x64, webgpu]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: true
      - uses: bazel-contrib/setup-bazel@4fd964a13a440a8aeb0be47350db2fc640f19ca8 # 0.15.0
        with:
          bazelisk-cache: true
      - uses: ./.github/actions/bazel-repo-cache
        with:
          macos-sdk-mirror: ${{ vars.MACOS_SDK_MIRROR }}
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.9
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.2.2 --activate
      - name: Install dependencies
        working-directory: bindings/web
        run: pnpm install --frozen-lockfile
      - name: Build CPU and WebGPU package
        working-directory: bindings/web
        run: pnpm build
      - name: Build production browser example
        working-directory: bindings/web
        run: pnpm build:example
      - name: Install Chromium
        working-directory: bindings/web
        run: pnpm exec playwright install --with-deps chromium
      - name: Generate on WebGPU
        working-directory: bindings/web
        env:
          XYBRID_WEB_WEBGPU: '1'
        run: pnpm test:browser --grep 'WebGPU generates'
      - name: Upload browser results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: xybrid-webgpu-inference
          path: bindings/web/test-results/
          if-no-files-found: warn
