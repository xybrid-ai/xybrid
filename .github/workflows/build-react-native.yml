# Purpose: Test and npm-pack the JS package; build Expo example apps from source; qualify the published package on current Expo.
name: "SDK: React Native"

# A lane: ci.yml's `React Native` job calls this file when one of the paths in
# LANE_PATHS["react_native"] (tools/scripts/ci_gate.py) changes, on pull requests and
# on master pushes, which keep master's caches warm for new branches. Its
# checks are named `React Native / <job>`. Dispatch it here to run it alone.
on:
  workflow_call:
    # Optional: forks and Dependabot pull requests receive none.
    secrets:
      BUILDBUDDY_API_KEY:
        required: false
  workflow_dispatch:

permissions: read-all

jobs:
  # Everything that needs no native toolchain beyond a JVM: types, the TS
  # facade against a fake native module, the Codegen-selector and bolt-parity
  # guards (tests/parity.test.mjs fails when crates/xybrid-bolt gains surface
  # React Native does not map — which is why this workflow triggers on bolt
  # changes), the Kotlin codec against the real bolt records, and what the
  # npm tarball would contain.
  js:
    name: Tests + npm pack
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bindings/react-native
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Use Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: bindings/react-native/package-lock.json

      - name: Set up JDK 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Types, unit tests, spec conformance, SDK parity
        run: npm test

      # The runner image ships kotlinc; a missing compiler fails the step.
      - name: Kotlin codec tests
        run: npm run test:android

      - name: Check the tarball contents
        run: node scripts/check-pack.mjs

      - name: npm pack
        run: npm pack

      - name: Upload tarball
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: xybrid-react-native-tarball
          path: bindings/react-native/xybrid-react-native-*.tgz
          if-no-files-found: error

  # The iOS half. First the cheap gate (issue #589): type-check every Swift
  # file of the module against the Swift SDK it ships with, and run the codec
  # tests — no Rust build needed. Then the real thing: build the Expo example
  # for the simulator against a Bazel-built XCFramework, which compiles the
  # ObjC++ forwarder against the Codegen protocol (missing selectors are
  # errors, see the podspec), links the Rust core, and runs Codegen's
  # module-provider wiring.
  ios:
    name: iOS (Swift checks + example build)
    # Same image as build-apple.yml: Xcode 26.x + an Apple Silicon host.
    runs-on: macos-26
    env:
      # Enables the remote-cache fast path below. Absent on fork PRs → the
      # config script writes nothing → a plain local Bazel build.
      BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: true  # Bazel //:llama_src = vendor/llama-cpp

      - name: Swift type-check + codec tests
        working-directory: bindings/react-native
        run: scripts/test-ios.sh

      - name: Ensure Bazel host tools
        run: |
          which cmake >/dev/null || brew install cmake
          which pkg-config >/dev/null || brew install pkg-config
          which xz >/dev/null || brew install xz

      # Remote CACHE only — iOS actions must run on this Mac.
      - name: Configure BuildBuddy remote-cache config
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: tools/scripts/write-buildbuddy-rc.sh

      - name: Cache the pinned macOS SDK
        uses: ./.github/actions/bazel-repo-cache
        with:
          macos-sdk-mirror: ${{ vars.MACOS_SDK_MIRROR }}

      - name: Build the XCFramework (Bazel)
        run: |
          set -euo pipefail
          REMOTE=""; [ -n "$BUILDBUDDY_API_KEY" ] && REMOTE="--config=remote-cache"
          # Repo fetches out of this runner occasionally fail TLS verification
          # mid-analysis; only a fresh invocation later recovers.
          for i in 1 2 3; do
            bazelisk build $REMOTE --config=ios //bindings/apple:XybridFFI && break
            [ "$i" = 3 ] && { echo "::error::bazel build failed after 3 attempts"; exit 1; }
            echo "::warning::bazel build attempt $i failed; retrying in 30s"; sleep 30
          done

      - name: Use Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4
        with:
          node-version: '22'

      - name: Install example deps
        working-directory: bindings/react-native/example
        run: npm ci --no-audit --no-fund

      - name: Expo prebuild (ios)
        working-directory: bindings/react-native/example
        run: CI=1 npx expo prebuild --platform ios --no-install

      # ios/xybrid_natives.rb picks the monorepo's bazel-bin zip on its own;
      # naming it keeps the job honest if that lookup ever changes.
      - name: pod install
        working-directory: bindings/react-native
        env:
          XYBRID_XCFRAMEWORK_PATH: ${{ github.workspace }}/bazel-bin/bindings/apple/XybridFFI.xcframework.zip
        run: bash scripts/pod-install.sh

      - name: Build the example (iOS Simulator)
        working-directory: bindings/react-native/example/ios
        run: |
          set -euo pipefail
          # Expo's ExpoModulesJSI build phase runs a nested xcodebuild that can
          # fail inside another xcodebuild; building its simulator slice first
          # (hash-cached) makes that phase a no-op.
          JSI=../node_modules/expo-modules-jsi/apple/scripts/build-xcframework.sh
          if [ -x "$JSI" ]; then
            PODS_ROOT="$PWD/Pods" RN_ROOT="$PWD/../node_modules/react-native" \
              PLATFORM_NAME=iphonesimulator "$JSI"
          fi
          xcodebuild build \
            -workspace example.xcworkspace \
            -scheme example \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO

  # The Android half: build the Expo example from working-tree source. This
  # compiles the bolt .so, publishes the Kotlin SDK to mavenLocal, runs RN
  # Codegen (XybridModule extends the generated NativeXybridSpec, so a spec
  # mismatch is a compile error) and assembles the APK. It does not run
  # inference (no emulator).
  android:
    name: Android (example build from source)
    runs-on: ubuntu-latest
    env:
      # Enables the RBE fast path below. Absent on fork PRs → local Bazel.
      BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: true  # //:llama_src = vendor/llama-cpp (the bolt .so builds via Bazel)

      # tool-cache: true reclaims /opt/hostedtoolcache (~10 GB) before the JDK
      # and Node setup steps re-provision what they need: the bolt .so builds
      # for every ABI and Gradle then assembles the APK, which previously ran
      # the runner out of disk.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: true
          android: false
          dotnet: true
          haskell: true
          large-packages: false
          swap-storage: true

      - name: Set up JDK 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: 17

      - name: Use Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4
        with:
          node-version: '22'

      - name: Setup Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          # Only platform-tools: the emulator download flakes and this job
          # never boots one. Gradle fetches build-tools/platforms on demand.
          packages: platform-tools

      # For the EXAMPLE APP's Gradle build (RN Codegen C++), not for our .so —
      # Bazel downloads its own pinned NDK in-build.
      - name: Install NDK
        run: sdkmanager --install "ndk;27.1.12297006"

      - name: Set NDK environment
        run: echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.1.12297006" >> $GITHUB_ENV

      - name: Configure BuildBuddy remote config
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: tools/scripts/write-buildbuddy-rc.sh

      - name: Cache the pinned macOS SDK
        uses: ./.github/actions/bazel-repo-cache
        with:
          macos-sdk-mirror: ${{ vars.MACOS_SDK_MIRROR }}

      # Build the bolt .so for all ABIs and stage the AAR's jniLibs into
      # bindings/kotlin/libs/, the layout Gradle publishes from. Same block
      # release-prep.yml and test-ci.yml use.
      - name: Build Android native libs
        run: |
          set -euo pipefail
          REMOTE=""; [ -n "$BUILDBUDDY_API_KEY" ] && REMOTE="--config=remote"
          bazelisk build $REMOTE -c opt //bindings/kotlin:xybrid_kotlin_aar
          rm -rf bindings/kotlin/libs && mkdir -p bindings/kotlin/libs /tmp/aar
          unzip -o -q bazel-bin/bindings/kotlin/xybrid-kotlin.aar 'jni/*' -d /tmp/aar
          cp -r /tmp/aar/jni/* bindings/kotlin/libs/
          # Headroom left for Gradle: the AAR build extracts the NDK twice
          # (@androidndk and @androidndk_api29, see MODULE.bazel), and this job
          # has run out of disk before.
          df -h /

      # No signing: guarded on signingInMemoryKey, absent here.
      - name: Publish xybrid-kotlin to mavenLocal
        working-directory: bindings/kotlin
        run: ./gradlew publishToMavenLocal --no-daemon

      - name: Install example deps
        working-directory: bindings/react-native/example
        run: npm ci --no-audit --no-fund

      # The example's config plugin puts mavenLocal() first, so the app links
      # the Kotlin SDK just published instead of the last release.
      - name: Expo prebuild (android)
        working-directory: bindings/react-native/example
        run: CI=1 npx expo prebuild --platform android --no-install

      - name: Assemble debug APK
        working-directory: bindings/react-native/example/android
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Upload example APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: xybrid-example-android-debug
          path: bindings/react-native/example/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  # Published-package qualification on current Expo: npm @xybrid/react-native
  # 0.18.0 + Maven Central + a Release APK with an embedded Hermes bundle, run
  # on an API 35 x86_64 emulator against pinned FunctionGemma 270M. No Bazel,
  # no mavenLocal, no Metro.
  consumer-smoke-android:
    name: Android consumer smoke (published Expo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Free disk space
        uses: ./.github/actions/free-disk-space

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up JDK 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: 17

      - name: Use Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: bindings/react-native/consumer-smoke/package-lock.json

      - name: Setup Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools

      - name: Install NDK
        run: sdkmanager --install "ndk;27.1.12297006"

      - name: Set NDK environment
        run: echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.1.12297006" >> $GITHUB_ENV

      - name: Fetch FunctionGemma 270M
        uses: ./.github/actions/fetch-model
        with:
          model: functiongemma-270m-it
          sha256: 83940d4dd9676710856f43523bed096164a595a96f6b34771610a03937de5270
          file: functiongemma-270m-it-q8_0.gguf

      - name: Install consumer-smoke deps
        working-directory: bindings/react-native/consumer-smoke
        run: npm ci --no-audit --no-fund

      - name: Expo prebuild (android)
        working-directory: bindings/react-native/consumer-smoke
        run: CI=1 npx expo prebuild --platform android --no-install

      # x86_64 only: the KVM emulator ABI. Release embeds the Hermes bundle.
      - name: Assemble Release APK
        working-directory: bindings/react-native/consumer-smoke/android
        env:
          ORG_GRADLE_PROJECT_reactNativeArchitectures: x86_64
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Pre-install Android Emulator (retry corrupt downloads)
        run: |
          set -u
          sdk="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          sdkmanager="$(command -v sdkmanager || true)"
          if [ -z "$sdkmanager" ]; then
            sdkmanager="$(ls "$sdk"/cmdline-tools/latest/bin/sdkmanager \
              "$sdk"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1 || true)"
          fi
          if [ -z "$sdkmanager" ]; then
            echo "::error::sdkmanager not found under $sdk"; exit 1
          fi
          echo "using sdkmanager: $sdkmanager"
          for i in $(seq 1 3); do
            if yes | "$sdkmanager" --install emulator --channel=0; then
              echo "emulator installed (attempt $i)"
              exit 0
            fi
            echo "::warning::emulator install attempt $i failed; clearing partial download and retrying"
            rm -rf "$sdk/emulator" "$sdk/.temp" "$sdk/.downloadIntermediates" || true
            sleep 10
          done
          echo "::error::emulator install failed after 3 attempts"
          exit 1

      - name: Run consumer smoke on the emulator
        uses: reactivecircus/android-emulator-runner@e89f39f1abbbd05b1113a29cf4db69e7540cae5a # v2.37.0
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: |
            set -euo pipefail
            APK=$(ls bindings/react-native/consumer-smoke/android/app/build/outputs/apk/release/*.apk | head -1)
            python3 tools/scripts/rn_consumer_smoke/run_android.py \
              --apk "$APK" \
              --model-dir integration-tests/fixtures/models/functiongemma-270m-it \
              --out-dir consumer-smoke-android \
              --timeout 600

      - name: Upload consumer-smoke Android artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: xybrid-consumer-smoke-android
          path: |
            consumer-smoke-android/
            bindings/react-native/consumer-smoke/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
          retention-days: 7

  # Same published-package qualification on an arm64 iOS Simulator (macos-26).
  # Pods resolve the release XCFramework from GitHub releases; no Bazel zip.
  consumer-smoke-ios:
    name: iOS consumer smoke (published Expo)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Use Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: bindings/react-native/consumer-smoke/package-lock.json

      - name: Fetch FunctionGemma 270M
        uses: ./.github/actions/fetch-model
        with:
          model: functiongemma-270m-it
          sha256: 83940d4dd9676710856f43523bed096164a595a96f6b34771610a03937de5270
          file: functiongemma-270m-it-q8_0.gguf

      - name: Install consumer-smoke deps
        working-directory: bindings/react-native/consumer-smoke
        run: npm ci --no-audit --no-fund

      - name: Expo prebuild (ios)
        working-directory: bindings/react-native/consumer-smoke
        run: CI=1 npx expo prebuild --platform ios --no-install

      - name: pod install
        working-directory: bindings/react-native/consumer-smoke/ios
        run: pod install

      - name: Boot simulator
        id: sim
        run: |
          set -euo pipefail
          SIM_ID="$(bindings/apple/scripts/boot-ci-simulator.sh 'Xybrid RN consumer smoke')"
          echo "udid=$SIM_ID" >> "$GITHUB_OUTPUT"

      - name: Build Release for the simulator
        working-directory: bindings/react-native/consumer-smoke/ios
        run: |
          set -euo pipefail
          JSI=../node_modules/expo-modules-jsi/apple/scripts/build-xcframework.sh
          if [ -x "$JSI" ]; then
            PODS_ROOT="$PWD/Pods" RN_ROOT="$PWD/../node_modules/react-native" \
              PLATFORM_NAME=iphonesimulator "$JSI"
          fi
          DERIVED="$RUNNER_TEMP/consumer-smoke-derived"
          xcodebuild build \
            -workspace consumer-smoke.xcworkspace \
            -scheme consumer-smoke \
            -configuration Release \
            -sdk iphonesimulator \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath "$DERIVED" \
            CODE_SIGNING_ALLOWED=NO
          APP="$(find "$DERIVED/Build/Products" -name 'consumer-smoke.app' -type d | head -1)"
          test -n "$APP"
          echo "APP=$APP" >> "$GITHUB_ENV"

      - name: Run consumer smoke on the simulator
        run: |
          set -euo pipefail
          python3 tools/scripts/rn_consumer_smoke/run_ios.py \
            --app "$APP" \
            --udid "${{ steps.sim.outputs.udid }}" \
            --model-dir integration-tests/fixtures/models/functiongemma-270m-it \
            --out-dir consumer-smoke-ios \
            --timeout 600

      - name: Upload consumer-smoke iOS artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: xybrid-consumer-smoke-ios
          path: consumer-smoke-ios/
          if-no-files-found: warn
          retention-days: 7
