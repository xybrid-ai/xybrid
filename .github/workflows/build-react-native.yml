name: Build React Native

on:
  pull_request:
    branches: [master]
    paths:
      - 'bindings/react-native/**'
      - 'bindings/apple/**'
      - 'bindings/kotlin/**'
      - 'crates/xybrid-bolt/**'
      - 'crates/xybrid-ffi-facade/**'
      - '.github/workflows/build-react-native.yml'
      # Docs-only changes under the paths above (READMEs, examples) never
      # affect the native build — exclude markdown so they don't trigger it.
      - '!**.md'
  # Run on master merges too, so each merge saves a default-branch-scoped
  # cache (sccache + rust-cache). GitHub Actions caches are branch-scoped:
  # a PR run can only restore caches from its own branch or the default
  # branch. Without this trigger master never builds, so master has no
  # cache, so every new PR branch's first run is cold. Warming master here
  # lets new branches start warm. Keep these paths in sync with the
  # pull_request trigger above.
  push:
    branches: [master]
    paths:
      - 'bindings/react-native/**'
      - 'bindings/apple/**'
      - 'bindings/kotlin/**'
      - 'crates/xybrid-bolt/**'
      - 'crates/xybrid-ffi-facade/**'
      - '.github/workflows/build-react-native.yml'
      - '!**.md'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: read-all

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Only iOS needs per-package native staging: the pod vendors the bolt
  # XCFramework + Swift wrapper sources. Android pulls its natives + Kotlin
  # binding from the `ai.xybrid:xybrid-kotlin` Maven AAR (declared in
  # android/build.gradle), so there is nothing to stage or cross-build here.

  # RN's iOS piece IS the Apple xcframework — since the Apple G4 flip it is
  # Bazel-built (the same //bindings/apple:XybridFFI the release and
  # build-apple.yml use), so this job now stages that instead of running its
  # own boltffi pack. The cargo-era helpers (iOS rust targets, boltffi CLI,
  # the ghcr llama-natives pull) are dead on this path and gone.
  stage-ios:
    name: Stage iOS artifacts
    runs-on: macos-14
    env:
      # Enables the remote-cache fast path below. Absent on fork PRs → the
      # config script writes nothing → a plain local Bazel build (slow but
      # correct).
      BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: true  # Bazel //:llama_src = vendor/llama-cpp

      # build:ios uses the host's preinstalled cmake/make/pkg-config for
      # rfcc's exec tools; xz decodes the fetched ort iOS-sim slice.
      - name: Ensure rfcc host tools
        run: |
          which cmake >/dev/null || brew install cmake
          which pkg-config >/dev/null || brew install pkg-config
          which xz >/dev/null || brew install xz

      # Remote CACHE only — never remote execution: iOS actions must run on
      # this Mac (Apple policy), but their results can still up/download from
      # BuildBuddy so identical macos-14 runners share work across jobs and
      # runs. The build step below adds --config=remote-cache when the key
      # is present.
      - name: Configure BuildBuddy remote-cache config
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: tools/scripts/write-buildbuddy-rc.sh

      # Build the xcframework with Bazel (same //bindings/apple:XybridFFI the
      # release and build-apple.yml use), then stage it + the committed bolt
      # Swift wrappers into the RN package tree, where the podspec vendors
      # them. Plain unzip/cp — npm pack needs the files physically in-tree.
      - name: Stage iOS artifacts
        run: |
          set -euo pipefail
          REMOTE=""; [ -n "$BUILDBUDDY_API_KEY" ] && REMOTE="--config=remote-cache"

          # Retry the whole invocation: repo fetches out of this runner
          # intermittently fail TLS verification mid-analysis —
          #   TLS error: (certificate_unknown) PKIX path building failed
          #   ... downloading rules_go-v0.59.0.zip
          # which aborts the build before a single action runs (seen on the
          # v0.5.0 release branch; the same job had passed 40 minutes earlier).
          # Bazel's own --experimental_repository_downloader_retries (default
          # 5) is already exhausted by then, so only a fresh invocation, later
          # in wall-clock time, recovers. Same shape as the emulator-install
          # retry in build-android.yml.
          for i in 1 2 3; do
            if bazelisk build $REMOTE --config=ios //bindings/apple:XybridFFI; then
              break
            fi
            if [ "$i" = 3 ]; then
              echo "::error::bazel build failed after 3 attempts"
              exit 1
            fi
            echo "::warning::bazel build attempt $i failed; retrying in 30s"
            sleep 30
          done

          RN_IOS="bindings/react-native/ios"
          ZIP="bazel-bin/bindings/apple/XybridFFI.xcframework.zip"
          [ -f "$ZIP" ] || { echo "Expected $ZIP after the Bazel build"; exit 1; }
          rm -rf "$RN_IOS/Frameworks/XybridFFI.xcframework"
          mkdir -p "$RN_IOS/Frameworks"
          unzip -o -q "$ZIP" -d "$RN_IOS/Frameworks"
          [ -d "$RN_IOS/Frameworks/XybridFFI.xcframework" ] \
            || { echo "Zip did not contain XybridFFI.xcframework/ at its root"; exit 1; }

          rm -rf "$RN_IOS/XybridSwift"
          mkdir -p "$RN_IOS/XybridSwift"
          for f in Xybrid.swift xybrid_bolt.swift; do
            cp "bindings/apple/Sources/Xybrid/$f" "$RN_IOS/XybridSwift/$f"
          done

      - name: Verify iOS staging
        run: |
          set -euo pipefail
          XCFW="bindings/react-native/ios/Frameworks/XybridFFI.xcframework"
          [ -d "$XCFW" ] || { echo "Missing $XCFW"; exit 1; }
          for f in Xybrid.swift xybrid_bolt.swift; do
            [ -f "bindings/react-native/ios/XybridSwift/$f" ] \
              || { echo "Missing bindings/react-native/ios/XybridSwift/$f"; exit 1; }
          done
          echo "iOS staging looks good:"
          ls -la "$XCFW"
          ls -la bindings/react-native/ios/XybridSwift/

      - name: Upload iOS staged artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rn-ios-staged
          path: |
            bindings/react-native/ios/Frameworks/
            bindings/react-native/ios/XybridSwift/
          if-no-files-found: error

  package:
    name: Typecheck + npm pack
    needs: stage-ios
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Use Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4
        with:
          node-version: '20'

      - name: Download iOS staged artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: rn-ios-staged
          path: bindings/react-native/ios/

      - name: Install RN module deps
        working-directory: bindings/react-native
        run: npm install --no-audit --no-fund

      - name: Typecheck
        working-directory: bindings/react-native
        run: npm run typecheck

      - name: Build TS
        working-directory: bindings/react-native
        run: npm run build

      - name: npm pack (dry-run)
        working-directory: bindings/react-native
        run: npm pack --dry-run

      - name: npm pack (real)
        working-directory: bindings/react-native
        run: npm pack

      - name: Upload tarball
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: react-native-xybrid-tarball
          path: bindings/react-native/react-native-xybrid-*.tgz
          if-no-files-found: error

  smoke-ios:
    name: Smoke build (iOS podspec lint)
    needs: stage-ios
    runs-on: macos-14
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Download iOS staged artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: rn-ios-staged
          path: bindings/react-native/ios/

      # `--quick` validates the podspec's syntax, file paths, and dependency
      # graph — which is what this gate is for. A full lint runs xcodebuild
      # against the spec in isolation, which fails for a RN TurboModule
      # because the spec depends on React Native's codegen output and headers
      # (e.g. `<React/RCTBridgeModule.h>`) that `pod lib lint` can't resolve
      # without a host app's `use_react_native!` setup. Replace with a real
      # `pod install` against an example app when one is added.
      - name: Lint podspec
        working-directory: bindings/react-native
        run: |
          pod lib lint react-native-xybrid.podspec \
            --allow-warnings \
            --quick \
            --verbose

  # The real end-to-end gate: build the Expo example app for Android from
  # working-tree source. This compiles the bolt .so, publishes the kotlin
  # binding to mavenLocal, runs RN codegen, and assembles the APK — the path
  # that would have caught every defect that previously slipped through
  # (non-exhaustive when, missing codegen wiring, version skew, .so strip).
  # It does NOT run inference (no emulator); assembleDebug proves the whole
  # build + link + autolink chain. Mirrors the documented local dev flow.
  build-android-example:
    name: Build Android example (from source)
    runs-on: ubuntu-latest
    env:
      # Enables the RBE fast path below. Absent on fork PRs → the config step
      # skips → the bazelisk build falls back to local execution (slow but
      # correct), same as before.
      BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: true  # //:llama_src = vendor/llama-cpp (the bolt .so builds via Bazel)

      # Keep large-packages (LLVM etc.): originally needed because the bolt
      # build ran bindgen over llama/ggml C++ via system libclang. That no
      # longer applies — the Bazel lane uses COMMITTED bindings
      # (crates/llama-cpp-sys/BUILD.bazel: committed-bindings, no bindgen, no
      # libclang). The keep is preserved precautionarily for the Gradle/Expo
      # Android toolchain; revisit (flip large-packages: true to reclaim the
      # headroom) once a run confirms the bolt .so + APK assemble without it.
      #
      # tool-cache: true reclaims /opt/hostedtoolcache (~10 GB). This step runs
      # first, before Set up JDK / Use Node.js, so those re-provision their
      # toolchains afterward — the build never reads the preinstalled cache.
      # The extra headroom is needed because the bolt .so compiles for every ABI
      # and Gradle then assembles the APK, which previously exhausted the
      # runner ("No space left on device") at assembleDebug.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: true
          android: false
          dotnet: true
          haskell: true
          large-packages: false
          swap-storage: true

      - name: Set up JDK 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: 17

      - name: Use Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4
        with:
          node-version: '20'

      - name: Setup Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          # Don't install the default `tools` package — it drags in the Android
          # Emulator (~1 GB), whose download flakes ("ZipFile unknown archive").
          # This job only builds the APK (assembleDebug); the NDK is installed
          # below and Gradle fetches build-tools/platform on demand. platform-tools
          # is kept for adb, which some Gradle Android tasks probe for.
          packages: platform-tools

      # The NDK here is for the EXAMPLE APP's gradle build (RN codegen C++),
      # not for our .so — Bazel downloads its own pinned NDK in-build.
      - name: Install NDK
        run: sdkmanager --install "ndk;27.1.12297006"

      - name: Set NDK environment
        run: echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.1.12297006" >> $GITHUB_ENV

      # RBE fast path: with this config present, the Bazel build below adds
      # --config=remote and the AAR graph resolves from BuildBuddy's cache
      # (kept warm by bazel.yml on every PR) instead of compiling ~1,900
      # crates + llama.cpp locally on a 2-core runner (~38 min → ~3).
      # On forks (no secret) the script writes nothing → local Bazel fallback.
      - name: Configure BuildBuddy remote config
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: tools/scripts/write-buildbuddy-rc.sh

      # 1. Build the bolt .so for all ABIs and stage the AAR's jniLibs into
      #    bindings/kotlin/libs/ — the layout Gradle publishes from
      #    (jniLibs.srcDirs("libs")). Same block release-prep.yml and
      #    test-ci.yml (publish-kotlin) use. Bazel end-to-end since #341.
      - name: Build Android native libs
        run: |
          set -euo pipefail
          REMOTE=""; [ -n "$BUILDBUDDY_API_KEY" ] && REMOTE="--config=remote"
          bazelisk build $REMOTE -c opt //bindings/kotlin:xybrid_kotlin_aar
          rm -rf bindings/kotlin/libs && mkdir -p bindings/kotlin/libs /tmp/aar
          unzip -o -q bazel-bin/bindings/kotlin/xybrid-kotlin.aar 'jni/*' -d /tmp/aar
          cp -r /tmp/aar/jni/* bindings/kotlin/libs/

      # 2. Publish the kotlin binding from source to mavenLocal (no signing —
      #    guarded on signingInMemoryKey, absent here).
      - name: Publish xybrid-kotlin to mavenLocal
        working-directory: bindings/kotlin
        run: ./gradlew publishToMavenLocal --no-daemon

      # 3. Build the example app: install JS deps, prebuild (codegen +
      #    config plugin → mavenLocal + keepDebugSymbols), assemble the APK.
      - name: Install example deps
        working-directory: bindings/react-native/example
        run: npm install --no-audit --no-fund

      - name: Expo prebuild (android)
        working-directory: bindings/react-native/example
        run: CI=1 npx expo prebuild --platform android --no-install

      - name: Assemble debug APK
        working-directory: bindings/react-native/example/android
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Upload example APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: xybrid-example-android-debug
          path: bindings/react-native/example/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
