name: Build React Native

on:
  pull_request:
    branches: [master]
    paths:
      - 'bindings/react-native/**'
      - 'bindings/apple/**'
      - 'bindings/kotlin/**'
      - 'crates/xybrid-bolt/**'
      - 'crates/xybrid-ffi-facade/**'
      - '.github/workflows/build-react-native.yml'
      # Docs-only changes under the paths above (READMEs, examples) never
      # affect the build — exclude markdown so they don't trigger it.
      - '!**.md'
  # Run on master merges too, so each merge saves a default-branch-scoped
  # cache. GitHub Actions caches are branch-scoped: a PR run can only restore
  # caches from its own branch or the default branch, so without this every
  # new PR branch's first run is cold. Keep these paths in sync with the
  # pull_request trigger above.
  push:
    branches: [master]
    paths:
      - 'bindings/react-native/**'
      - 'bindings/apple/**'
      - 'bindings/kotlin/**'
      - 'crates/xybrid-bolt/**'
      - 'crates/xybrid-ffi-facade/**'
      - '.github/workflows/build-react-native.yml'
      - '!**.md'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: read-all

jobs:
  # Everything that needs no native toolchain beyond a JVM: types, the TS
  # facade against a fake native module, the Codegen-selector and bolt-parity
  # guards (tests/parity.test.mjs fails when crates/xybrid-bolt gains surface
  # React Native does not map — which is why this workflow triggers on bolt
  # changes), the Kotlin codec against the real bolt records, and what the
  # npm tarball would contain.
  js:
    name: Tests + npm pack
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bindings/react-native
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Use Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: bindings/react-native/package-lock.json

      - name: Set up JDK 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Types, unit tests, spec conformance, SDK parity
        run: npm test

      # The runner image ships kotlinc; a missing compiler fails the step.
      - name: Kotlin codec tests
        run: npm run test:android

      - name: Check the tarball contents
        run: node scripts/check-pack.mjs

      - name: npm pack
        run: npm pack

      - name: Upload tarball
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: react-native-xybrid-tarball
          path: bindings/react-native/react-native-xybrid-*.tgz
          if-no-files-found: error

  # The iOS half. First the cheap gate (issue #589): type-check every Swift
  # file of the module against the Swift SDK it ships with, and run the codec
  # tests — no Rust build needed. Then the real thing: build the Expo example
  # for the simulator against a Bazel-built XCFramework, which compiles the
  # ObjC++ forwarder against the Codegen protocol (missing selectors are
  # errors, see the podspec), links the Rust core, and runs Codegen's
  # module-provider wiring.
  ios:
    name: iOS (Swift checks + example build)
    # Same image as build-apple.yml: Xcode 26.x + an Apple Silicon host.
    runs-on: macos-26
    env:
      # Enables the remote-cache fast path below. Absent on fork PRs → the
      # config script writes nothing → a plain local Bazel build.
      BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: true  # Bazel //:llama_src = vendor/llama-cpp

      - name: Swift type-check + codec tests
        working-directory: bindings/react-native
        run: scripts/test-ios.sh

      - name: Ensure Bazel host tools
        run: |
          which cmake >/dev/null || brew install cmake
          which pkg-config >/dev/null || brew install pkg-config
          which xz >/dev/null || brew install xz

      # Remote CACHE only — iOS actions must run on this Mac.
      - name: Configure BuildBuddy remote-cache config
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: tools/scripts/write-buildbuddy-rc.sh

      - name: Cache the pinned macOS SDK
        uses: ./.github/actions/bazel-repo-cache
        with:
          macos-sdk-mirror: ${{ vars.MACOS_SDK_MIRROR }}

      - name: Build the XCFramework (Bazel)
        run: |
          set -euo pipefail
          REMOTE=""; [ -n "$BUILDBUDDY_API_KEY" ] && REMOTE="--config=remote-cache"
          # Repo fetches out of this runner occasionally fail TLS verification
          # mid-analysis; only a fresh invocation later recovers.
          for i in 1 2 3; do
            bazelisk build $REMOTE --config=ios //bindings/apple:XybridFFI && break
            [ "$i" = 3 ] && { echo "::error::bazel build failed after 3 attempts"; exit 1; }
            echo "::warning::bazel build attempt $i failed; retrying in 30s"; sleep 30
          done

      - name: Use Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4
        with:
          node-version: '22'

      - name: Install example deps
        working-directory: bindings/react-native/example
        run: npm ci --no-audit --no-fund

      - name: Expo prebuild (ios)
        working-directory: bindings/react-native/example
        run: CI=1 npx expo prebuild --platform ios --no-install

      # ios/xybrid_natives.rb picks the monorepo's bazel-bin zip on its own;
      # naming it keeps the job honest if that lookup ever changes.
      - name: pod install
        working-directory: bindings/react-native/example/ios
        env:
          XYBRID_XCFRAMEWORK_PATH: ${{ github.workspace }}/bazel-bin/bindings/apple/XybridFFI.xcframework.zip
        run: pod install

      - name: Build the example (iOS Simulator)
        working-directory: bindings/react-native/example/ios
        run: |
          set -euo pipefail
          # Expo's ExpoModulesJSI build phase runs a nested xcodebuild that can
          # fail inside another xcodebuild; building its simulator slice first
          # (hash-cached) makes that phase a no-op.
          JSI=../node_modules/expo-modules-jsi/apple/scripts/build-xcframework.sh
          if [ -x "$JSI" ]; then
            PODS_ROOT="$PWD/Pods" RN_ROOT="$PWD/../node_modules/react-native" \
              PLATFORM_NAME=iphonesimulator "$JSI"
          fi
          xcodebuild build \
            -workspace example.xcworkspace \
            -scheme example \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO

  # The Android half: build the Expo example from working-tree source. This
  # compiles the bolt .so, publishes the Kotlin SDK to mavenLocal, runs RN
  # Codegen (XybridModule extends the generated NativeXybridSpec, so a spec
  # mismatch is a compile error) and assembles the APK. It does not run
  # inference (no emulator).
  android:
    name: Android (example build from source)
    runs-on: ubuntu-latest
    env:
      # Enables the RBE fast path below. Absent on fork PRs → local Bazel.
      BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: true  # //:llama_src = vendor/llama-cpp (the bolt .so builds via Bazel)

      # tool-cache: true reclaims /opt/hostedtoolcache (~10 GB) before the JDK
      # and Node setup steps re-provision what they need: the bolt .so builds
      # for every ABI and Gradle then assembles the APK, which previously ran
      # the runner out of disk.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: true
          android: false
          dotnet: true
          haskell: true
          large-packages: false
          swap-storage: true

      - name: Set up JDK 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: 17

      - name: Use Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4
        with:
          node-version: '22'

      - name: Setup Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          # Only platform-tools: the emulator download flakes and this job
          # never boots one. Gradle fetches build-tools/platforms on demand.
          packages: platform-tools

      # For the EXAMPLE APP's Gradle build (RN Codegen C++), not for our .so —
      # Bazel downloads its own pinned NDK in-build.
      - name: Install NDK
        run: sdkmanager --install "ndk;27.1.12297006"

      - name: Set NDK environment
        run: echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.1.12297006" >> $GITHUB_ENV

      - name: Configure BuildBuddy remote config
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: tools/scripts/write-buildbuddy-rc.sh

      - name: Cache the pinned macOS SDK
        uses: ./.github/actions/bazel-repo-cache
        with:
          macos-sdk-mirror: ${{ vars.MACOS_SDK_MIRROR }}

      # Build the bolt .so for all ABIs and stage the AAR's jniLibs into
      # bindings/kotlin/libs/, the layout Gradle publishes from. Same block
      # release-prep.yml and test-ci.yml use.
      - name: Build Android native libs
        run: |
          set -euo pipefail
          REMOTE=""; [ -n "$BUILDBUDDY_API_KEY" ] && REMOTE="--config=remote"
          bazelisk build $REMOTE -c opt //bindings/kotlin:xybrid_kotlin_aar
          rm -rf bindings/kotlin/libs && mkdir -p bindings/kotlin/libs /tmp/aar
          unzip -o -q bazel-bin/bindings/kotlin/xybrid-kotlin.aar 'jni/*' -d /tmp/aar
          cp -r /tmp/aar/jni/* bindings/kotlin/libs/

      # No signing: guarded on signingInMemoryKey, absent here.
      - name: Publish xybrid-kotlin to mavenLocal
        working-directory: bindings/kotlin
        run: ./gradlew publishToMavenLocal --no-daemon

      - name: Install example deps
        working-directory: bindings/react-native/example
        run: npm ci --no-audit --no-fund

      # The example's config plugin puts mavenLocal() first, so the app links
      # the Kotlin SDK just published instead of the last release.
      - name: Expo prebuild (android)
        working-directory: bindings/react-native/example
        run: CI=1 npx expo prebuild --platform android --no-install

      - name: Assemble debug APK
        working-directory: bindings/react-native/example/android
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Upload example APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: xybrid-example-android-debug
          path: bindings/react-native/example/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
