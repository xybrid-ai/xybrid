# Purpose: Build and verify the Apple XCFramework, then unit-test the Swift wrapper and run the observability runtime scenario on an iOS Simulator.
name: "SDK: Apple"

on:
  pull_request:
    branches: [master]
    paths:
      - 'bindings/apple/**'
      - 'crates/xybrid-bolt/**'
      - 'crates/xybrid-ffi-facade/**'
      - 'crates/xybrid-core/**'
      - 'crates/xybrid-sdk/**'
      - 'crates/xybrid-observability/**'
      - 'crates/xybrid-llama/**'
      - 'crates/llama-cpp-sys/**'
      # The Bazel graph that assembles the xcframework (G4): sim triple + ort-sys
      # annotation, the llama iOS arms, --config=ios, the fetched sim-ORT rule,
      # and the committed device ORT slice.
      - 'MODULE.bazel'
      - 'BUILD.bazel'
      - '.bazelrc'
      - 'bazel/**'
      - 'vendor/ort-ios/**'
      - 'Cargo.lock'
      - 'Cargo.toml'
      # The shared observability scenario the runtime job runs and checks.
      - 'tools/scripts/observability_capture/**'
      - '.github/workflows/build-apple.yml'
      # Docs-only changes under the paths above (READMEs, examples) never
      # affect the native build — exclude markdown so they don't trigger it.
      - '!**.md'
  # Run on master merges too, so the Bazel xcframework build stays green on the
  # default branch (and warms any future Bazel remote/disk cache — the build is
  # currently uncached, so a cold iOS build is ~15-20 min; caching is a follow-up).
  # Keep these paths in sync with the pull_request trigger above.
  push:
    branches: [master]
    paths:
      - 'bindings/apple/**'
      - 'crates/xybrid-bolt/**'
      - 'crates/xybrid-ffi-facade/**'
      - 'crates/xybrid-core/**'
      - 'crates/xybrid-sdk/**'
      - 'crates/xybrid-observability/**'
      - 'crates/xybrid-llama/**'
      - 'crates/llama-cpp-sys/**'
      - 'MODULE.bazel'
      - 'BUILD.bazel'
      - '.bazelrc'
      - 'bazel/**'
      - 'vendor/ort-ios/**'
      - 'Cargo.lock'
      - 'Cargo.toml'
      - 'tools/scripts/observability_capture/**'
      - '.github/workflows/build-apple.yml'
      - '!**.md'
  workflow_dispatch:

concurrency:
  group: build-apple-${{ github.ref }}
  cancel-in-progress: true

permissions: read-all

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build-xcframework:
    name: Build XCFramework
    # macos-26 (Xcode 26.6 default, iOS 26.5 simulator runtime) — the simulator
    # test step below needs a bootable device, and macos-14 is on its way out.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          # Bazel's //:llama_src globs the vendored llama.cpp submodule
          # (vendor/llama-cpp); without this the cmake source dir is empty and the
          # build fails "does not contain CMakeLists.txt". The old cargo path
          # didn't need it (build.rs cloned llama into OUT_DIR).
          submodules: true

      # Apple CI is Bazel-built — the SAME //bindings/apple:XybridFFI target the
      # release ships (device + simulator slices, G4). No cargo/boltffi/sccache/
      # oras scaffolding: Bazel uses rules_rs's own rust toolchain + cache, and the
      # C header / Swift wrapper are committed (boltffi is codegen-only). bazelisk
      # ships on macos runners and honors .bazelversion; --config=ios is Mac-LOCAL
      # (xcodebuild -create-xcframework, iphoneos/iphonesimulator SDKs) — never RBE.
      - name: Ensure Bazel host tools
        run: |
          which cmake >/dev/null || brew install cmake
          which pkg-config >/dev/null || brew install pkg-config
          which xz >/dev/null || brew install xz   # decodes the fetched sim ORT slice

      # Without this the macOS SDK is re-fetched from Apple's CDN every run, and
      # that pinned URL now 403s — see the action for the full failure mode.
      - name: Cache the pinned macOS SDK
        uses: ./.github/actions/bazel-repo-cache
        with:
          macos-sdk-mirror: ${{ vars.MACOS_SDK_MIRROR }}

      # Same --config=rust-lto as release-prep.yml: the steps below compile
      # the Swift wrapper and run its unit tests against this archive, so they
      # must exercise the LTO'd build that ships, not a differently-linked one.
      - name: Build XCFramework (Bazel)
        run: bazelisk build --config=ios --config=rust-lto //bindings/apple:XybridFFI

      - name: Stage XCFramework
        # Unzip the Bazel output to the path Package.swift's local-natives mode +
        # the artifact upload expect. apple_static_xcframework's zip root is
        # already XybridFFI.xcframework/, so this lands
        # bindings/apple/XCFrameworks/XybridFFI.xcframework/ (gitignored).
        run: |
          set -euo pipefail
          DEST="bindings/apple/XCFrameworks"
          rm -rf "$DEST/XybridFFI.xcframework"
          mkdir -p "$DEST"
          unzip -q -o bazel-bin/bindings/apple/XybridFFI.xcframework.zip -d "$DEST"

      - name: Verify XCFramework
        run: |
          set -euo pipefail
          XCFW="bindings/apple/XCFrameworks/XybridFFI.xcframework"
          test -d "$XCFW" || { echo "Error: XCFramework not found at $XCFW"; exit 1; }
          echo "XCFramework contents:"; ls -la "$XCFW"
          # Bazel's apple_static_xcframework emits a static FRAMEWORK per slice
          # (XybridFFI.framework/XybridFFI = an ar archive, no .a extension), one
          # dir per slice. Assert BOTH the device and simulator slices (G4) are
          # present, each a real Mach-O archive, and both are in the umbrella plist.
          for slice in ios-arm64 ios-arm64-simulator; do
            BIN="$XCFW/$slice/XybridFFI.framework/XybridFFI"
            test -f "$BIN" || { echo "Error: missing slice binary $BIN"; exit 1; }
            file "$BIN" | grep -qi 'archive' || { echo "Error: $BIN is not an ar archive"; exit 1; }
            grep -q "<string>$slice</string>" "$XCFW/Info.plist" || { echo "Error: $slice not in Info.plist"; exit 1; }
            echo "OK: $slice -> $(lipo -info "$BIN" | sed 's/.*: //')"
          done
          echo "XCFramework verify: device + simulator slices OK"

      - name: Compile Swift binding wrapper (iOS Simulator)
        # Compiles the hand-written Xybrid.swift + the bolt-generated
        # xybrid_bolt.swift into the SPM `Xybrid` library, so a wrapper break
        # (non-exhaustive errorDescription switch, a missing import, an
        # enum-shape mismatch vs the regenerated bindings) fails CI here instead
        # of only when a human builds the example app. Uses the xcframework
        # just built above: the committed state is useLocalNatives = false (so
        # SPM consumers resolve the published release asset), so this step flips
        # to local mode at CI runtime before resolving — otherwise it would try
        # to download the remote asset, which 404s on a release PR while the
        # v<version> release is still a draft. The flip is CI-only, never committed.
        #
        # Targets the iOS Simulator for two reasons: (1) the xcframework ships
        # only ios-arm64 + ios-arm64-simulator (bindings/apple/BUILD.bazel: ios =
        # device + simulator, no macOS), so a host/macOS build has no slice to
        # link — and this now links the G4 SIMULATOR slice end-to-end through the
        # Swift wrapper, the coverage that was previously local-only; (2) Xybrid.swift gates
        # `import UIKit` behind `#if os(iOS)`, so only an iOS build type-checks
        # the UIKit-conditional code — the code most likely to break. Compiles
        # the wrapper library ONLY (the example .xcodeproj has no shared scheme;
        # ContentView/LiveVision aren't built) and boots no simulator (generic
        # destination = compile + link, no run, no signing).
        run: |
          set -euo pipefail
          # CI-runtime flip to the locally-built xcframework. Do NOT commit this.
          ./bindings/apple/scripts/set-natives-mode.sh --set-local
          xcodebuild -resolvePackageDependencies
          xcodebuild build \
            -scheme Xybrid \
            -destination 'generic/platform=iOS Simulator' \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO

      - name: Run Swift unit tests (iOS Simulator)
        # The generic build above can't execute tests (no bootable device).
        # boot-ci-simulator.sh creates an iPhone on the newest available iOS
        # runtime and boots it, rather than naming a pre-created device (see the
        # script for why). Timeout guards against a simulator/test hang.
        timeout-minutes: 10
        run: |
          set -euo pipefail
          SIM_ID="$(./bindings/apple/scripts/boot-ci-simulator.sh)"
          xcodebuild test \
            -scheme Xybrid \
            -destination "platform=iOS Simulator,id=$SIM_ID" \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload XCFramework artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: XybridFFI-xcframework
          path: bindings/apple/XCFrameworks/XybridFFI.xcframework
          if-no-files-found: error

  observability-runtime:
    name: Observability runtime scenario (iOS Simulator)
    # Runs the shared observability scenario
    # (tools/scripts/observability_capture/scenario.md) through the public Swift
    # API on an iOS Simulator, linked against the xcframework the job above
    # built: parent-in, reference-out, manual operations, content redaction and
    # omission, release and the flush/shutdown lifecycle. run_scenario.py starts
    # capture_server.py, runs the test, stops the receiver and runs
    # check_capture.py on what reached it. This is the Swift row of
    # docs/sdk/observability-coverage.md.
    #
    # xcodebuild rather than `swift test --filter`: the xcframework ships only
    # ios-arm64 + ios-arm64-simulator and Package.swift declares iOS only, so a
    # macOS-host `swift test` has no slice to link. `-only-testing:` is the
    # filter. xcodebuild hands the test runner only TEST_RUNNER_-prefixed
    # variables (prefix stripped), hence the `env` below. The simulator reaches
    # the receiver on the host as 127.0.0.1 and reads and writes host paths.
    needs: build-xcframework
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Download XCFramework
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: XybridFFI-xcframework
          path: bindings/apple/XCFrameworks/XybridFFI.xcframework

      - name: Build Swift tests (iOS Simulator)
        run: |
          set -euo pipefail
          # CI-runtime flip to the downloaded xcframework. Do NOT commit this.
          ./bindings/apple/scripts/set-natives-mode.sh --set-local
          SIM_ID="$(./bindings/apple/scripts/boot-ci-simulator.sh "Xybrid observability iPhone")"
          echo "SIM_ID=$SIM_ID" >> "$GITHUB_ENV"
          xcodebuild build-for-testing \
            -scheme Xybrid \
            -destination "platform=iOS Simulator,id=$SIM_ID" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO

      - name: Run observability scenario (iOS Simulator)
        timeout-minutes: 10
        run: |
          set -euo pipefail
          # {endpoint}, {expectations} and {workdir} are run_scenario.py
          # placeholders, filled in once the receiver is listening.
          python3 tools/scripts/observability_capture/run_scenario.py \
            --binding swift --out-dir "$RUNNER_TEMP/observability-swift" --timeout 420 -- \
            env \
              "TEST_RUNNER_XYBRID_SCENARIO_ENDPOINT={endpoint}" \
              "TEST_RUNNER_XYBRID_SCENARIO_EXPECTATIONS={expectations}" \
              "TEST_RUNNER_XYBRID_SCENARIO_WORKDIR={workdir}" \
              "TEST_RUNNER_XYBRID_SCENARIO_SPEC=$GITHUB_WORKSPACE/tools/scripts/observability_capture/scenario.json" \
            xcodebuild test-without-building \
              -scheme Xybrid \
              -destination "platform=iOS Simulator,id=$SIM_ID" \
              -derivedDataPath "$RUNNER_TEMP/DerivedData" \
              -only-testing:XybridTests/ObservabilityRuntimeTests \
              -skipPackagePluginValidation \
              CODE_SIGNING_ALLOWED=NO

      - name: Upload scenario report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: observability-runtime-swift
          path: ${{ runner.temp }}/observability-swift
          if-no-files-found: warn
