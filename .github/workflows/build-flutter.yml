name: Build Flutter

on:
  pull_request:
    branches: [master]
    paths:
      - 'bindings/flutter/**'
      - 'crates/xybrid-ffi-facade/**'
      - 'xtask/**'
      - '.github/workflows/build-flutter.yml'
      # Docs-only changes under the paths above (READMEs, examples) never
      # affect the native build — exclude markdown so they don't trigger it.
      - '!**.md'
  # Run on master merges too, so each merge saves a default-branch-scoped
  # cache (sccache + rust-cache). GitHub Actions caches are branch-scoped:
  # a PR run can only restore caches from its own branch or the default
  # branch. Without this trigger master never builds, so master has no
  # cache, so every new PR branch's first run is cold. Warming master here
  # lets new branches start warm. Keep these paths in sync with the
  # pull_request trigger above.
  push:
    branches: [master]
    paths:
      - 'bindings/flutter/**'
      - 'crates/xybrid-ffi-facade/**'
      - 'xtask/**'
      - '.github/workflows/build-flutter.yml'
      - '!**.md'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: read-all

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  FLUTTER_VERSION: "3.35.7"
  FRB_VERSION: "2.11.1"

jobs:
  # Pure-Dart gate for the hand-written wrapper in bindings/flutter/lib.
  #
  # Cheap and native-free on purpose: the wrapper classes are plain Dart and
  # the cdylib is only dlopened by `Xybrid.init()`, which no unit test calls.
  # That means this job needs no Rust, no FRB codegen and no cargokit — it
  # runs in ~1 minute alongside the (much slower) native build below.
  #
  # No `dart format --set-exit-if-changed` gate: several checked-in wrapper
  # files predate one and would fail on untouched code. Reformat them in a
  # dedicated pass before adding that check.
  analyze-test-dart:
    name: Analyze + test Dart wrapper
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Flutter SDK
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install Dart dependencies
        working-directory: bindings/flutter
        run: flutter pub get

      - name: Analyze
        working-directory: bindings/flutter
        run: flutter analyze --no-pub

      - name: Test
        working-directory: bindings/flutter
        run: flutter test --no-pub

  # Linux-only on push/PR. macOS + Windows Flutter binaries are built and
  # validated in release-prep.yml (precompile-flutter-* jobs) at release time.
  # Use workflow_dispatch + test-ci.yml for ad-hoc per-platform validation.
  #
  # This job is deliberately cargo, not Bazel: it covers the CONTRIBUTOR
  # path. Inside the monorepo, `flutter run` → cargokit → `cargo build`
  # (cargokit's from-source branch — the published package downloads
  # precompiled binaries instead). Bazel is never in that loop, so pointing
  # this job at Bazel would stop testing the path contributors actually use.
  build-flutter:
    name: Build Flutter (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-latest
            rust_targets: x86_64-unknown-linux-gnu

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.rust_targets }}

      # sccache: caches individual compiler outputs (Rust + C/C++)
      # Uses GitHub Actions cache as backend (no external service needed)
      - name: Setup sccache
        uses: mozilla-actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad # v0.0.9

      - name: Configure sccache environment
        shell: bash
        run: |
          echo "SCCACHE_GHA_ENABLED=true" >> $GITHUB_ENV
          echo "RUSTC_WRAPPER=sccache" >> $GITHUB_ENV
          echo "CMAKE_C_COMPILER_LAUNCHER=sccache" >> $GITHUB_ENV
          echo "CMAKE_CXX_COMPILER_LAUNCHER=sccache" >> $GITHUB_ENV

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: "v1-rust"
          shared-key: "flutter-${{ matrix.platform }}"
          cache-all-crates: "true"
          save-if: "true"

      # Flutter SDK caching via subosito/flutter-action
      # Expected cache hit rate: ~99% (Flutter version changes rarely)
      # Cache includes: Flutter SDK (~1GB), pub cache
      - name: Install Flutter SDK
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install LLVM (Linux)
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y llvm-dev libclang-dev clang

      - name: Install LLVM (macOS)
        if: matrix.platform == 'macos'
        run: brew install llvm

      - name: Install LLVM and NASM (Windows)
        if: matrix.platform == 'windows'
        run: choco install llvm nasm

      - name: Add NASM to PATH (Windows)
        if: matrix.platform == 'windows'
        shell: bash
        run: echo "C:\\Program Files\\NASM" >> $GITHUB_PATH

      # Cache the FRB codegen binary to avoid compiling from source every run
      - name: Cache FRB codegen binary
        id: cache-frb
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/bin/flutter_rust_bridge_codegen
            ~/.cargo/bin/flutter_rust_bridge_codegen.exe
          key: frb-codegen-${{ runner.os }}-${{ env.FRB_VERSION }}

      - name: Install flutter_rust_bridge_codegen
        if: steps.cache-frb.outputs.cache-hit != 'true'
        run: cargo install flutter_rust_bridge_codegen@${{ env.FRB_VERSION }}

      - name: Force dynamic CRT on Windows (required for cdylib DLL linking)
        if: matrix.platform == 'windows'
        shell: bash
        run: |
          # Use -MD not /MD — Git Bash mangles /MD to C:/Program Files/Git/MD
          echo "CFLAGS=-MD" >> $GITHUB_ENV
          echo "CXXFLAGS=-MD" >> $GITHUB_ENV

      - name: Run FRB codegen
        working-directory: bindings/flutter
        run: flutter_rust_bridge_codegen generate

      - name: Check FRB bindings are up-to-date
        shell: bash
        run: |
          if ! git diff --exit-code bindings/flutter/lib/src/rust/; then
            echo ""
            echo "ERROR: Flutter Rust Bridge bindings are out of date."
            echo "A Rust API change was committed without regenerating Dart bindings."
            echo ""
            echo "Fix: run 'flutter_rust_bridge_codegen generate' in bindings/flutter/ and commit the result."
            exit 1
          fi
          echo "FRB bindings are up-to-date."

      # Prebuilt-natives fast path (Linux x86_64). Best-effort: pull the prebuilt
      # llama.cpp slice and point build.rs at it so the Linux Flutter build skips
      # the llama.cpp cmake compile. On ANY miss/error this is a silent no-op
      # (continue-on-error) and it compiles from source — it can never break the
      # build. Only the linux leg pulls (the only published non-android slice a
      # Flutter build consumes today; macOS/Windows legs build at release time).
      - name: Setup oras
        if: matrix.platform == 'linux'
        uses: oras-project/setup-oras@38de303aac69abb66f3e6255b7198bff35f323e3 # v2.0.0
      # `oras login` (not docker/login-action) for cross-platform consistency.
      # Best-effort + same-repo only (forks have no token → anonymous pull).
      - name: Log in to ghcr (best-effort, same-repo)
        if: matrix.platform == 'linux' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        continue-on-error: true
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Pull prebuilt natives (linux x86_64, best-effort)
        if: matrix.platform == 'linux'
        continue-on-error: true
        env:
          XYBRID_NATIVES_PKG: ghcr.io/xybrid-ai/llama-natives
        run: |
          DEST="$RUNNER_TEMP/natives"
          if tools/scripts/natives-pull.sh x86_64-unknown-linux-gnu vision "$DEST"; then
            echo "XYBRID_NATIVES_PREBUILT_DIR=$DEST" >> "$GITHUB_ENV"
            echo "prebuilt natives staged at $DEST (linux will skip cmake)"
          else
            echo "no prebuilt natives — compiles from source (unchanged)"
          fi

      - name: Build Flutter native library
        run: cargo xtask build-flutter --platform ${{ matrix.platform }} --release --skip-frb-codegen

      - name: Verify build output (Unix)
        if: runner.os != 'Windows'
        run: |
          set -euo pipefail
          echo "Build output for ${{ matrix.platform }}:"
          FOUND=$(find bindings/flutter/rust/target target -name "libxybrid_flutter_ffi*" -type f 2>/dev/null || true)
          if [ -z "$FOUND" ]; then
            echo "ERROR: no libxybrid_flutter_ffi* produced — the build claimed success but emitted nothing"
            exit 1
          fi
          echo "$FOUND"

      - name: Verify build output (Windows)
        if: runner.os == 'Windows'
        run: |
          Write-Output "Build output for ${{ matrix.platform }}:"
          Get-ChildItem -Path . -Recurse -Filter "xybrid_flutter_ffi*" -ErrorAction SilentlyContinue | Select-Object FullName

      - name: Upload Flutter native library artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: flutter-native-${{ matrix.platform }}
          path: |
            bindings/flutter/rust/target/**/release/*xybrid_flutter_ffi*
            target/**/release/*xybrid_flutter_ffi*
          if-no-files-found: error

  # Builds a scratch app against the package as consumers receive it, rather
  # than against the monorepo. The job above goes through `cargo xtask`, and
  # the release jobs go through cargokit's `precompile-binaries`, so neither
  # exercises `ArtifactProvider` — the code path that decides between a
  # downloaded binary and a source build. That gap let xybrid-ai/xybrid#338
  # ship: every consumer with a Rust toolchain installed was routed into a
  # source build the published package cannot perform, and CI was green
  # throughout.
  #
  # A Rust toolchain is installed here on purpose. It is the condition that
  # triggered the bug.
  packaged-consumer:
    name: Build a consumer app against the packaged layout
    runs-on: ubuntu-latest
    env:
      # Surfaces cargokit's decision (crate hash, precompiled on/off) in the
      # build log, which the assertions below read.
      CARGOKIT_VERBOSE: '1'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # stable
        with:
          toolchain: stable

      - name: Install Flutter SDK
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install Linux desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev

      # `git archive` gives us the committed tree only — no workspace root, no
      # `crates/`, no build output — which is what pub.dev serves. The extra
      # deletions mirror .pubignore entries that are gitignored anyway.
      - name: Materialize the packaged layout outside the workspace
        run: |
          set -euo pipefail
          PKG="$RUNNER_TEMP/pkg"
          mkdir -p "$PKG"
          git archive HEAD bindings/flutter | tar -x -C "$PKG"
          mv "$PKG/bindings/flutter" "$PKG/xybrid_flutter"
          rmdir "$PKG/bindings"
          rm -rf "$PKG/xybrid_flutter/android/src/main/jniLibs" \
                 "$PKG/xybrid_flutter/ios/Frameworks" \
                 "$PKG/xybrid_flutter/rust/target"
          if [ -e "$PKG/Cargo.toml" ] || [ -d "$PKG/crates" ]; then
            echo "::error::packaged layout is not isolated from the workspace"
            exit 1
          fi
          echo "PKG=$PKG" >> "$GITHUB_ENV"

      - name: Create a consumer app depending on it
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/consumer"
          flutter config --enable-linux-desktop
          flutter create --platforms=linux --project-name xybrid_consumer "$APP"
          python3 - "$APP/pubspec.yaml" "$PKG/xybrid_flutter" <<'PY'
          import sys
          pubspec, package = sys.argv[1], sys.argv[2]
          anchor = "dependencies:\n  flutter:\n    sdk: flutter\n"
          text = open(pubspec).read()
          assert anchor in text, "flutter create emitted an unexpected pubspec"
          open(pubspec, "w").write(
              text.replace(anchor, f"{anchor}  xybrid_flutter:\n    path: {package}\n", 1)
          )
          PY
          cd "$APP"
          flutter pub get
          echo "APP=$APP" >> "$GITHUB_ENV"

      # A failure here is not necessarily a problem — see the assertions below —
      # so record the status instead of letting the step abort on it.
      - name: Build it
        run: |
          cd "$APP"
          set +e
          flutter build linux --debug 2>&1 | tee "$RUNNER_TEMP/build.log"
          status=${PIPESTATUS[0]}
          set -e
          echo "BUILD_STATUS=$status" >> "$GITHUB_ENV"

      - name: Assert the packaged layout never falls back to a source build
        run: |
          set -euo pipefail
          LOG="$RUNNER_TEMP/build.log"

          # The published package cannot compile its Rust — no workspace root
          # to inherit `edition` from, and its xybrid-* path dependencies are
          # not shipped. Reaching cargo at all is the #338 regression.
          if grep -q 'Building xybrid_flutter for' "$LOG"; then
            echo "::error::cargokit ran a source build from the packaged layout"
            exit 1
          fi

          if [ "$BUILD_STATUS" -eq 0 ]; then
            if ! find "$APP/build" -type d -name precompiled | grep -q .; then
              echo "::error::build succeeded without downloading a precompiled binary"
              exit 1
            fi
            echo "::notice::consumer app linked the downloaded precompiled binary"
            exit 0
          fi

          # Expected when this commit changes bindings/flutter/rust: the crate
          # hash is new, so no precompiled_<hash> release exists yet. The
          # packaged layout still has to refuse the source fallback and say why.
          if grep -q 'No native library available for' "$LOG"; then
            echo "::notice::no precompiled release for this crate hash yet; the packaged layout correctly refused to fall back to a source build"
            exit 0
          fi

          echo "::error::consumer app failed to build for an unexpected reason"
          exit 1
