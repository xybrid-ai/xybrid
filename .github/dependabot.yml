version: 2
updates:
  # Rust (Cargo)
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - rust
    groups:
      rust-minor-patch:
        update-types:
          - minor
          - patch

  # GitHub Actions. "/" covers .github/workflows/ only; each composite action
  # under .github/actions/ is its own directory (test_ci_actions.py checks
  # that every one is listed).
  - package-ecosystem: github-actions
    directories:
      - "/"
      - "/.github/actions/bazel-repo-cache"
      - "/.github/actions/free-disk-space"
      - "/.github/actions/install-boltffi"
      - "/.github/actions/setup-rust"
      - "/.github/actions/setup-vulkan-sdk"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - ci
    groups:
      github-actions:
        patterns:
          - "*"
