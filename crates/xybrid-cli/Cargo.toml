[package]
name = "xybrid-cli"
version.workspace = true
edition.workspace = true

[[bin]]
name = "xybrid"
path = "src/main.rs"

[features]
default = []

# INDIVIDUAL FEATURE FORWARDING (for custom builds)
# These are the atomic features that forward to xybrid-sdk

# ONNX Runtime Execution Providers
ort-download = ["xybrid-sdk/ort-download"]
ort-dynamic = ["xybrid-sdk/ort-dynamic"]
ort-coreml = ["xybrid-sdk/ort-coreml"]

# Candle (Pure Rust ML)
candle = ["xybrid-sdk/candle"]
candle-hub = ["xybrid-sdk/candle-hub"]
candle-metal = ["xybrid-sdk/candle-metal"]
candle-cuda = ["xybrid-sdk/candle-cuda"]

# HuggingFace direct loading
huggingface = ["xybrid-sdk/huggingface"]

# ONNX model inspection (for `xybrid init`)
onnx-inspect = ["xybrid-sdk/onnx-inspect"]

# Local LLM inference
llm-mistral = ["xybrid-sdk/llm-mistral"]
llm-mistral-metal = ["xybrid-sdk/llm-mistral-metal"]
llm-mistral-cuda = ["xybrid-sdk/llm-mistral-cuda"]
llm-llamacpp = ["xybrid-sdk/llm-llamacpp"]
llm-llamacpp-vision = ["llm-llamacpp", "xybrid-sdk/llm-llamacpp-vision"]

# Speech recognition
asr-whispercpp = ["xybrid-sdk/asr-whispercpp"]

# PLATFORM PRESETS
#
# Each forwards to the matching `xybrid-sdk` preset rather than re-listing the
# backend set. The hand-listed version silently drifted: `asr-whispercpp` was
# added to the sdk presets but not here, so the cargo-built CLI shipped without
# whisper.cpp on every platform while the Bazel-built one had it (the Bazel
# target sets xybrid-core's features directly). Forwarding removes the whole
# class of drift — the backend set now has exactly one definition.
#
# `huggingface` is listed on top because it is genuinely CLI-only: `xybrid init`
# and direct `hf:` model loading need it, and the SDK presets do not carry it.
# Keep it explicit rather than pushing it into the sdk presets, which would
# grow every embedder's dependency tree for a CLI convenience.
#
# `llm-llamacpp` / `llm-mistral` are the only features this crate `#[cfg]`s on
# itself; the rest exist to be forwarded. (The previous comment here claimed the
# duplication was needed for local `#[cfg(feature = ...)]` checks — that was
# stale: no `candle*` cfg has ever appeared in this crate's src/.)
platform-android = ["xybrid-sdk/platform-android", "llm-llamacpp", "huggingface"]
platform-ios = ["xybrid-sdk/platform-ios", "llm-llamacpp", "huggingface"]
platform-macos = ["xybrid-sdk/platform-macos", "llm-llamacpp", "huggingface"]
platform-desktop = ["xybrid-sdk/platform-desktop", "llm-llamacpp", "huggingface"]


[dependencies]
xybrid-core = { path = "../xybrid-core", default-features = false }
xybrid-sdk = { path = "../xybrid-sdk", default-features = false }
clap = { version = "4.5", features = ["derive", "env"] }
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1.0"
anyhow = "1.0"
dirs = "6.0"
chrono = "0.4"
sha2 = "0.10"
colored = "2.1"
tempfile = "3.10"
uuid = { version = "1.0", features = ["v4"] }
lazy_static = "1.4"
hostname = "0.4"
# Built-in REPL tools (web_search / fetch_url)
ureq = { version = "2.9", default-features = false, features = ["json", "tls"] }
# CLI UI
indicatif = "0.17"
console = "0.16"
dialoguer = "0.12"
# Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-flame = "0.2"

[dev-dependencies]
image = "0.25"
