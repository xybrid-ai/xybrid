[package]
name = "xybrid-llama-sys"
version.workspace = true
edition.workspace = true
license = "MIT"
repository.workspace = true
description = "Raw FFI bindings to llama.cpp. Build-time clones + cmake-compiles the pinned upstream commit; first-party C++ shim lives in wrapper.cpp."
# Declares the native library this crate links. Cargo permits exactly one
# package per dependency graph to claim a given `links` name, so a consumer
# that pulls both this crate and another llama.cpp binding (e.g. crates.io's
# `llama-cpp-sys-2`, which also claims `llama`) now fails resolution with a
# clear conflict instead of silently static-linking two copies of the same
# ggml/llama archives into one binary. Name matches `llama-cpp-sys-2`'s on
# purpose — a distinct name would hide exactly the collision we want caught.
links = "llama"

# The llama.cpp source tree (~180MB) is fetched via the workspace-level
# submodule consumed by build.rs (`vendor/llama-cpp/`). This path does not live under this
# crate's manifest dir, so no `exclude` line is needed — they were never
# bundled into this crate's tarball to begin with. `wrapper.cpp` is
# first-party and ships unconditionally.

[lib]
name = "llama_cpp_sys"
path = "src/lib.rs"

[features]
# Default: empty crate that compiles on any target. Consumers opt in by
# enabling `bindings`, which pulls in the extern declarations and runs the
# cmake build via build.rs. This mirrors `mlx-c-sys`'s split so that
# `cargo check --workspace` on a Linux CI runner without a C++ toolchain
# can stay green.
default = []
bindings = []
vision = ["bindings"]
# Compile against the committed `src/bindings.rs` snapshot instead of the
# bindgen output freshly generated into $OUT_DIR. Exists for the Bazel path,
# which has no build script and therefore no bindgen/libclang; cargo builds
# should not enable it (the snapshot is generated without `vision` and does
# not track wrapper.h / llama.cpp bumps by itself — build.rs warns on drift).
committed-bindings = ["bindings"]

[build-dependencies]
# For compiling the wrapper.cpp shim and llama.cpp source. Carried at the
# crate level so the heavy build dependency is only paid when a downstream
# crate enables the `bindings` feature (CARGO_FEATURE_BINDINGS gate inside
# build.rs short-circuits otherwise).
cc = "1.0"
cmake = "0.1"
# Phase 5 of the `llamacpp-crate-split` epic: generate the FFI surface
# from `wrapper.h` via bindgen instead of the prior 26 hand-written
# extern declarations. Pinned to the same major as `mlx-c-sys`.
bindgen = "0.70"
# Automatic prebuilt-natives download (see the "Prebuilt natives" section of
# build.rs). Not optional: a build script cannot be feature-gated with
# `cfg(feature = ...)`, and this crate is itself an optional dependency of
# `xybrid-core`, so these are only ever compiled by a consumer who asked for
# `llm-llamacpp` — exactly the audience the download serves. Versions match
# what the workspace already resolves, so nothing new enters the lockfile.
ureq = { version = "2.9", default-features = false, features = ["tls"] }
sha2 = "0.10"
tar = "0.4"
flate2 = "1"
