[package]
name = "xybrid-mlx"
version.workspace = true
edition.workspace = true
license = "MIT"
repository.workspace = true
description = "Safe Rust wrappers over mlx-c for Apple Silicon MLX inference. Typed shapes, RAII handles, no global state."

[lib]
name = "xybrid_mlx"
path = "src/lib.rs"

[features]
# Default: empty crate that compiles on any target. Consumers opt in to the
# real MLX-linked implementation via `bindings`, which forwards to
# `mlx-c-sys/bindings` (link the xcframework) and pulls in `metal` for the
# zero-copy SharedBuffer path (US-008). Off by default so
# `cargo clippy --workspace` on Ubuntu CI runners stays clean — the MTLBuffer
# bindings are currently Apple Silicon macOS-only.
default = []
bindings = ["mlx-c-sys/bindings", "dep:metal"]

[dependencies]
mlx-c-sys = { path = "../mlx-c-sys", version = "0.4.0" }
thiserror = { workspace = true }
tracing = "0.1"

# MTLBuffer bindings for the SharedBuffer zero-copy path (US-008). The current
# runtime gate is Apple Silicon macOS; elsewhere the `bindings` feature is
# rejected by the top-level compile_error! in lib.rs.
[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
metal = { version = "0.29", optional = true }

[[bench]]
name = "zero_copy"
harness = false
required-features = ["bindings"]
