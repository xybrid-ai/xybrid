# OpenTelemetry Collector profile: canonical GenAI traces → Arize Phoenix
# (OpenInference semantic conventions).
#
# Instrumentation stays canonical (gen_ai.* + xybrid.genai.*); this profile
# adds the OpenInference dialect at export time only.
#
# Requires otelcol-contrib (transform processor). Validated with the otelcol-contrib
# release pinned in collector/README.md.
#
# Environment:
#   PHOENIX_OTLP_ENDPOINT   e.g. http://localhost:6006 (exporter appends /v1/traces)
#   PHOENIX_API_KEY         only with phoenix-auth.yaml, for Phoenix Cloud or an
#                           authenticated server: --config phoenix.yaml --config phoenix-auth.yaml
#
# Phoenix accepts traces only. Metrics and log events are discarded unless you
# add sinks.yaml: --config phoenix.yaml --config sinks.yaml

receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch: {}
  transform/openinference:
    error_mode: ignore
    trace_statements:
      - context: span
        statements:
          # openinference.span.kind is required by OpenInference.
          - set(attributes["openinference.span.kind"], "CHAIN")
          - set(attributes["openinference.span.kind"], "LLM") where attributes["gen_ai.operation.name"] == "chat" or attributes["gen_ai.operation.name"] == "text_completion" or attributes["gen_ai.operation.name"] == "generate_content"
          - set(attributes["openinference.span.kind"], "EMBEDDING") where attributes["gen_ai.operation.name"] == "embeddings"
          - set(attributes["openinference.span.kind"], "TOOL") where attributes["gen_ai.operation.name"] == "execute_tool"
          # Model and provider identity.
          - set(attributes["llm.model_name"], attributes["gen_ai.request.model"]) where attributes["gen_ai.request.model"] != nil and attributes["openinference.span.kind"] == "LLM"
          - set(attributes["llm.model_name"], attributes["gen_ai.response.model"]) where attributes["gen_ai.response.model"] != nil and attributes["openinference.span.kind"] == "LLM"
          - set(attributes["embedding.model_name"], attributes["gen_ai.request.model"]) where attributes["openinference.span.kind"] == "EMBEDDING"
          - set(attributes["llm.provider"], attributes["gen_ai.provider.name"]) where attributes["openinference.span.kind"] == "LLM"
          # Token usage (logical request totals only: attempts are CHAIN spans).
          - set(attributes["llm.token_count.prompt"], attributes["gen_ai.usage.input_tokens"]) where attributes["openinference.span.kind"] == "LLM" and attributes["gen_ai.usage.input_tokens"] != nil
          - set(attributes["llm.token_count.completion"], attributes["gen_ai.usage.output_tokens"]) where attributes["openinference.span.kind"] == "LLM" and attributes["gen_ai.usage.output_tokens"] != nil
          - set(attributes["llm.token_count.prompt_details.cache_read"], attributes["gen_ai.usage.cache_read.input_tokens"]) where attributes["openinference.span.kind"] == "LLM" and attributes["gen_ai.usage.cache_read.input_tokens"] != nil
          - set(attributes["llm.token_count.completion_details.reasoning"], attributes["gen_ai.usage.reasoning.output_tokens"]) where attributes["openinference.span.kind"] == "LLM" and attributes["gen_ai.usage.reasoning.output_tokens"] != nil
          # Content.
          - set(attributes["input.value"], attributes["gen_ai.input.messages"]) where attributes["gen_ai.input.messages"] != nil
          - set(attributes["input.mime_type"], "application/json") where attributes["gen_ai.input.messages"] != nil
          - set(attributes["output.value"], attributes["gen_ai.output.messages"]) where attributes["gen_ai.output.messages"] != nil
          - set(attributes["output.mime_type"], "application/json") where attributes["gen_ai.output.messages"] != nil
          - set(attributes["tool.name"], attributes["gen_ai.tool.name"]) where attributes["gen_ai.tool.name"] != nil
          - set(attributes["tool.description"], attributes["gen_ai.tool.description"]) where attributes["gen_ai.tool.description"] != nil
          - set(attributes["input.value"], attributes["gen_ai.tool.call.arguments"]) where attributes["gen_ai.tool.call.arguments"] != nil
          - set(attributes["input.mime_type"], "application/json") where attributes["gen_ai.tool.call.arguments"] != nil
          - set(attributes["output.value"], attributes["gen_ai.tool.call.result"]) where attributes["gen_ai.tool.call.result"] != nil
          - set(attributes["output.mime_type"], "application/json") where attributes["gen_ai.tool.call.result"] != nil
          - set(attributes["session.id"], attributes["gen_ai.conversation.id"]) where attributes["gen_ai.conversation.id"] != nil

exporters:
  # No Authorization header here, so an unauthenticated server never sees an
  # empty "Bearer " value; phoenix-auth.yaml adds it.
  otlphttp/phoenix:
    endpoint: ${env:PHOENIX_OTLP_ENDPOINT}
  # Metrics and log events are discarded unless sinks.yaml is added
  # (--config <profile> --config sinks.yaml); a traces-only setup still starts.
  nop: {}

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [transform/openinference, batch]
      exporters: [otlphttp/phoenix]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [nop]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [nop]
