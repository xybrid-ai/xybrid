[package]
name = "xybrid-observability"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Portable OpenTelemetry instrumentation for AI inference, workflows, tools and model loading, following the GenAI semantic conventions."
readme = "README.md"
documentation = "https://docs.rs/xybrid-observability"
keywords = ["opentelemetry", "observability", "genai", "llm", "tracing"]
categories = ["development-tools::debugging", "development-tools::profiling"]
include = ["src/**", "contract/**", "collector/**", "examples/**", "tests/**", "README.md", "CONTRACT.md"]

[lib]
name = "xybrid_observability"
path = "src/lib.rs"

[dependencies]
opentelemetry = { version = "0.33", default-features = false, features = ["trace", "metrics", "logs"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
log = "0.4"

# OTLP/HTTP pipeline and paired exporters (feature `otlp`). The package owns
# its transport end to end: opentelemetry-proto messages encoded with prost or
# serde, sent by reqwest (rustls, no OpenSSL) on a private Tokio runtime.
opentelemetry_sdk = { version = "0.33", default-features = false, features = ["trace", "metrics", "logs"], optional = true }
opentelemetry-proto = { version = "0.33", default-features = false, features = ["gen-tonic-messages", "trace", "logs", "metrics", "with-serde"], optional = true }
prost = { version = "0.14", default-features = false, features = ["std"], optional = true }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"], optional = true }
tokio = { version = "1.0", default-features = false, features = ["rt", "rt-multi-thread", "time", "sync", "net"], optional = true }
tokio-util = { version = "0.7", default-features = false, optional = true }
httpdate = { version = "1", optional = true }

[dev-dependencies]
opentelemetry_sdk = { version = "0.33", default-features = false, features = ["trace", "metrics", "logs", "testing"] }
httpmock = "0.7"
tokio = { version = "1.0", features = ["rt", "rt-multi-thread", "macros", "time"] }

[features]
default = ["otlp"]
otlp = [
    "dep:opentelemetry_sdk",
    "dep:opentelemetry-proto",
    "dep:prost",
    "dep:reqwest",
    "dep:tokio",
    "dep:tokio-util",
    "dep:httpdate",
]
# Manual clock for deterministic tests (M-TEST-UTIL).
test-util = []

[[test]]
name = "contract_fixtures"
path = "tests/contract_fixtures.rs"
required-features = ["test-util"]

[[test]]
name = "pipeline"
path = "tests/pipeline.rs"
required-features = ["otlp"]

[[example]]
name = "standalone"
path = "examples/standalone.rs"
required-features = ["otlp"]

[package.metadata.docs.rs]
all-features = true
