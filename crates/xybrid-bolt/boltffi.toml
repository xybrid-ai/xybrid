experimental = []

[cargo]
global_args = []

[cargo.command_args]

[package]
name = "xybrid-bolt"

[targets.apple]
enabled = true
output = "dist/apple"
deployment_target = "16.0"
include_macos = false
# Skip the x86_64-apple-ios simulator slice: `ort-sys` (ONNX Runtime
# bindings transitively pulled in via `xybrid-sdk/platform-ios`) doesn't
# ship prebuilt binaries for that target. Apple-Silicon Macs run the
# iOS simulator on the arm64 slice anyway; the x86_64 slice would only
# matter for Intel-Mac developers, who would need to compile ONNX
# Runtime from source.
simulator_architectures = ["arm64"]

[targets.apple.swift]
# Matches the existing `import Xybrid` line in
# examples/ios/XybridExample/ContentView.swift so the migration to
# bolt-generated bindings doesn't require touching the example's imports.
module_name = "Xybrid"
tools_version = "5.9"
error_style = "throwing"

[targets.apple.swift.type_mappings]

[targets.apple.header]

[targets.apple.xcframework]

[targets.apple.spm]
distribution = "local"
layout = "ffi-only"
skip_package_swift = false

[targets.apple.debug_symbols]
enabled = false
format = "zip"
bundle = "unstripped"

[targets.android]
enabled = true
output = "dist/android"
min_sdk = 24
# 32-bit x86 (i686) is intentionally omitted. It is emulator-only (no real
# devices ship it), was already a non-first-class target with no vendored ORT
# slice, and the native vision (mtmd/ggml) backend added in 0.2.0 does not
# compile for 32-bit x86. Ship arm64-v8a + armeabi-v7a + x86_64.
architectures = ["arm64", "armv7", "x86_64"]

[targets.android.kotlin]
# Matches the existing `import ai.xybrid.…` lines in
# examples/android and bindings/kotlin so the migration to
# bolt-generated bindings doesn't force the consumer to re-import.
package = "ai.xybrid"
desktop_loader = "bundled"
api_style = "top_level"
error_style = "throwing"
factory_style = "constructors"

[targets.android.kotlin.type_mappings]

[targets.android.header]

[targets.android.pack]

[targets.android.debug_symbols]
enabled = false
format = "zip"
bundle = "unstripped"

[targets.wasm]
enabled = true
triple = "wasm32-unknown-unknown"
profile = "release"
output = "dist/wasm"

[targets.wasm.optimize]

[targets.wasm.typescript.type_mappings]

[targets.wasm.npm]

[targets.java.jvm]
enabled = false
output = "dist/java"
strip_symbols = false

[targets.java.jvm.debug_symbols]
enabled = false
format = "zip"
bundle = "unstripped"

[targets.java.android]
enabled = false
output = "dist/java/android"
min_sdk = 24

[targets.dart]
output = "dist/dart"
enabled = false

# Python stays disabled: boltffi 0.25.3's python target is experimental and
# silently drops everything the SDK actually needs (fallible functions,
# `#[export]` handle types like XybridModel, data-carrying enums like
# XybridError/XybridEnvelopeKind) — see boltffi_bindgen 0.25.3
# render/python/lower (ReturnDef::Result => None). Full python support lands
# in boltffi >= 0.26. Until the workspace migrates, the Python SDK in
# bindings/python hand-ports the wire layer (ctypes over the xybrid-bolt
# cdylib), using the generated Swift in bindings/apple as the wire spec.
# When the boltffi pin moves to >= 0.26: enable this target and replace the
# hand-ported `xybrid/_bolt.py` with generator output.
[targets.python]
output = "dist/python"
enabled = false
module_name = "xybrid_bolt"

[targets.python.wheel]

# Enabled for the Unity-on-bolt migration (chapter A, step A0). `boltffi
# generate csharp` writes the raw bindings here (dist/ is git-ignored); the
# committed, Unity-ready copy lives in bindings/unity/Runtime/Bolt and is
# produced by tools/scripts/gen_unity_bolt_csharp.py. That script applies one
# deterministic post-process: boltffi 0.25.3 emits `NativeMemory.Alloc` in
# FfiBuf.FromBytes (a .NET 6 API absent from Unity's Mono/IL2CPP scripting
# profile), rewritten to Marshal.AllocHGlobal so the sources compile under
# Unity. The default namespace (XybridBolt) and DllImport name (xybrid_bolt)
# are already what the Unity package wants, so no further config is needed.
[targets.csharp]
output = "dist/csharp"
enabled = true
